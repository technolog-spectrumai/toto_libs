{% extends "oya/base.html" %}
{% load static %}

{% block title %}Org Chart | {{ platform.site_name }}{% endblock %}
{% block start_script %}

<style>
:root {
  --bg-color: #ffffff;
  --text-color: #333333;
}
[data-theme="dark"] {
  --bg-color: #1a1a1a;
  --text-color: #eaeaea;
}
body {
  background-color: var(--bg-color);
  color: var(--text-color);
}
</style>

{% endblock %}
{% block content %}
<section class="px-6 py-20 min-h-screen">
  <div class="max-w-6xl mx-auto p-8 rounded-xl shadow-lg space-y-10">

    <header class="space-y-4 text-center">
      <h1 class="text-3xl font-extrabold">Organization Chart</h1>
      <div class="max-w-sm mx-auto">
        <label for="company" class="block text-sm font-medium mb-1 text-text-main-light dark:text-text-main-dark">
          Choose Company
        </label>
        <select name="company" id="company"
          :class="darkMode
            ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
            : 'bg-primary-bg-light text-text-main-light border-accent-2'"
          class="w-full px-3 py-2 rounded border transition-colors duration-300">
          {% for company in companies %}
            <option value="{{ company.slug }}" {% if company.slug == selected_company_slug %}selected{% endif %}>
              {{ company.name }}
            </option>
          {% endfor %}
        </select>
      </div>
    </header>

    <div id="orgchart-container" class="w-full overflow-x-auto"></div>

  </div>
</section>

<script src="https://balkan.app/js/OrgChart.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("orgchart-container");
    const companySelect = document.getElementById("company");

    let chart;

    const toggleButton = document.querySelector(".site-theme-toggle-button");
    if (!toggleButton) return;

    toggleButton.addEventListener("click", () => {
        chart.config.template = getThemeTemplate();
        chart.draw();
    });

    let colors = {{ theme.theme.colors|safe }};

    function getThemeTemplate() {
      const root = document.documentElement;
      const darkMode = Alpine.evaluate(root, 'darkMode');

      // Determine theme suffix
      const themeSuffix = darkMode ? 'dark' : 'light';
        const canvasColor = colors[`primary-bg-${themeSuffix}`];

        const svg = document.querySelector("#orgchart-container");
        if (svg) {
          svg.style.backgroundColor = canvasColor;
          svg.style.transition = "background-color 0.3s ease";
        }
      // Pull colors from your Tailwind-defined map
      const bgColor = colors[`bubble-bg-${themeSuffix}`];
      const textColor = colors[`text-main-${themeSuffix}`];
      const accentColor = colors[`accent-${themeSuffix}`];

      // Clone and customize the template
      OrgChart.templates.customTemplate = Object.assign({}, OrgChart.templates.ana);
      OrgChart.templates.customTemplate.img =
        `<clipPath id="{randId}">
            <rect fill="${bgColor}" stroke="${textColor}" stroke-width="5" x="10" y="10" rx="10" ry="10" width="80" height="100"></rect>
        </clipPath>
        <image preserveAspectRatio="xMidYMid slice" clip-path="url(#{randId})" xlink:href="{val}" x="10" y="10" width="80" height="100"></image>
        <rect fill="none" stroke="${accentColor}" stroke-width="2" x="10" y="10" rx="10" ry="10" width="80" height="100"></rect>`;
        OrgChart.templates.customTemplate.node = `
          <rect x="0" y="0" width="{w}" height="{h}" fill="${bgColor}" rx="10" ry="10"
                stroke="${accentColor}" stroke-width="2"></rect>
        `;
        OrgChart.templates.customTemplate.field_0 =`<text class="field_0" x="120" y="30" fill="${textColor}" font-size="16">{val}</text>`;
        OrgChart.templates.customTemplate.field_1 =`<text class="field_1" x="120" y="50" fill="${textColor}" font-size="12">{val}</text>`;
      return "customTemplate";
    }

let editForm = function () {
};

editForm.prototype.init = function (obj) {
    this.chart = obj;
};

editForm.prototype.show = function (nodeId) {
    this.hide();
    let node = this.chart.get(nodeId);
    const darkMode = Alpine.evaluate(document.documentElement, 'darkMode');
    const themeSuffix = darkMode ? 'dark' : 'light';
    const bgColor = colors[`bubble-bg-${themeSuffix}`];
    const textColor = colors[`text-main-${themeSuffix}`];
    const accentColor = colors[`accent-${themeSuffix}`];

    let editHtml =
        `<table cellpadding="0" cellspacing="0" class="t" style="border: 2px solid ${accentColor}; border-radius: 8px;">
            <tr>
                <td colspan="2" class="t-img" style="padding: 12px; text-align: center;">
                    <img height="32px" width="32px"  style="border-radius: 50%; border: 2px solid ${accentColor};" src="${node.img}" />
                </td>
            </tr>`;

    const renderers = {
        activity: (value, accentColor, textColor) =>
            `<td class="t-val" style="padding: 8px; color: ${textColor}; font-weight: normal;">
                <a href="/community/posts/${value}" style="color: ${accentColor}; text-decoration: underline;">Recent Posts</a>
            </td>`,

        profile: (value, accentColor, textColor) =>
            `<td class="t-val" style="padding: 8px; color: ${textColor}; font-weight: normal;">
                <a href="/community/profile/${value}" style="color: ${accentColor}; text-decoration: underline;">Profile</a>
            </td>`
    };

    function renderRow(key, value, textColor, accentColor) {
        const labelCell = `<td class="t-name" style="padding: 8px; color: ${textColor}; font-weight: bold;">${key}</td>`;
        const valueCell = renderers[key]
            ? renderers[key](value, accentColor, textColor)
            : `<td class="t-val" style="padding: 8px; color: ${textColor}; font-weight: normal;">${value}</td>`;
        return `<tr>${labelCell}${valueCell}</tr>`;
    }

    editHtml += `<tr><td class="t-name" style="height: 8px;"></td><td class="t-val"></td></tr>`;
    const excludedKeys = ['id', 'pid', 'img'];

    for (const key in node) {
        if (!excludedKeys.includes(key)) {
            editHtml += renderRow(key, node[key], textColor, accentColor);
        }
    }
    editHtml += `<tr><td class="t-name" style="height: 8px;"></td><td class="t-val"></td></tr></table>`;

    let div = document.createElement("div");
    div.id = 'edit-form';
    div.innerHTML = editHtml;
    div.style.position = 'absolute';
    div.style.top = '10px';
    div.style.right = '-100px';
    div.style.opacity = 0;
    div.style.backgroundColor = bgColor;
    div.style.boxShadow = `0 4px 6px -1px rgba(0, 0, 0, 0.1)`;
    div.style.borderRadius = '8px';
    div.style.transition = 'background-color 0.3s ease';

    this.chart.element.appendChild(div);

    OrgChart.animate(div, { opacity: 0, right: -100 }, { opacity: 1, right: 10 }, 300, OrgChart.anim.outSin);
};

editForm.prototype.hide = function (showldUpdateTheNode) {
    let form = this.chart.element.querySelector('#edit-form');
    if (form) {
        form.parentNode.removeChild(form);
    }
};

    chart = new OrgChart(container, {
      template: getThemeTemplate(),
      enableSearch: false,
      nodeBinding: {
        field_0: "name",
        field_1: "title",
        img: "img"
      },
      editUI: new editForm(),
    });

    const loadChart = async (companySlug) => {
      if (!companySlug) return;

      // Optional: show loading state
      container.classList.add("opacity-50");

      try {
        const response = await fetch(`/community/org-chart/data/?company=${companySlug}`);
        const { nodes } = await response.json();
        //console.log("===>", nodes[0]);
        chart.load(nodes);
      } catch (error) {
        console.error("Failed to load org chart:", error);
      } finally {
        container.classList.remove("opacity-50");
      }
    };

    // Initial load
    loadChart(companySelect.value);

    // Reload on change
    companySelect.addEventListener("change", (e) => {
      loadChart(e.target.value);
    });
  });
</script>

{% endblock %}
