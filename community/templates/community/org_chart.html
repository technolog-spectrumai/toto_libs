{% extends "oya/base.html" %}
{% load static %}

{% block title %}Org Chart | {{ platform.site_name }}{% endblock %}

{% block content %}
<section class="px-6 py-20 min-h-screen">
  <div class="max-w-6xl mx-auto p-8 rounded-xl shadow-lg space-y-10">

    <header class="space-y-4 text-center">
      <h1 class="text-3xl font-extrabold">Organization Chart</h1>
      <form method="get" class="max-w-sm mx-auto">
        <label for="company" class="block text-sm font-medium mb-1">Choose Company</label>
            <select name="company" id="company"
              :class="darkMode
                ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                : 'bg-primary-bg-light text-text-main-light border-accent-2'"
              class="w-full px-3 py-2 rounded border transition-colors duration-300"
              onchange="this.form.submit()">

          {% for company in companies %}
            <option value="{{ company.pk }}" {% if company.pk|stringformat:"s" == selected_company_id %}selected{% endif %}>
              {{ company.name }}
            </option>
          {% endfor %}
        </select>
      </form>
    </header>

    <div id="orgchart-container" class="w-full overflow-x-auto"></div>

  </div>
</section>

<script src="https://balkan.app/js/OrgChart.js"></script>
<script>
  const chart = new OrgChart(document.getElementById("orgchart-container"), {
    template: "luba",
    enableSearch: false,
    nodeBinding: {
      field_0: "name",
      field_1: "title",
      img_0: "img"
    }
  });

fetch("{% url 'community:org-chart-data' %}?company={{ selected_company_id }}")
  .then(response => response.json())
  .then(data => {
    console.log("Org chart data:", data); // 👈 This prints the data to the browser console
    chart.load(data.nodes);
  });
</script>
{% endblock %}
