{% extends "oya/base.html" %}
{% load static %}

{% block title %}Org Chart | {{ platform.site_name }}{% endblock %}
{% block start_script %}

<style>
:root {
  --bg-color: #ffffff;
  --text-color: #333333;
}
[data-theme="dark"] {
  --bg-color: #1a1a1a;
  --text-color: #eaeaea;
}
body {
  background-color: var(--bg-color);
  color: var(--text-color);
}
</style>

{% endblock %}
{% block content %}
<section class="px-6 py-20 min-h-screen">
  <div class="max-w-6xl mx-auto p-8 rounded-xl shadow-lg space-y-10">

    <header class="space-y-4 text-center">
      <h1 class="text-3xl font-extrabold">Organization Chart</h1>
      <div class="max-w-sm mx-auto">
        <label for="company" class="block text-sm font-medium mb-1 text-text-main-light dark:text-text-main-dark">
          Choose Company
        </label>
        <select name="company" id="company"
          :class="darkMode
            ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
            : 'bg-primary-bg-light text-text-main-light border-accent-2'"
          class="w-full px-3 py-2 rounded border transition-colors duration-300">
          {% for company in companies %}
            <option value="{{ company.slug }}" {% if company.slug == selected_company_slug %}selected{% endif %}>
              {{ company.name }}
            </option>
          {% endfor %}
        </select>
      </div>
    </header>

    <div @notify="alert('huj')" id="orgchart-container" @themeToggled="alert('foo was dispatched')" class="w-full overflow-x-auto"></div>

  </div>
</section>

<script src="https://balkan.app/js/OrgChart.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("orgchart-container");
    const companySelect = document.getElementById("company");

    let chart;

    const toggleButton = document.querySelector(".site-theme-toggle-button");
    console.log(toggleButton);
    if (!toggleButton) return;

    toggleButton.addEventListener("click", () => {
        chart.config.template = getThemeTemplate();
        chart.draw();
    });

    function getThemeTemplate() {
      const root = document.documentElement;
      const darkMode = Alpine.evaluate(root, 'darkMode');
      return darkMode ? "luba" : "ana";
    }

    chart = new OrgChart(container, {
      template: getThemeTemplate(),
      enableSearch: false,
      nodeBinding: {
        field_0: "name",
        field_1: "title",
        img_0: "img"
      },
      nodeMenu: {
        details: { text: "View Profile" }
      }
    });

    const loadChart = async (companySlug) => {
      if (!companySlug) return;

      // Optional: show loading state
      container.classList.add("opacity-50");

      try {
        const response = await fetch(`/community/org-chart/data/?company=${companySlug}`);
        const { nodes } = await response.json();
        chart.load(nodes);
      } catch (error) {
        console.error("Failed to load org chart:", error);
      } finally {
        container.classList.remove("opacity-50");
      }
    };

    // Initial load
    loadChart(companySelect.value);

    // Reload on change
    companySelect.addEventListener("change", (e) => {
      loadChart(e.target.value);
    });
  });
</script>

{% endblock %}
