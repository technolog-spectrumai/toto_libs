{% extends "oya/base.html" %}
{% load static %}

{% block title %}Welcome | {{ platform.site_name }}{% endblock %}

{% block content %}
<section
  :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark' : 'bg-primary-bg-light text-text-main-light'"
  class="flex flex-col items-center justify-center px-6 py-16 min-h-screen transition-colors duration-300 text-center">

  <h1 :class="darkMode ? 'text-accent-dark' : 'text-accent-light'"
      class="text-3xl font-bold mb-4">
    Welcome to {{ platform.site_name }}
  </h1>

  <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">
    Your identity has been verified and your token is active.
  </p>

  <!-- 🕊️ Hardcoded SVG Seal -->
  <div class="w-32 h-32 mb-10">
    <div class="animate-spin-slow">
      <svg viewBox="0 0 100 100" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="#4B5563" stroke-width="5" fill="none"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
              font-size="12" fill="#4B5563" font-family="serif">
          FEDERAL SEAL
        </text>
      </svg>
    </div>
    <style>
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 12s linear infinite;
      }
    </style>
  </div>

  <a href="{% url 'nest:dashboard' %}"
     :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
     class="inline-block px-6 py-2 rounded font-semibold hover:opacity-90 transition text-sm">
    Go to Dashboard
  </a>
</section>
{% endblock %}
