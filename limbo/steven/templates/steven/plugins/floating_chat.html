{% load i18n %}
{% if agent %}
<div
  x-data="{ open: false, loading: false, activeTarget: 'No active target' }"
  x-init="
    document.addEventListener('functional-zone:active-changed', e => {
      activeTarget = e.detail.zone ? `${e.detail.zone.label} — ${e.detail.zone.language}` : 'No active target';
    });
    const initialZone = window.FunctionalZones && window.FunctionalZones.getActiveZone();
    if (initialZone) activeTarget = `${initialZone.label} — ${initialZone.language}`;
  "
  x-on:steven-open.window="open = true"
  class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3"
>
  <!-- Chat panel -->
  <div
    x-show="open"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 translate-y-4 scale-95"
    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0 scale-100"
    x-transition:leave-end="opacity-0 translate-y-4 scale-95"
    :class="darkMode ? 'bg-bubble-bg-dark text-text-main-dark border-accent-dark/30' : 'bg-bubble-bg-light text-text-main-light border-accent-light/30'"
    class="w-80 rounded-2xl border shadow-2xl overflow-hidden"
    style="display: none;"
  >
    <!-- Header -->
    <div
      :class="darkMode ? 'bg-appbar-bg-dark text-appbar-text-dark' : 'bg-appbar-bg-light text-appbar-text-light'"
      class="flex items-center justify-between px-4 py-3"
    >
      <div class="flex items-center gap-2 text-sm font-semibold">
        <i class="fa-solid fa-robot text-xs"></i>
        <span>{{ agent.name }}</span>
        {% if steven_stub_reason %}
        <span class="text-[10px] font-normal opacity-60 ml-1">(stub)</span>
        {% endif %}
      </div>
      <button @click="open = false" class="opacity-60 hover:opacity-100 transition text-xs">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    {% if steven_debug and steven_stub_reason %}
    <!-- DEBUG stub notice -->
    <div class="px-3 py-2 text-xs font-mono border-b" :class="darkMode ? 'bg-caution-dark/10 text-caution-dark border-caution-dark/30' : 'bg-caution-light/10 text-caution-light border-caution-light/30'">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i>
      {{ steven_stub_reason }}
    </div>
    {% endif %}

    <!-- Result area -->
    <div
      id="steven-chat-result"
      :class="darkMode ? 'bg-primary-bg-dark/60' : 'bg-primary-bg-light/60'"
      class="min-h-20 max-h-60 overflow-y-auto px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap"
    ></div>

    <!-- Form -->
    <form
      hx-post="{% url 'steven:quick_ask' agent.slug %}"
      hx-target="#steven-chat-result"
      hx-swap="innerHTML"
      hx-indicator="#steven-chat-spinner"
      @htmx:before-request="loading = true"
      @htmx:after-request="loading = false"
      class="flex flex-col gap-2 px-4 py-3 border-t"
      :class="darkMode ? 'border-accent-dark/20' : 'border-accent-light/20'"
    >
      {% csrf_token %}
      <textarea
        data-steven-prompt
        name="user_prompt"
        rows="3"
        placeholder="Ask {{ agent.name }} something…"
        required
        :class="darkMode
          ? 'bg-primary-bg-dark text-text-main-dark placeholder:text-text-main-dark/40 border-accent-dark/30'
          : 'bg-primary-bg-light text-text-main-light placeholder:text-text-main-light/40 border-accent-light/30'"
        class="w-full resize-none rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-current/20 transition"
      ></textarea>
      <span
        id="steven-float-cost-hint"
        class="block text-right font-mono text-[11px] opacity-40 -mt-1 min-h-[1em]"
        aria-live="polite"
      ></span>
      <button
        type="submit"
        :disabled="loading"
        :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
        class="flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition hover:opacity-90 disabled:opacity-50"
      >
        <span id="steven-chat-spinner" class="htmx-indicator">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </span>
        <span x-text="loading ? 'Thinking…' : 'Ask'"></span>
      </button>
      <div
        :class="darkMode ? 'text-text-main-dark/55' : 'text-text-main-light/55'"
        class="flex items-center gap-1.5 border-t border-current/10 pt-2 text-[11px] font-semibold"
      >
        <i class="fa-solid fa-bullseye text-[10px]"></i>
        <span>{% trans "Active target:" %}</span>
        <span x-text="activeTarget"></span>
      </div>
    </form>
  </div>

  <!-- Toggle button -->
  <button
    @click="open = !open"
    :class="darkMode ? 'bg-accent-dark text-primary-bg-dark shadow-accent-dark/30' : 'bg-accent-light text-primary-bg-light shadow-accent-light/30'"
    class="flex items-center gap-2 rounded-full px-5 py-3 text-sm font-bold shadow-lg transition hover:scale-105 active:scale-95"
    title="{% trans 'Ask AI' %}"
  >
    <i class="fa-solid fa-robot"></i>
    <span x-text="open ? 'Close' : 'Ask AI'"></span>
  </button>
</div>

<script>
(function () {
  const ta   = document.querySelector('[data-steven-prompt]');
  const hint = document.getElementById("steven-float-cost-hint");
  const url  = "{% url 'steven:estimate_cost' agent.slug %}";
  if (!ta || !hint) return;
  let timer;
  ta.addEventListener("input", () => {
    clearTimeout(timer);
    hint.textContent = "";
    const chars = ta.value.trim().length;
    if (chars < 4) return;
    timer = setTimeout(async () => {
      try {
        const r = await fetch(`${url}?chars=${chars}`);
        const d = await r.json();
        hint.textContent = d.estimate ? `~${d.estimate} ${d.unit}` : "";
      } catch { hint.textContent = ""; }
    }, 600);
  });
})();

document.body.addEventListener("htmx:responseError", event => {
  if (event.detail?.target?.id !== "steven-chat-result") return;
  const result = event.detail.target;
  result.textContent = "Steven could not answer. No content was imported or applied.";
  result.dataset.functionalZoneParsed = "true";
});
</script>

{% elif steven_debug %}
<!-- DEBUG: agent not seeded — run manage.py ingress_steven -->
<div class="fixed bottom-6 right-6 z-50" title="{% trans 'Steven: no active agent found. Run: manage.py ingress_steven' %}">
  <button
    disabled
    class="flex items-center gap-2 rounded-full px-5 py-3 text-sm font-bold shadow-lg opacity-40 cursor-not-allowed bg-gray-500 text-white"
  >
    <i class="fa-solid fa-robot"></i>
    <span>{% trans "Ask AI" %}</span>
  </button>
  <div class="mt-1 text-center text-[10px] font-mono text-gray-500">
    no agent — run ingress_steven
  </div>
</div>
{% endif %}
