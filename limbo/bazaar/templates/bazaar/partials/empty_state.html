{% load i18n %}
<div :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'" class="rounded-2xl border border-dashed p-8 text-center">
  <i class="{{ icon|default:'fa-solid fa-store-slash' }} text-3xl opacity-30"></i>
  <p class="mt-3 text-sm opacity-70">{{ message|default:'Nothing here yet.' }}</p>
  {% if action_url and action_label %}
    <a href="{{ action_url }}" :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'" class="mt-4 inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow-sm transition hover:opacity-90"><i class="fa-solid fa-plus"></i> {{ action_label }}</a>
  {% endif %}
</div>
