{% load i18n %}
{# Include with: {% include "assets/partials/mini_flow.html" with mini_fetch_url=... mini_id="account-flow" %} #}
<section
  :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
  class="rounded-lg border p-5 shadow-sm">
  <div class="flex items-center justify-between gap-2">
    <h3 class="flex items-center gap-2 text-lg font-bold">
      <i class="fa-solid fa-diagram-project"></i>
      {% trans "Flow graph" %}
    </h3>
    <div class="flex gap-2">
      <button type="button" onclick="miniGraphs['{{ mini_id }}'].fit()"
        :class="darkMode ? 'border-accent-1' : 'border-accent-2'"
        class="inline-flex items-center gap-1 rounded-lg border px-2 py-1 text-xs font-semibold transition hover:opacity-80">
        <i class="fa-solid fa-expand"></i> {% trans "Fit" %}
      </button>
      <a href="{{ mini_full_url }}" target="_blank"
        :class="darkMode ? 'border-accent-1' : 'border-accent-2'"
        class="inline-flex items-center gap-1 rounded-lg border px-2 py-1 text-xs font-semibold transition hover:opacity-80">
        <i class="fa-solid fa-up-right-from-square"></i> {% trans "Full" %}
      </a>
    </div>
  </div>

  <div class="relative mt-4">
    <div id="flow-tooltip-{{ mini_id }}"
      :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
      class="absolute right-2 top-2 z-20 hidden max-w-[220px] rounded-xl border p-3 shadow-lg text-xs space-y-1">
      <div class="font-bold" data-field="label"></div>
      <div class="opacity-60"><span data-field="type"></span></div>
      <div class="opacity-70 break-all" data-field="reference"></div>
      <a data-field="link" href="#" target="_blank"
        :class="darkMode ? 'text-accent-dark' : 'text-accent-light'"
        class="inline-flex items-center gap-1 font-semibold underline-offset-4 hover:underline">
        {% trans "Open" %} <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </a>
    </div>

    <div id="flow-container-{{ mini_id }}"
      :class="darkMode ? 'border-accent-1' : 'border-accent-2'"
      class="h-64 rounded-lg border">
    </div>
  </div>

  <!-- Legend -->
  <div class="mt-3 flex flex-wrap gap-3 text-xs opacity-60">
    <span class="flex items-center gap-1"><span class="inline-block h-1.5 w-4 rounded" style="background:#22c55e"></span>{% trans "Create" %}</span>
    <span class="flex items-center gap-1"><span class="inline-block h-1.5 w-4 rounded" style="background:#3b82f6"></span>{% trans "Transfer" %}</span>
    <span class="flex items-center gap-1"><span class="inline-block h-1.5 w-4 rounded" style="background:#ef4444"></span>{% trans "Reversal" %}</span>
  </div>
</section>

<script>
if (typeof miniGraphs === 'undefined') window.miniGraphs = {};
document.addEventListener('DOMContentLoaded', () => {
  miniGraphs['{{ mini_id }}'] = initFlowGraph({
    fetchUrl:    '{{ mini_fetch_url }}',
    containerId: 'flow-container-{{ mini_id }}',
    tooltipId:   'flow-tooltip-{{ mini_id }}',
    colors:      typeof _flowColors !== 'undefined' ? _flowColors : {},
  });
});
</script>
