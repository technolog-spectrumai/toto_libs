<section x-data="paginate({ perPage: 8 })" x-init="init()">
  <h2 class="text-2xl font-bold mb-4">Accounts</h2>

  <!-- Desktop Table -->
  <div class="hidden md:block overflow-x-auto">
    <table class="min-w-full text-sm border rounded">
      <thead>
        <tr class="text-left border-b">
          <th class="px-4 py-2">Owner</th>
          <th class="px-4 py-2">Account Name</th>
          <th class="px-4 py-2">Currency</th>
          <th class="px-4 py-2">Balance</th>
          <th class="px-4 py-2">Manager</th>
          <th class="px-4 py-2">Action</th>
        </tr>
      </thead>

      <tbody x-ref="items">
        {% for account in accounts %}
        <tr class="border-b">
          <td class="px-4 py-2">{{ account.owner.username }}</td>
          <td class="px-4 py-2 font-medium">{{ account.name }}</td>
          <td class="px-4 py-2">{{ account.currency.symbol }}</td>
          <td class="px-4 py-2">{{ account.balance }}</td>
          <td class="px-4 py-2">
            {% if account.manager %}
              {{ account.manager.username }}
            {% else %}
              —
            {% endif %}
          </td>
          <td class="px-4 py-2">
            <a href="{% url 'finance:account-detail' account.pk %}"
               class="underline text-blue-600 dark:text-blue-400">
              View
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- Pagination Controls -->
  <div class="mt-6 flex justify-center items-center gap-4 text-sm">
    <button @click="prev" :disabled="page === 1"
            class="px-3 py-1 border rounded disabled:opacity-50">
      Prev
    </button>

    <span>Page <span x-text="page"></span> of <span x-text="pages"></span></span>

    <button @click="next" :disabled="page === pages"
            class="px-3 py-1 border rounded disabled:opacity-50">
      Next
    </button>
  </div>
</section>
