<div class="mt-4 p-4"
     :class="darkMode
        ? 'bg-bubble-bg-dark text-text-main-dark'
        : 'bg-bubble-bg-light text-text-main-light'
     "
     x-data="formWidget()">

  <!-- Form -->
  <form @submit.prevent="console.log('Form submitted:', formData)">

    {% for field in widget.fields %}
      <div class="mb-4">

        <!-- Label -->
        <label class="block mb-1 font-medium">
          {{ field.label }}
          {% if field.required %}<span class="text-red-500">*</span>{% endif %}
        </label>

        <!-- Boolean checkbox -->
        {% if field.type == "checkbox" %}
          <label class="flex items-center gap-2 cursor-pointer">

            <input type="checkbox"
                   x-model="formData['{{ field.name }}']"
                   class="h-4 w-4 rounded border appearance-none
                          checked:before:content-['✓']
                          checked:before:block
                          checked:before:text-xs
                          checked:before:text-center
                          checked:before:leading-4
                          transition-colors duration-150"
                   :class="darkMode
                      ? 'border-text-main-dark bg-transparent checked:bg-accent-1 checked:border-accent-1 checked:before:text-black'
                      : 'border-text-main-light bg-transparent checked:bg-accent-2 checked:border-accent-2 checked:before:text-white'
                   " />

            <span>{{ field.label }}</span>

          </label>
        {% elif field.type == "select" %}
          <select x-model="formData['{{ field.name }}']"
                  class="w-full px-3 py-2 rounded border"
                  :class="darkMode
                      ? 'bg-bubble-bg-dark border-text-main-dark text-text-main-dark'
                      : 'bg-bubble-bg-light border-text-main-light text-text-main-light'
                  ">
              {% for option in field.choices %}
                  <option value="{{ option.value }}">{{ option.label }}</option>
              {% endfor %}
          </select>
        {% else %}
          <input type="{{ field.type }}"
                 x-model="formData['{{ field.name }}']"
                 x-ref="field_{{ field.name }}"
                 placeholder="{{ field.placeholder }}"
                 {% if field.required %}required{% endif %}
                 class="w-full px-3 py-2 rounded border"
                 :class="darkMode
                     ? 'bg-bubble-bg-dark border-text-main-dark'
                     : 'bg-bubble-bg-light border-text-main-light'
                 " />
        {% endif %}

      </div>
    {% endfor %}

    <!-- Submit button -->
    <button type="submit"
            class="px-4 py-2 rounded font-semibold"
            :class="darkMode
                ? 'bg-accent-1 text-black'
                : 'bg-accent-2 text-white'
            ">
      {{ widget.submit_label }}
    </button>

  </form>
</div>
