<div x-data="{ open: false, openYamlModal: false, widgetId: '{{ widget.id }}' }"
     class="w-full p-4 rounded border relative"
     :class="darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2'">

  <!-- Show Data button -->
  <button
    class="absolute top-2 right-2 text-xs px-2 py-1 rounded border z-10"
    :class="darkMode ? 'border-accent-1' : 'border-accent-2'"
    @click.stop="openYamlModal = true">
    Show Data
  </button>

  <!-- Header -->
  <div class="flex justify-between items-center cursor-pointer mt-6"
       @click="open = !open">

    <h3 class="text-xl font-semibold mb-2">{{ widget.title }}</h3>

    <i class="fa-solid fa-chevron-down transition-transform duration-300 ml-3"
       :class="open ? 'rotate-180' : 'rotate-0'"></i>
  </div>

  <!-- Collapsible content -->
  <div x-show="open" x-collapse class="mt-3">

      <p>  {{ widget.type}} | {{ widget.id}} </p>

  </div>

  <!-- YAML Modal -->
  {% include "webfront/partials/modal.html" with widget_id=widget.id %}

  <script>
    const data_{{widget.id}} = JSON.parse('{{ widget.data|escapejs }}');
    console.log(data_{{widget.id}});
    const yamlText_{{widget.id}} = jsyaml.dump(data_{{widget.id}});
    document.getElementById("yaml-{{widget.id}}").textContent = yamlText_{{widget.id}};
  </script>
</div>
