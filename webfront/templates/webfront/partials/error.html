<div
  class="p-4 rounded border transition-colors duration-300"
  :class="darkMode
      ? 'bg-primary-dark border-warn-dark text-text-main-dark'
      : 'bg-primary-light border-warn-light text-text-main-light'">

  <h3 class="text-lg font-semibold"
      :class="darkMode ? 'text-warn-dark' : 'text-warn-light'">
      Error
  </h3>

  <p class="text-sm mt-2 whitespace-pre-wrap">
      {{ text }}
  </p>
</div>
