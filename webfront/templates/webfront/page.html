{% extends "oya/base.html" %}
{% load static %}
{% load include_from_db %}

{% block title %}{{ page.title }}{% endblock %}

{% block start_script %}

{% endblock %}

{% block content %}
<div
  :class="darkMode
    ? 'bg-primary-bg-dark text-text-main-dark'
    : 'bg-primary-bg-light text-text-main-light'"
  class="min-h-screen px-4 py-10 transition-colors duration-300">

  <div class="max-w-4xl mx-auto space-y-12">
    <!-- 📝 Page Content -->
    <section>
      <h2 class="text-2xl font-bold mb-4">{{ page.title }}</h2>
      <div class="p-4 rounded border"
           :class="darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2'">
        {{ page.body|safe }}
      </div>
    </section>
  </div>
</div>

<div class="mt-8 text-center">
  <a href="{% url 'nest:dashboard' %}"
     class="underline text-blue-600 dark:text-blue-400">
    ← Back to Dashboard
  </a>
</div>
{% endblock %}
{% block end_script %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    {{ page.script|safe }}
</script>
{% endblock %}
