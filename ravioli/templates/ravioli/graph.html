{% extends "oya/base.html" %}
{% load static %}

{% block title %}Graph Explorer – {{ platform.site_name }}{% endblock %}

{% block content %}
<div
  :class="darkMode
    ? 'bg-primary-bg-dark text-text-main-dark'
    : 'bg-primary-bg-light text-text-main-light'"
  class="min-h-screen px-4 py-10 transition-colors duration-300">

  <div class="max-w-6xl mx-auto space-y-8">

    <!-- 🌐 Graph Header -->
    <section class="p-6 rounded-lg border transition-colors duration-300"
      :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                       : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      <h1 class="text-2xl font-bold mb-2">{{title}}</h1>
      <p class="text-sm"
         :class="darkMode ? 'text-text-main-dark' : 'text-gray-500'">
        Interactive visualization of your graph database.
      </p>
    </section>

    <section
      :class="darkMode
        ? 'bg-primary-bg-dark text-text-main-dark border border-accent-1'
        : 'bg-primary-bg-light text-text-main-light border border-accent-2'"
      class="p-4 sm:p-6 rounded-lg">
      <header class="space-y-3 sm:space-y-0 sm:flex sm:items-center sm:justify-center sm:gap-4 text-center sm:text-left">
        <h1 class="text-lg sm:text-xl font-extrabold">Filter by Node Type</h1>
        <form id="nodeTypeForm" class="flex items-center gap-2">
          <label for="node_type"
                 class="block text-xs sm:text-sm font-medium"
                 :class="darkMode ? 'text-text-main-dark' : 'text-text-main-light'">
            Choose
          </label>

          <select name="node_type" id="node_type"
                  class="px-2 py-1 sm:px-3 sm:py-2 rounded border text-sm transition-colors duration-300"
                  :class="darkMode
                    ? 'bg-primary-bg-dark text-text-main-dark border-gray-600'
                    : 'bg-white text-text-main-light border-gray-300'">
            <option value="">All Types</option>
            {% for nt in node_types %}
              <option value="{{ nt }}"
                {% if nt == selected_node_type %}
                  selected
                {% elif not selected_node_type and forloop.first %}
                  selected
                {% endif %}>
                {{ nt }}
              </option>
            {% endfor %}
          </select>

          <!-- 🔄 Refresh Button -->
          <button type="button"
                  onclick="loadGraph()"
                  class="px-3 py-1 rounded border transition-colors duration-300"
                  :class="darkMode
                    ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                    : 'bg-primary-bg-light text-text-main-light border-accent-2'">
            🔄 Refresh
          </button>
        </form>
      </header>
    </section>

    <!-- 📊 Graph Visualization -->
    <section class="p-6 rounded-lg border transition-colors duration-300"
      :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                       : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      <h2 class="text-lg font-semibold mb-4">Graph View</h2>
      <div id="graph-container"
           class="w-full h-[600px] rounded border relative transition-colors duration-300"
           :class="darkMode ? 'bg-primary-bg-dark border-accent-1'
                            : 'bg-primary-bg-light border-accent-2'">
        <!-- Spinner -->
        <div id="spinner" class="absolute inset-0 flex items-center justify-center">
          <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2"
               :class="darkMode ? 'border-white' : 'border-gray-700'"></div>
        </div>
      </div>
    </section>

    <!-- 🔗 Back Link -->
    <div class="text-center">
      <a href="{% url 'notes:public_notes_list' %}"
         class="underline transition-colors duration-300"
         :class="darkMode ? 'text-blue-400' : 'text-blue-600'">
        ← Back to all notes
      </a>
    </div>

  </div>

</div>

<style>
  /* Tooltip styles unchanged */
  #tooltip {
    position: absolute;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 1000;
    max-width: 600px;
    white-space: pre-wrap;
    transition: background 0.3s, color 0.3s;
  }
  #tooltip.dark {
    background: rgba(20, 20, 20, 0.95);
    color: #f0f0f0;
    border: 1px solid #444;
  }
  #tooltip.light {
    background: rgba(240, 240, 240, 0.95);
    color: #222;
    border: 1px solid #ccc;
  }
</style>

<div id="tooltip" :class="darkMode ? 'dark' : 'light'"></div>

<script src="https://unpkg.com/graphology@0.25.0/dist/graphology.umd.min.js"></script>
<script src="https://unpkg.com/sigma@2.4.0/build/sigma.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
  document.addEventListener('alpine:init', () => {
    Alpine.store('graphColors', {
      colors: {
        Event: '#1f77b4',
        Company: '#ff7f0e',
        Account: '#2ca02c',
        Location: '#d62728'
      }
    });
  });
</script>
<script>
  // Pass node_types from Django into JS as an array
  const nodeTypes = [
    {% for nt in node_types %}
      "{{ nt }}"{% if not forloop.last %},{% endif %}
    {% endfor %}
  ];
</script>
<script>
const darkPalette = [
  "#ff00ff", "#00ffff", "#ff0090", "#00ff9f", "#ffea00",
  "#ff5500", "#9d00ff", "#00ffea", "#ff2222", "#33ff00",
  "#ff66cc", "#00aaff", "#ff8800", "#cc00ff", "#00ff66"
];
const lightPalette = [
  "#d100d1", "#008b8b", "#ff3399", "#009966", "#ffcc00",
  "#ff6600", "#6600cc", "#00cccc", "#cc0000", "#339933",
  "#ff99cc", "#0066cc", "#ff9933", "#9933ff", "#33cc33"
];

function getTypeColors()  {
    const darkMode = localStorage.getItem("darkMode") === "true";
    const palette = darkMode ? darkPalette : lightPalette;

    let typeColors = {};
    nodeTypes.forEach((type, i) => {
      typeColors[type] = palette[i % palette.length];
    });
    typeColors.default = darkMode ? "#ffffff" : "#000000";
    return typeColors;
}
</script>
<script>
  const g = new graphology.Graph();
  const container = document.getElementById("graph-container");
  const renderer = new Sigma(g, container);
  const spinner = document.getElementById("spinner");

  async function loadGraph() {

    typeColors = getTypeColors();

    g.clear();
    spinner.style.display = "flex"; // show spinner
    const nodeTypeSelect = document.getElementById("node_type");
    const nodeType = nodeTypeSelect ? nodeTypeSelect.value : "";
    const response = await fetch(`/notes/graph-chunk/?offset=0&limit=5000&node_type=${nodeType}`);
    const data = await response.json();

    data.nodes.forEach(n => {
      if (!g.hasNode(n.id)) {
        const nodeType = n.attrs?.type || n.label;
        const color = typeColors[nodeType] || typeColors.default;
        g.addNode(n.id, {
          label: n.label,
          x: n.x,
          y: n.y,
          size: n.size,
          color: color || "#1f77b4",
          attrs: n.attrs || {}
        });
      }
    });

    data.edges.forEach(e => {
      if (!g.hasEdge(e.id)) {
        g.addEdge(e.source, e.target, {
          label: e.label,
          color: e.color || "#999"
        });
      }
    });

    spinner.style.display = "none"; // hide spinner
  }

  loadGraph();

  // Tooltip logic unchanged
  const tooltip = document.getElementById("tooltip");
  let pinnedNode = null;
  let pinnedPosition = null;

  renderer.on("enterNode", ({ node }) => {
    if (pinnedNode) return;
    const attrs = g.getNodeAttributes(node);
    const yamlString = jsyaml.dump(attrs.attrs, { indent: 2, lineWidth: -1 });
    tooltip.textContent = yamlString;
    tooltip.style.display = "block";
  });

  renderer.on("leaveNode", () => {
    if (!pinnedNode) tooltip.style.display = "none";
  });

  renderer.on("clickNode", ({ node }) => {
    pinnedNode = node;
    const attrs = g.getNodeAttributes(node);
    const yamlString = jsyaml.dump(attrs, { indent: 2, lineWidth: -1 });
    tooltip.textContent = yamlString;
    tooltip.style.display = "block";
    const mouse = renderer.getMouseCaptor().mouse;
    pinnedPosition = { x: mouse.x, y: mouse.y };
    tooltip.style.left = pinnedPosition.x + 15 + "px";
    tooltip.style.top = pinnedPosition.y + 15 + "px";
  });

  renderer.on("clickStage", () => {
    pinnedNode = null;
    pinnedPosition = null;
    tooltip.style.display = "none";
  });

  renderer.getMouseCaptor().on("mousemove", (e) => {
    if (!pinnedNode) {
      tooltip.style.left = e.x + 15 + "px";
      tooltip.style.top = e.y + 15 + "px";
    }
  });
</script>

{% endblock %}
