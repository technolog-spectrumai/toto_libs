{% extends "oya/base.html" %}
{% load static %}

{% block title %}Graph Explorer – {{ platform.site_name }}{% endblock %}

{% block content %}
<div
  :class="darkMode
    ? 'bg-primary-bg-dark text-text-main-dark'
    : 'bg-primary-bg-light text-text-main-light'"
  class="min-h-screen px-4 py-10 transition-colors duration-300">

  <div class="max-w-6xl mx-auto space-y-8">

    <!-- 🌐 Graph Header -->
    <section class="p-6 rounded-lg border transition-colors duration-300"
      :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                       : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      <h1 class="text-2xl font-bold mb-2">{{title}}</h1>
    </section>

    <!-- Sigma Graph Container -->
    <section class="p-6 rounded-lg border">
      <h2 class="text-lg font-bold mb-4">Graph Visualization</h2>
      <div id="sigma-container" style="width:100%; height:600px; border:1px solid #ccc;"></div>
    </section>

  </div>
</div>

<!-- Sigma.js -->
<script src="https://unpkg.com/graphology@0.25.0/dist/graphology.umd.min.js"></script>
<script src="https://unpkg.com/sigma@2.4.0/build/sigma.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Elements passed from Django context (nodes + edges from Cypher query)
    const elements = {{ cypher_results_json|safe }};

    // Build a Graphology graph from elements
    const graph = new graphology.Graph();

    elements.forEach(el => {
      if (el.data.source && el.data.target) {
        // edge
        if (!graph.hasNode(el.data.source)) {
          graph.addNode(el.data.source, { label: el.data.source, x: Math.random(), y: Math.random(), size: 5, color: '#0074D9' });
        }
        if (!graph.hasNode(el.data.target)) {
          graph.addNode(el.data.target, { label: el.data.target, x: Math.random(), y: Math.random(), size: 5, color: '#FF4136' });
        }
        graph.addEdge(el.data.source, el.data.target, { label: el.data.type, size: 1, color: '#aaa' });
      } else {
        // node
        if (!graph.hasNode(el.data.id)) {
          graph.addNode(el.data.id, { label: el.data.label, x: Math.random(), y: Math.random(), size: 8, color: '#2ECC40' });
        }
      }
    });

    // Initialize Sigma renderer
    const container = document.getElementById("sigma-container");
    const renderer = new Sigma(graph, container);

    // Fit view to graph
    renderer.getCamera().animatedZoom({ duration: 600, factor: 0.8 });
  });
</script>
{% endblock %}
