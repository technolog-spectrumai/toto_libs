{% extends "oya/base.html" %}
{% load static %}

{% block title %}Graph Explorer – {{ platform.site_name }}{% endblock %}

{% block content %}
<style>[x-cloak] { display: none !important; }</style>

<div
  :class="darkMode
    ? 'bg-primary-bg-dark text-text-main-dark'
    : 'bg-primary-bg-light text-text-main-light'"
  class="min-h-screen px-4 py-10 transition-colors duration-300" >

  <div class="max-w-6xl mx-auto space-y-8">

    <!-- 🌐 Graph Header -->
    <section class="p-6 rounded-lg border transition-colors duration-300"
      :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                       : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      <h1 class="text-2xl font-bold mb-2">{{title}}</h1>
    </section>

    <!-- Query Selector -->
    <section class="p-6 rounded-lg border space-y-4">
      <form id="query-form" class="mb-4 flex items-center space-x-2">
        <label for="query_id" class="font-semibold">Choose Query:</label>
        <select name="query_id" id="query_id"
                class="border rounded px-2 py-1 transition-colors duration-300"
                :class="darkMode ? 'bg-primary-bg-dark text-main-dark border-accent-1'
                                 : 'bg-primary-bg-light text-main-light border-accent-2'">
          {% for q in queries %}
            <option value="{{ q.id }}" {% if q.id|stringformat:"s" == selected_query %}selected{% endif %}>
              {{ q.name }}
            </option>
          {% endfor %}
        </select>
        <!-- 🔄 Refresh Button -->
        <button type="button" id="refresh-btn"
                class="px-3 py-1 rounded transition-colors duration-300 border"
                :class="darkMode
                  ? 'border-accent-1 text-text-main-dark'
                  : 'border-accent-2 text-text-main-light'">
          Refresh
        </button>
        <button type="button" id="open-menu-btn"
                class="px-3 py-1 rounded transition-colors duration-300 border"
                :class="darkMode
                  ? 'border-accent-1 text-text-main-dark'
                  : 'border-accent-2 text-text-main-light'">
          Customize
        </button>

      </form>


      <!-- Cytoscape Graph Container -->
      <div id="cy-container" style="width:100%; height:600px; border:1px solid #ccc;"></div>
    </section>

    <!-- Info Panel -->
    <section class="p-6 rounded-lg border mt-4 transition-colors duration-300"
      :class="darkMode
        ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
        : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      <h2 class="text-lg font-bold mb-4">Selected Element Data</h2>
      <pre id="info-panel"
           class="text-sm p-4 rounded overflow-x-auto transition-colors duration-300"
           :class="darkMode
             ? 'bg-secondary-bg-dark text-text-main-dark'
             : 'bg-secondary-bg-light text-text-main-light'"></pre>
    </section>

  </div>
{% include "ravioli/modal.html" %}
</div>

<!-- Cytoscape.js -->
<script src="https://unpkg.com/cytoscape@3.28.0/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="{% static 'ravioli/colors.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const querySelect = document.getElementById("query_id");
  const refreshBtn = document.getElementById("refresh-btn");
  let cy;
  const darkMode = localStorage.getItem("darkMode") === "true";
  const themeColors = {{ theme.theme.colors|safe }};
  const backgroundColor = darkMode ? themeColors["primary-bg-dark"] : themeColors["primary-bg-light"];
  let nodeTypes = [];
  let edgeTypes = []
  function loadGraph(queryId) {
    const url = "{% url 'ravioli:graph_data' %}" + (queryId ? `?query_id=${queryId}` : "");
    fetch(url)
      .then(resp => resp.json())
      .then(data => {
      nodeTypes = data.node_labels || [];
      edgeTypes = data.edge_types || [];

        if (cy) cy.destroy(); // reset old graph
        cy = cytoscape({
          container: document.getElementById("cy-container"),
          elements: data.elements,
            style: [
              {
                selector: 'node',
                style: {
                  'label': 'data(label)',
                  'background-color': darkMode ? themeColors["accent-dark"] : themeColors["accent-light"],
                  'color': darkMode ? themeColors["text-main-dark"] : themeColors["text-main-light"],
                  'font-size': '10px',
                  'text-valign': 'center',
                  'text-halign': 'center'
                }
              },
              {
                selector: 'edge',
                style: {
                  'label': 'data(type)',
                  'width': 2,
                  'line-color': darkMode ? themeColors["accent-1"] : themeColors["accent-2"],
                  'target-arrow-color': darkMode ? themeColors["accent-1"] : themeColors["accent-2"],
                  'target-arrow-shape': 'triangle',
                  'curve-style': 'bezier',
                  'font-size': '8px',
                  'color': darkMode ? themeColors["text-main-dark"] : themeColors["text-main-light"],
                }
              }
            ],
          layout: {
            name: 'cose',
            animate: true,
            padding: 50,
            nodeRepulsion: 2000,
            idealEdgeLength: 50
          },
          wheelSensitivity: 0.2
        });

      });

      document.getElementById("cy-container").style.backgroundColor = backgroundColor;
  }

  // Initial load
  //loadGraph(querySelect.value);

  // Reload when dropdown changes
  querySelect.addEventListener("change", () => {
    loadGraph(querySelect.value);
  });

  // Reload when refresh button clicked
  refreshBtn.addEventListener("click", () => {
    loadGraph(querySelect.value);
  });

    const modal = document.getElementById("color-modal");
    document.getElementById("open-menu-btn").addEventListener("click", () => {
      modal.classList.remove("hidden");
      openColorModal(nodeTypes, edgeTypes, darkMode)
    });
    document.getElementById("close-menu-btn").addEventListener("click", () => {
      modal.classList.add("hidden");
      openColorModal(nodeTypes, edgeTypes, darkMode);
    });
});
</script>
<script>
</script>
{% endblock %}
