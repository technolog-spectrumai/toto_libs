{% extends "oya/base.html" %}
{% load static %}

{% block title %}Graph Explorer – {{ platform.site_name }}{% endblock %}

{% block content %}
<div
  :class="darkMode
    ? 'bg-primary-bg-dark text-text-main-dark'
    : 'bg-primary-bg-light text-text-main-light'"
  class="min-h-screen px-4 py-10 transition-colors duration-300">

  <div class="max-w-6xl mx-auto space-y-8">

    <!-- 🌐 Graph Header -->
    <section class="p-6 rounded-lg border transition-colors duration-300"
      :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                       : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      <h1 class="text-2xl font-bold mb-2">{{title}}</h1>
    </section>

    <!-- Sigma Graph Container -->
    <section class="p-6 rounded-lg border">
      <h2 class="text-lg font-bold mb-4">Graph Visualization</h2>
      <div id="sigma-container" style="width:100%; height:600px; border:1px solid #ccc;"></div>
    </section>

  </div>
</div>

<!-- Sigma.js -->
<script src="https://unpkg.com/graphology@0.25.0/dist/graphology.umd.min.js"></script>
<script src="https://unpkg.com/sigma@2.4.0/build/sigma.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const darkMode = localStorage.getItem("darkMode") === "true";
    const themeColors = {{ theme.theme.colors|safe }};
    const elements = {{ cypher_results_json|safe }};

    // Pick colors based on mode
    const nodeColor = darkMode ? themeColors["accent-dark"] : themeColors["accent-light"];
    const edgeColor = darkMode ? themeColors["text-main-dark"] : themeColors["text-main-light"];
    const backgroundColor = darkMode ? themeColors["primary-bg-dark"] : themeColors["primary-bg-light"];

    // Build graph
    const graph = new graphology.Graph();
    elements.forEach(el => {
      console.log(el);

      if (el.data.source && el.data.target) {
        if (!graph.hasNode(el.data.source)) {
          graph.addNode(el.data.source, {
            label: el.data.source,
            size: 5,
            color: nodeColor,
            x: Math.random(),   // add coordinates
            y: Math.random()
          });
        }
        if (!graph.hasNode(el.data.target)) {
          graph.addNode(el.data.target, {
            label: el.data.target,
            size: 5,
            color: nodeColor,
            x: Math.random(),
            y: Math.random()
          });
        }
        graph.addEdge(el.data.source, el.data.target, {
          label: el.data.type,
          size: 1,
          color: edgeColor
        });
      } else {
        if (!graph.hasNode(el.data.id)) {
          graph.addNode(el.data.id, {
            label: el.data.label,
            size: 8,
            color: nodeColor,
            x: Math.random(),
            y: Math.random()
          });
        }
      }
    });


    // Initialize Sigma renderer with background color
    const container = document.getElementById("sigma-container");
    container.style.backgroundColor = backgroundColor;

    const renderer = new Sigma(graph, container);
    renderer.getCamera().animatedZoom({ duration: 600, factor: 0.8 });
  });
</script>
{% endblock %}
