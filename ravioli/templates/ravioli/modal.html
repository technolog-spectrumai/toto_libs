<div id="color-modal"
     class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div
    class="p-6 rounded-lg shadow-lg w-[700px] max-h-[80vh] overflow-y-auto transition-colors duration-300"
    :class="darkMode
      ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
      : 'bg-primary-bg-light text-text-main-light border-accent-2'">

    <h3 class="text-lg font-bold mb-4">Customization</h3>

    <!-- Node Colors & Sizes Table -->
    <h4 class="font-semibold mb-2">Node Types</h4>
    <table class="w-full border-collapse mb-6">
      <thead>
        <tr>
          <th class="border px-2 py-1 text-left">Node Type</th>
          <th class="border px-2 py-1 text-left">Label</th>
          <th class="border px-2 py-1 text-left">Color</th>
          <th class="border px-2 py-1 text-left">Size</th>
        </tr>
      </thead>
      <tbody id="node-type-table"></tbody>
    </table>

    <!-- Edge Colors & Widths Table -->
    <h4 class="font-semibold mb-2">Edge Types</h4>
    <table class="w-full border-collapse">
      <thead>
        <tr>
          <th class="border px-2 py-1 text-left">Edge Type</th>
          <th class="border px-2 py-1 text-left">Label</th>
          <th class="border px-2 py-1 text-left">Color</th>
          <th class="border px-2 py-1 text-left">Width</th>
        </tr>
      </thead>
      <tbody id="edge-type-table"></tbody>
    </table>

    <div class="flex justify-end space-x-2 mt-6">
        <button id="close-menu-btn"
                class="px-3 py-1 rounded transition-colors duration-300"
                :class="darkMode
                  ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                  : 'bg-primary-bg-light text-text-main-light border-accent-2'">
          Cancel
        </button>

        <button id="apply-color-btn"
                class="px-3 py-1 rounded transition-colors duration-300"
                :class="darkMode
                  ? 'bg-accent-dark text-text-main-dark border-accent-1'
                  : 'bg-accent-light text-text-main-light border-accent-2'">
          Apply
        </button>

        <button id="reset-color-btn"
                class="px-3 py-1 rounded transition-colors duration-300"
                :class="darkMode
                  ? 'bg-warn-dark text-text-main-dark border-accent-1'
                  : 'bg-warn-light text-text-main-light border-accent-2'">
          Reset
        </button>
    </div>
  </div>
</div>

<script>
function openColorModal(nodeTypes, edgeTypes, darkMode) {
  const nodeTable = document.getElementById("node-type-table");
  nodeTable.innerHTML = "";

  const edgeTable = document.getElementById("edge-type-table");
  edgeTable.innerHTML = "";

  // load saved styles
  const savedNodeStyles = JSON.parse(localStorage.getItem("nodeStyles") || "{}");
  const savedEdgeStyles = JSON.parse(localStorage.getItem("edgeStyles") || "{}");

  // Nodes
  nodeTypes.forEach(type => {
    const saved = savedNodeStyles[type] || {};

    // fallback values
    const labelValue = saved.label || type;
    const colorValue = saved.color || "#808080"; // gray fallback
    const sizeValue = saved.size || 20;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td class="border px-2 py-1">${type}</td>
      <td class="border px-2 py-1">
        <input type="text" value="${labelValue}" data-type="${type}"
               class="node-label-input w-full border rounded px-1 transition-colors duration-300"
               :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                                : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      </td>
      <td class="border px-2 py-1">
        <input type="color" value="${colorValue}" data-type="${type}"
               class="node-color-picker w-10 h-10 border rounded transition-colors duration-300"
               :class="darkMode ? 'bg-primary-bg-dark border-accent-1'
                                : 'bg-primary-bg-light border-accent-2'">
      </td>
      <td class="border px-2 py-1">
        <input type="number" value="${sizeValue}" min="5" max="100" data-type="${type}"
               class="node-size-input w-16 border rounded transition-colors duration-300"
               :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                                : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      </td>
    `;
    nodeTable.appendChild(row);
  });

  // Edges
  edgeTypes.forEach(type => {
    const saved = savedEdgeStyles[type] || {};

    const labelValue = saved.label || type;
    const colorValue = saved.color || "#808080"; // gray fallback
    const widthValue = saved.width || 2;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td class="border px-2 py-1">${type}</td>
      <td class="border px-2 py-1">
        <input type="text" value="${labelValue}" data-type="${type}"
               class="edge-label-input w-full border rounded px-1 transition-colors duration-300"
               :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                                : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      </td>
      <td class="border px-2 py-1">
        <input type="color" value="${colorValue}" data-type="${type}"
               class="edge-color-picker w-10 h-10 border rounded transition-colors duration-300"
               :class="darkMode ? 'bg-primary-bg-dark border-accent-1'
                                : 'bg-primary-bg-light border-accent-2'">
      </td>
      <td class="border px-2 py-1">
        <input type="number" value="${widthValue}" min="1" max="10" data-type="${type}"
               class="edge-size-input w-16 border rounded transition-colors duration-300"
               :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark border-accent-1'
                                : 'bg-primary-bg-light text-text-main-light border-accent-2'">
      </td>
    `;
    edgeTable.appendChild(row);
  });
}

</script>

<script>


function applyColors() {

  // Load existing styles
  const nodeStyles = JSON.parse(localStorage.getItem("nodeStyles") || "{}");
  const edgeStyles = JSON.parse(localStorage.getItem("edgeStyles") || "{}");

  // Nodes
  document.querySelectorAll(".node-color-picker").forEach(input => {
    const type = input.dataset.type;
    const chosenColor = input.value;

    const sizeInput = document.querySelector(`.node-size-input[data-type="${type}"]`);
    const chosenSize = sizeInput ? parseInt(sizeInput.value, 10) : 20;

    const labelInput = document.querySelector(`.node-label-input[data-type="${type}"]`);
    const chosenLabel = labelInput ? labelInput.value : type;

    const current = nodeStyles[type] || {};
    const updated = { color: chosenColor, size: chosenSize, label: chosenLabel };

    // Only update if something changed
    if (
      current.color !== updated.color ||
      current.size !== updated.size ||
      current.label !== updated.label
    ) {
      nodeStyles[type] = updated;
      console.log("Updated node style:", type, updated);
    }
  });

  // Edges
  document.querySelectorAll(".edge-color-picker").forEach(input => {
    const type = input.dataset.type;
    const chosenColor = input.value;

    const sizeInput = document.querySelector(`.edge-size-input[data-type="${type}"]`);
    const chosenWidth = sizeInput ? parseInt(sizeInput.value, 10) : 2;

    const labelInput = document.querySelector(`.edge-label-input[data-type="${type}"]`);
    const chosenLabel = labelInput ? labelInput.value : type;

    const current = edgeStyles[type] || {};
    const updated = { color: chosenColor, width: chosenWidth, label: chosenLabel };

    if (
      current.color !== updated.color ||
      current.width !== updated.width ||
      current.label !== updated.label
    ) {
      edgeStyles[type] = updated;
      console.log("Updated edge style:", type, updated);
    }
  });

  // Persist back to localStorage
  localStorage.setItem("nodeStyles", JSON.stringify(nodeStyles));
  localStorage.setItem("edgeStyles", JSON.stringify(edgeStyles));

  // Close modal
  const modal = document.getElementById("color-modal");
  modal.classList.add("hidden");
}
</script>
