{% extends "oya/base.html" %}
{% load static %}

{% block title %}Delete Task | {{ board.name }}{% endblock %}

{% block content %}
<section
  :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark' : 'bg-primary-bg-light text-text-main-light'"
  class="flex items-center justify-center px-6 py-16 min-h-screen transition-colors duration-300"
>
  <div
    :class="darkMode
      ? 'bg-bubble-bg-dark border-accent-1 text-text-main-dark'
      : 'bg-bubble-bg-light border-accent-2 text-text-main-light'"
    class="w-full max-w-md p-6 rounded-lg shadow-md border space-y-6 transition-colors duration-300"
  >
    <h2 :class="darkMode ? 'text-warn-dark' : 'text-warn-light'" class="text-xl font-bold text-center">
      Confirm Deletion
    </h2>

    <p class="text-center text-sm">
      Are you sure you want to delete the task <span class="font-semibold">{{ task.title }}</span>?
    </p>

    <form method="POST">
      {% csrf_token %}
      <div class="flex justify-end space-x-2 pt-4">
        <button type="submit"
                :class="darkMode
                  ? 'bg-warn-dark text-primary-bg-dark'
                  : 'bg-warn-light text-primary-bg-light'"
                class="px-4 py-2 rounded font-semibold hover:opacity-90 transition text-sm">
          <i class="fas fa-trash-alt"></i> Delete
        </button>
        <a href="{% url 'kanban:board' board.pk %}"
           :class="darkMode
             ? 'bg-accent-dark text-primary-bg-dark'
             : 'bg-accent-light text-primary-bg-light'"
           class="px-4 py-2 rounded font-semibold hover:opacity-90 transition text-sm">
          Cancel
        </a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
