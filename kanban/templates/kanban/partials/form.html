<div
  x-show="openModal"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 scale-95"
  x-transition:enter-end="opacity-100 scale-100"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100 scale-100"
  x-transition:leave-end="opacity-0 scale-95"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm"
>
  <div
    @click.away="openModal = false"
    :class="darkMode
      ? 'bg-bubble-bg-dark border-accent-1 text-text-main-dark'
      : 'bg-bubble-bg-light border-accent-2 text-text-main-light'"
    class="w-full max-w-md p-6 rounded-lg shadow-xl border transform transition-all space-y-6"
  >
    <div class="flex justify-between items-center">
      <h2 :class="darkMode ? 'text-accent-dark' : 'text-accent-light'" class="text-xl font-semibold">
        New Task
      </h2>
      <button
        @click="openModal = false"
        class="text-gray-500 dark:text-gray-300 hover:text-gray-700 dark:hover:text-white text-2xl focus:outline-none"
        aria-label="Close modal"
      >
        &times;
      </button>
    </div>

 <form method="POST" action="" enctype="multipart/form-data"
        :class="darkMode
          ? 'bg-bubble-bg-dark border-accent-1 text-text-main-dark'
          : 'bg-bubble-bg-light border-accent-2 text-text-main-light'"
        class="w-full max-w-2xl p-6 rounded-lg shadow-md border space-y-6 transition-colors duration-300">

    {% csrf_token %}
    <h2 :class="darkMode ? 'text-accent-dark' : 'text-accent-light'" class="text-xl font-bold text-center">
      Create New Task
    </h2>

    {% for field in form %}
      <div class="space-y-2">
        <label for="{{ field.id_for_label }}" class="block text-sm font-medium">
          {{ field.label }}
        </label>
        {{ field }}
        {% if field.help_text %}
          <p class="text-xs text-gray-500 dark:text-gray-400">{{ field.help_text }}</p>
        {% endif %}
        {% for error in field.errors %}
          <p class="text-sm text-red-500">{{ error }}</p>
        {% endfor %}
      </div>
    {% endfor %}

    <div class="flex justify-end space-x-2 pt-4">
      <button type="submit"
              :class="darkMode
                ? 'bg-accent-dark text-primary-bg-dark'
                : 'bg-accent-light text-primary-bg-light'"
              class="px-4 py-2 rounded font-semibold hover:opacity-90 transition text-sm">
        <i class="fas fa-save"></i> Save Task
      </button>
    </div>
  </form>

  </div>
</div>
