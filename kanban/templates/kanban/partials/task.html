<div
  x-data="{ open: false, editModal: false }"
  class="task relative overflow-hidden p-3 rounded border transition-shadow hover:shadow-md"
  style="background-color: {{ bg }}; color: {{ text }};"
  draggable="true"
>
  <!-- overlays -->
  <div class="absolute inset-0 bg-white bg-opacity-20" x-show="darkMode"></div>
  <div class="absolute inset-0 bg-black bg-opacity-20" x-show="!darkMode"></div>

  <!-- content -->
  <div class="relative z-10">
    <div class="flex justify-between items-center">
      <div>
        <span class="font-bold task-title">{{ task.title }}</span>
        {% if task.assignee %}
          <span class="text-sm ml-2">
            <i class="fa-solid fa-user"></i> {{ task.assignee.username }}
          </span>
        {% endif %}
      </div>
      <div class="flex items-center gap-2">
        <i
          class="fa-solid transition-transform duration-300 cursor-pointer"
          :class="open ? 'fa-chevron-up' : 'fa-chevron-down'"
          @click="open = !open"
        ></i>
      </div>
    </div>

    <div x-show="open" x-transition class="mt-2 text-sm space-y-1">
      <p>{{ task.description }}</p>
      {% if task.due_date %}
        <p><i class="fa-regular fa-calendar"></i> Due: {{ task.due_date }}</p>
      {% endif %}
        <div class="flex items-center gap-4 text-sm mt-2">
          <a href="{% url 'kanban:edit_task' column.id %}"
             :class="darkMode
               ? 'text-accent-dark hover:underline'
               : 'text-accent-light hover:underline'"
             class="flex items-center gap-1 font-medium transition-opacity hover:opacity-80">
            <i class="fas fa-edit"></i> Edit Task
          </a>

          <a href="{% url 'kanban:confirm_delete_task' board.id task.id %}"
             :class="darkMode
               ? 'text-accent-dark hover:underline'
               : 'text-accent-light hover:underline'"
             class="flex items-center gap-1 font-medium transition-opacity hover:opacity-80">
            <i class="fas fa-trash-alt"></i> Delete Task
          </a>
        </div>
    </div>
  </div>
</div>
