{% extends "oya/base.html" %}

{% block title %}Kanban Boards{% endblock %}

{% block content %}
<section
  x-data="{}"
  :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark' : 'bg-primary-bg-light text-text-main-light'"
  class="px-4 sm:px-6 lg:px-8 py-12 min-h-screen transition-colors duration-300"
>
  <div
    :class="darkMode
      ? 'bg-bubble-bg-dark border-accent-1 text-text-main-dark'
      : 'bg-bubble-bg-light border-accent-2 text-text-main-light'"
    class="rounded-xl shadow-lg border p-6 space-y-8 transition-colors duration-300"
  >

    <h2
      :class="darkMode ? 'text-accent-dark' : 'text-accent-light'"
      class="text-2xl font-bold text-center"
    >
      Your Kanban Boards
    </h2>

    {% if boards %}
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        {% for board in boards %}
          <a
            href="{% url 'kanban:board' board.pk %}"
            aria-label="View board {{ board.name }}"
            class="group block p-6 rounded-xl shadow-md border border-transparent hover:border-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-300"
            :class="darkMode ? 'bg-gray-800 hover:bg-gray-700' : 'bg-white hover:bg-gray-50'"
          >
            <h3 class="text-lg font-semibold mb-2 group-hover:text-indigo-600 transition-colors duration-200">
              {{ board.name }}
            </h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 leading-tight">
              Project: {{ board.project.name }}
            </p>
          </a>
        {% endfor %}
      </div>
    {% else %}
      <div class="text-center py-12">
        <p class="text-gray-500 dark:text-gray-400 text-lg">No kanban boards available.</p>
      </div>
    {% endif %}
  </div>
</section>
{% endblock %}
