<div
  x-data="{ replying: false }"
  :class="darkMode
    ? 'bg-primary-bg-dark border border-accent-1'
    : 'bg-primary-bg-light border border-accent-2'"
  class="p-4 rounded-lg shadow-sm"
>
  {% if message.parent %}
    <p class="text-xs opacity-60 mb-1">Reply to #{{ message.parent.id }}</p>
  {% endif %}
  <p class="text-sm whitespace-pre-line break-words overflow-hidden">{{ message.content }}</p>
  <p class="text-xs opacity-50 mt-2">
    #{{ message.id }} • {{ message.timestamp }}
    {% if message.user %}
      • Posted by <span class="font-medium">{{ message.user.username }}</span>
    {% else %}
      • <span class="italic">Anonymous</span>
    {% endif %}
  </p>

  <!-- Reply toggle and form -->
  <div class="mt-4 space-y-2">
    <button
      @click="replying = !replying"
      class="flex items-center gap-1 text-sm px-2 py-1 border rounded transition duration-200
             hover:border-accent-light hover:text-accent-light
             dark:hover:border-accent-dark dark:hover:text-accent-dark
             border-transparent text-opacity-70"
    >
      <i
        :class="replying ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'"
        class="transition-transform"
      ></i>
      <span x-text="replying ? 'Hide reply form' : 'Reply'"></span>
    </button>

    <form method="post" x-show="replying" class="space-y-2" style="display: none;">
      {% csrf_token %}
      <textarea
        name="content"
        rows="2"
        placeholder="Write your reply..."
        required
        class="w-full px-3 py-2 rounded border focus:outline-none focus:ring-2 transition duration-300"
        x-bind:class="darkMode ? 'bg-primary-bg-dark text-text-main-dark' : 'bg-primary-bg-light text-text-main-light'"
      ></textarea>
      <input type="hidden" name="parent" value="{{ message.id }}">
      <button
        type="submit"
        class="px-3 py-1 text-sm border rounded hover:bg-accent-light hover:text-white dark:hover:bg-accent-dark transition"
      >
        Send
      </button>
    </form>
  </div>
</div>
