{% extends "oya/base.html" %}

{% block title %}Forum Rooms{% endblock %}

{% block content %}
<section
  x-data="{}"
  :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark' : 'bg-primary-bg-light text-text-main-light'"
  class="px-4 sm:px-6 lg:px-8 py-12 min-h-screen transition-colors duration-300"
>
  <div
    :class="darkMode
      ? 'bg-bubble-bg-dark border-accent-1 text-text-main-dark'
      : 'bg-bubble-bg-light border-accent-2 text-text-main-light'"
    class="rounded-xl shadow-lg border p-6 space-y-8 transition-colors duration-300"
  >
    <h2
      :class="darkMode ? 'text-accent-dark' : 'text-accent-light'"
      class="text-2xl font-bold text-center"
    >
      Forum Rooms
    </h2>

    {% if rooms %}
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        {% for room in rooms %}
          <a
            href="{% url 'forum:room_view' room.id %}"
            aria-label="Enter room {{ room.name }}"
            :class="darkMode
              ? 'bg-bubble-bg-dark border border-accent-1 text-text-main-dark hover:border-accent-2'
              : 'bg-bubble-bg-light border border-accent-2 text-text-main-light hover:border-accent-1'"
            class="group block p-6 rounded-xl shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 transition-all duration-300"
          >
            <h3
              :class="darkMode ? 'text-accent-dark' : 'text-accent-light'"
              class="text-lg font-semibold mb-2 group-hover:underline transition-colors duration-200"
            >
              {{ room.name }}
            </h3>
            <p class="text-xs opacity-80 leading-tight">
              Max bytes: {{ room.max_bytes }}
            </p>
          </a>
        {% endfor %}
      </div>
    {% else %}
      <div class="text-center py-12">
        <p class="text-lg opacity-70">No rooms available.</p>
      </div>
    {% endif %}
  </div>
</section>
{% endblock %}
