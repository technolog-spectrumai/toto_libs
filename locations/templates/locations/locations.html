{% extends "oya/base.html" %}
{% load static %}

{% block title %}Locations – {{ platform.site_name }}{% endblock %}

{% block start_script %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block content %}
<div
  x-data="{ search: '' }"
  :class="darkMode
    ? 'bg-primary-bg-dark text-text-main-dark'
    : 'bg-primary-bg-light text-text-main-light'"
  class="min-h-screen px-4 py-10 transition-colors duration-300">

  <div class="max-w-6xl mx-auto space-y-10">

    <h2 class="text-2xl font-bold mb-4">All Locations</h2>

    <!-- 🌍 SIDEBAR + MAP -->
    <section class="flex flex-row gap-6 h-[80vh] md:h-[85vh]">

      <!-- 📌 SIDEBAR WITH SEARCH -->
      <aside
        class="w-64 h-full overflow-y-auto rounded border p-4 space-y-4"
        :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark text-text-main-dark'
                         : 'border-accent-2 bg-bubble-bg-light text-text-main-light'">

        <h3 class="text-lg font-semibold">Locations</h3>

        <!-- 🔍 SEARCH BAR -->
        <input
          x-model="search"
          type="text"
          placeholder="Search..."
          class="w-full px-3 py-2 rounded text-sm transition-colors duration-300 border"
          :class="darkMode
            ? 'bg-primary-bg-dark text-text-main-dark border-accent-dark'
            : 'bg-primary-bg-light text-text-main-light border-accent-light'
          "
          />

        <!-- 📋 FILTERED LIST -->
        <div class="space-y-2">
          {% for loc in locations %}
            <template x-if="'{{ loc.name|lower }}'.includes(search.toLowerCase()) || '{{ loc.type|lower }}'.includes(search.toLowerCase())">
              <button
                onclick="zoomToFeature('{{ loc.name }}')"
                class="w-full text-left px-3 py-2 rounded transition
                       hover:bg-blue-100 dark:hover:bg-blue-900">
                <div class="font-medium">{{ loc.type }}</div>
                <div class="text-sm opacity-80">{{ loc.name }}</div>
              </button>
            </template>
          {% endfor %}
        </div>

      </aside>

      <!-- 🗺️ MAP -->
      <div class="flex-1 h-full">
        <div id="map" class="w-full h-full rounded border"
             :class="darkMode ? 'border-accent-1' : 'border-accent-2'"></div>
      </div>

    </section>

    <!-- 🧠 MAP SCRIPT -->
    <script>
      let map = null;
      let featuresDict = {};

      document.addEventListener("DOMContentLoaded", function () {
        const isDark = localStorage.getItem("darkMode") === "true";

        map = L.map("map").setView([52.0, 19.0], 6);

        const lightTiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png");
        const darkTiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png");

        (isDark ? darkTiles : lightTiles).addTo(map);

        const features = JSON.parse(`{{ locations_json|escapejs }}`);

        features.forEach(item => {
          const type = item.type;
          const name = item.name;
          const geom = item.geometry;
          featuresDict[name] = item;
          if (!geom) return;

          const layer = L.geoJSON(geom, {
            style: {
              color: isDark ? "#FFCE56" : "#2563EB",
              weight: 2
            },
            pointToLayer: function (feature, latlng) {
              return L.circleMarker(latlng, {
                radius: 6,
                fillColor: isDark ? "#FFCE56" : "#2563EB",
                color: "#000",
                weight: 1,
                fillOpacity: 0.9
              });
            }
          }).addTo(map);

          layer.bindPopup(`<strong>${type}</strong><br>${name}`);
        });
      });

      function zoomToFeature(name) {
        const item = featuresDict[name];
        if (!item || !item.geometry) return;

        const layer = L.geoJSON(item.geometry);
        const bounds = layer.getBounds();

        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [20, 20] });
        }
      }
    </script>

  </div>
</div>
{% endblock %}
