{% extends "oya/base.html" %}
{% load static %}

{% block title %}Tags | {{ platform.site_name }}{% endblock %}

{% block content %}
<section
  :class="darkMode
    ? 'bg-primary-bg-dark text-text-main-dark'
    : 'bg-primary-bg-light text-text-main-light'"
  class="flex items-center justify-center px-6 py-16 min-h-screen transition-colors duration-300">

  <div
    :class="darkMode
      ? 'bg-bubble-bg-dark border-accent-1 text-text-main-dark'
      : 'bg-bubble-bg-light border-accent-2 text-text-main-light'"
    class="w-full max-w-2xl p-6 rounded-lg shadow-md border space-y-6 transition-colors duration-300">

    <h2 :class="darkMode ? 'text-accent-dark' : 'text-accent-light'"
        class="text-2xl font-bold text-center">
      Tags
    </h2>

    {% if tags %}
      <div class="flex flex-wrap gap-3 justify-center">

        {% for tag in tags %}
          <a href="{% url 'verbena:page_list_by_tag' tag.slug %}"
             :class="darkMode
               ? 'bg-primary-bg-dark border border-accent-1 hover:bg-bubble-bg-dark text-accent-dark'
               : 'bg-primary-bg-light border border-accent-2 hover:bg-bubble-bg-light text-accent-light'"
             class="px-3 py-2 rounded-md text-sm font-semibold transition-colors duration-300 shadow-sm cursor-pointer">
            #{{ tag.name }}
          </a>
        {% endfor %}

      </div>
    {% else %}
      <p class="text-center text-sm text-gray-500 dark:text-gray-400">
        No tags available yet.
      </p>
    {% endif %}

    <a href="{% url 'nest:dashboard' %}"
       :class="darkMode
         ? 'bg-accent-dark text-primary-bg-dark'
         : 'bg-accent-light text-primary-bg-light'"
       class="inline-block px-4 py-2 mt-6 rounded font-semibold hover:opacity-90 transition text-sm text-center">
      Back to Dashboard
    </a>

  </div>
</section>
{% endblock %}
