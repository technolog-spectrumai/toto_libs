[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# The LIGHT media tier — the one hosts pin. Two apps, both stateless and both
# switchable on their own:
#   toto.vod (BUILD_VOD, defaults from the older BUILD_MEDIA) — video and audio
#     playback plus a library page. No models (it dropped them in migration 0002),
#     no celery task, no native binary.
#   toto.ocr (BUILD_OCR, opt-in) — screenshot → tesseract → text. No models either
#     (its migrations squash to a no-op with no dependencies at all), no celery: it
#     shells out synchronously inside the request. Its one cost is the tesseract
#     binary, which INSTALL_TESSERACT gates and no host Dockerfile declares today,
#     and both of its imports (pytesseract, PIL) are inside the function — so a host
#     can pin this wheel, leave BUILD_OCR off, and pay nothing.
#
# This was the heavy package until 1.21, when the PROCESSING tier — manta,
# fileservices and transcription — moved to toto-media-ops, which no host pins.
# That is what dropped the toto-flow dependency: fileservices had a live FK to
# workflows.WorkflowRun and imported its predefined-task registry at module scope,
# and it was the last thing here that needed either. Nothing here imports toto-flow
# now, so a host can install toto-media without the workflow engine — which is what
# makes BUILD_MEDIA=1 viable on a lean WSGI host.
#
# Keep it that way. The line is a worker or a heavy wheel, not a native binary:
# anything needing celery, ffmpeg or torch belongs in toto-media-ops.
name = "toto-media"
version = "1.33"
description = "toto media over the vault: video/audio playback and OCR"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
dependencies = [
    "toto-base==1.33",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
# 'templates/**/*' (not '*.html'): sso_master ships a .txt email template.
"*" = [
    "templates/**/*",
    "static/**/*",
    "graph/*.yaml",
]
