[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# Two apps over vault files: video/audio playback (vod) and text recognition
# (ocr). Both are stateless — neither owns a table — and both are independently
# switchable (BUILD_VOD, BUILD_OCR).
#
# This was the heavy package until 1.21, when the ffmpeg processing half —
# manta, fileservices and transcription — was retired to toto_libs/limbo/. That
# is what dropped the toto-flow dependency: fileservices had a live FK to
# workflows.WorkflowRun and imported its predefined-task registry at module
# scope, and it was the last thing here that needed either. Nothing left in this
# package imports toto-flow, so a host can now install toto-media without the
# workflow engine. Keep it that way; see the PARKED.md files for the reasoning.
name = "toto-media"
version = "1.21"
description = "toto media over the vault: video/audio playback and OCR"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
dependencies = [
    "toto-base==1.21",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
# 'templates/**/*' (not '*.html'): sso_master ships a .txt email template.
"*" = [
    "templates/**/*",
    "static/**/*",
    "graph/*.yaml",
]
