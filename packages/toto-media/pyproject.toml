[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# One app: toto.vod — video and audio playback over the vault. No models (it
# dropped them in migration 0002), no celery task, no native binary. Switched by
# BUILD_VOD, which defaults from the older BUILD_MEDIA.
#
# This was the heavy package until 1.21, when the processing tier — manta,
# fileservices, transcription and ocr — moved to toto-media-ops, which no host
# pins. That is what dropped the toto-flow dependency: fileservices had a live FK
# to workflows.WorkflowRun and imported its predefined-task registry at module
# scope, and it was the last thing here that needed either. Nothing left in this
# package imports toto-flow, so a host can install toto-media without the workflow
# engine — which is what makes BUILD_MEDIA=1 viable on a lean WSGI host. Keep it
# that way: anything needing a worker or a binary belongs in toto-media-ops.
name = "toto-media"
version = "1.21"
description = "toto video and audio playback over the vault"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
dependencies = [
    "toto-base==1.21",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
# 'templates/**/*' (not '*.html'): sso_master ships a .txt email template.
"*" = [
    "templates/**/*",
    "static/**/*",
    "graph/*.yaml",
]
