[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# ambrosia is the shared workspace base: a folder with a file tree, and the
# settings, hibernation and Gear-selection machinery over it. The LANGUAGE apps
# on top of it (toto.texlab, toto.dracena) are host portions and register into
# ambrosia's registry from their own ready() — ambrosia never imports them.
#
# It became a wheel on 2026-09-01, for the reason toto-anastasia is one: a
# workspace is not zenobia-specific. Two hosts need it at once — placidia for
# the labs, zenobia for version control, whose REPO_WORKSPACES_ONLY makes
# `repo.services.create_repo` refuse any directory that is not a workspace
# root. A PEP 420 host portion belongs to exactly one host, so the split forced
# the promotion.
name = "toto-ambrosia"
version = "2.0"
description = "toto workspaces: the shared base under the language labs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
#
# toto-base only. Ambrosia's references to toto.anastasia, toto.dracena,
# toto.repo and toto.texlab are ALL soft — `apps.is_installed` plus
# function-scoped imports — so none of them is a dependency. Its TEST modules
# do import anastasia and dracena at module scope, which is why they are named
# by the gate of the host that installs those, not run from here.
dependencies = [
    "toto-base==2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
    "templates/**/*",
    "static/**/*",
]
