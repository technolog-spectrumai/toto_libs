[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toto-business"
version = "2.0"
description = "toto business center: companies, share register, voting, decision ledger"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
#
# toto-base is a HARD edge three times over: ForeignKey("vault.VaultFile") and
# ForeignKey("people.Person") strings in company/models.py, and
# company/migrations/0001_initial depending on vault, people, locations and
# events.
#
# toto-geo since 2026-10-04: company/models.py and its 0001 migration key into
# locations, which left toto-base for toto-geo that day.
dependencies = [
    "toto-base==2.0",
    "toto-geo==2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
    "templates/**/*",
    "static/**/*",
]
