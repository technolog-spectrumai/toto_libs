[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toto-business"
version = "1.50"
description = "toto business center: companies, share register, voting, decision ledger"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
#
# toto-base is a HARD edge three times over: ForeignKey("vault.VaultFile") and
# ForeignKey("people.Person") strings in company/models.py, and
# company/migrations/0001 depending on vault 0022 + people 0004.
dependencies = [
    "toto-base==1.50",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
    "templates/**/*",
    "static/**/*",
]
