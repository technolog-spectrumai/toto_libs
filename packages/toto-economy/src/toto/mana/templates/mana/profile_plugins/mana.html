{% load i18n %}
{% if mana_balances %}
<section :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
         class="rounded-2xl border p-5 shadow-sm sm:p-6" data-testid="mana-profile">
  <div class="mb-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <i class="{{ profile_plugin_icon }}" :class="darkMode ? 'text-security-dark' : 'text-security-light'"></i>
      <h2 class="text-lg font-bold">{% trans "Mana" %}</h2>
    </div>
    <a href="{% url 'mana:index' %}"
       :class="darkMode ? 'border-accent-1 text-text-main-dark hover:bg-primary-bg-dark' : 'border-accent-2 text-text-main-light hover:bg-primary-bg-light'"
       class="inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-semibold transition"
    ><i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>{% trans "Open mana" %}</a>
  </div>
  <div class="grid gap-3 sm:grid-cols-3">
    {% for b in mana_balances %}<div>{% include "mana/partials/_bar.html" %}</div>{% endfor %}
  </div>
</section>
{% endif %}
