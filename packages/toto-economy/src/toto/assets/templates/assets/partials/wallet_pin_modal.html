{% load i18n %}
<div x-show="pinOpen"
     x-transition:enter="transition ease-out duration-150"
     x-transition:enter-start="opacity-0 scale-95"
     x-transition:enter-end="opacity-100 scale-100"
     x-cloak
     class="fixed inset-0 z-[9999] flex items-center justify-center p-4"
     @keydown.escape.window="pinOpen = false">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="pinOpen = false"></div>
  <div :class="darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2'"
       class="relative z-10 w-full max-w-sm rounded-2xl border p-6 shadow-2xl space-y-4">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="text-xs font-bold uppercase tracking-wide opacity-50">{% trans "PIN required" %}</p>
        <h3 class="font-bold text-lg mt-0.5">{% trans "Settle obligation" %}</h3>
        <p class="text-sm font-semibold mt-1" x-text="pendingAmount + ' ' + pendingUnit"></p>
        <div class="mt-1 text-xs opacity-60 space-y-0.5">
          <p>{% trans "To" %}: <span class="font-semibold" x-text="pendingTo"></span></p>
          <p>{% trans "From wallet" %}: <span class="font-semibold" x-text="pendingFrom"></span></p>
          <p x-show="pendingRef" class="opacity-70" x-text="'Ref: ' + pendingRef"></p>
        </div>
      </div>
      <button type="button" @click="pinOpen = false" class="opacity-40 hover:opacity-80 transition text-xl leading-none shrink-0">&times;</button>
    </div>

    <div class="space-y-1">
      <label class="block text-xs font-semibold opacity-60 uppercase tracking-wide">{% trans "PIN" %}</label>
      <input type="password"
             inputmode="numeric"
             autocomplete="current-password"
             x-model="pinValue"
             @keydown.enter.prevent="submitPin()"
             :class="darkMode ? 'border-accent-1 bg-primary-bg-dark text-text-main-dark' : 'border-accent-2 bg-primary-bg-light text-text-main-light'"
             class="w-full rounded-xl border px-4 py-3 text-center text-2xl font-mono tracking-[0.5em] outline-none transition focus:ring-2 focus:ring-current/20"
             placeholder="••••">
      <p x-show="pinError" x-text="pinError"
         :class="darkMode ? 'text-warn-dark' : 'text-warn-light'"
         class="text-xs mt-1 font-semibold"></p>
    </div>

    <button type="button" @click="submitPin()"
            :disabled="pinLoading"
            :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
            class="w-full rounded-xl py-3 font-bold text-sm transition hover:opacity-85 disabled:opacity-50 flex items-center justify-center gap-2">
      <i class="fa-solid" :class="pinLoading ? 'fa-spinner fa-spin' : 'fa-bolt'"></i>
      <span x-text="pinLoading ? 'Verifying…' : 'Confirm transfer'"></span>
    </button>

    <p class="text-center text-xs opacity-40">
      <a href="{% url 'assets:wallet_pin_set' %}" class="underline hover:opacity-80 transition">{% trans "Change PIN" %}</a>
    </p>
  </div>
</div>
