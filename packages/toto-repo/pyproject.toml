[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# toto.repo and toto.gitea are two apps in one distribution and never one app:
# a host installs the local half, the remote half, or both, and the two halves
# went to different hosts the moment zenobia stopped versioning documents with
# git. They ship together because a wheel per app for ~500 lines of Gitea REST
# would be a pin, a tier and a vendor rule for no separation the app labels do
# not already give.
name = "toto-repo"
version = "1.50"
description = "toto local git over vault directories, and the optional Gitea remote"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
#
# toto-flow is a HARD dependency of toto.repo, not a nicety: GitRun.workflow_run
# is a real FK into workflows.WorkflowRun and its initial migration depends on
# that app, so a host installing toto.repo without the engine fails Django's
# system check with fields.E300. toto.gitea needs neither and would be happy on
# toto-base alone; the distribution takes the stricter of the two.
dependencies = [
    "toto-base==1.50",
    "toto-flow==1.50",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
# The UI is a template and a script; without this they are absent from the
# wheel and the failure lands at render time on a deployed host.
"*" = [
    "templates/**/*",
    "static/**/*",
]
