[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# The content tier: kanban, memo, cyprian and primula. (antaresia, the old
# vault Python runner, was deleted in 1.45 — its name now belongs to zenobia's
# Python workspace app, ambrosia's successor.) cyprian is here rather than in a
# package of its own because it imports memo's sanitisers and media helpers —
# same wheel, plain intra-package import, no new distribution edge. The
# toto-flow dep left with antaresia — nothing else in this wheel touches the
# workflow engine.
name = "toto-works"
version = "1.45"
description = "toto workflow-backed file, document and data services"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
dependencies = [
    "toto-base==1.45",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
# 'templates/**/*' (not '*.html'): sso_master ships a .txt email template.
"*" = [
    "templates/**/*",
    "static/**/*",
    "graph/*.yaml",
]
