{% load i18n %}
<aside
  :class="[
    darkMode
      ? 'border-accent-1 bg-bubble-bg-dark text-text-main-dark'
      : 'border-accent-2 bg-bubble-bg-light text-text-main-light',
    sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'
  ]"
  class="fixed inset-y-0 left-0 z-50 flex w-[min(90vw,360px)] flex-col rounded-r-lg border-r p-4 shadow-xl transition-transform duration-300 lg:static lg:z-auto lg:h-[76vh] lg:w-auto lg:rounded-lg lg:border lg:shadow-sm">

  <div class="mb-4 flex items-start justify-between gap-3">
    <div>
      <h2 class="text-lg font-bold">{% trans "Location index" %}</h2>
      <p class="text-xs opacity-65">
        <span x-text="visibleLocations.length"></span>
        shown
      </p>
    </div>

    <button
      type="button"
      @click="sidebarOpen = false; setTimeout(() => refreshMapSize(), 250)"
      class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-current/15 transition hover:opacity-75 lg:hidden"
      aria-label="{% trans 'Close locations panel' %}">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <label class="relative block">
    <span class="sr-only">{% trans "Search locations" %}</span>
    <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm opacity-50"></i>

    <input
      x-model="search"
      type="search"
      placeholder="{% trans 'Search by name or type' %}"
      :class="darkMode
        ? 'border-accent-1 bg-primary-bg-dark text-text-main-dark placeholder:text-text-main-dark/50'
        : 'border-accent-2 bg-primary-bg-light text-text-main-light placeholder:text-text-main-light/50'"
      class="w-full rounded-lg border py-2 pl-9 pr-3 text-sm outline-none transition focus:ring-2 focus:ring-current/20" />
  </label>

  <div class="mt-4 flex flex-wrap gap-2">
    <template x-for="type in availableTypes" :key="type">
      <button
        type="button"
        @click="selectType(type)"
        x-show="type === 'All' || isTypeVisible(type)"
        :class="activeType === type
          ? (darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light')
          : (darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light')"
        class="rounded-lg border px-3 py-1.5 text-xs font-semibold transition hover:opacity-85">
        <span x-text="type"></span>
      </button>
    </template>
  </div>

  <div class="mt-4 grid grid-cols-2 gap-2">
    <button
      type="button"
      @click="fitAll"
      :class="darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light'"
      class="inline-flex items-center justify-center gap-2 rounded-lg border px-3 py-2 text-sm font-semibold transition hover:opacity-85">
      <i class="fa-solid fa-expand"></i>{% trans "Fit all" %}</button>

    <button
      type="button"
      @click="search = ''; activeType = 'All'"
      :class="darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light'"
      class="inline-flex items-center justify-center gap-2 rounded-lg border px-3 py-2 text-sm font-semibold transition hover:opacity-85">
      <i class="fa-solid fa-rotate-left"></i>{% trans "Reset" %}</button>
  </div>

  <div
    :class="darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light'"
    class="mt-4 rounded-lg border p-3">

    <div class="flex items-center justify-between gap-3">
      <button
        type="button"
        @click="visibilityOpen = !visibilityOpen"
        class="flex min-w-0 flex-1 items-center gap-2 text-left">
        <i class="fa-solid fa-eye"></i>

        <span class="min-w-0">
          <span class="block text-sm font-bold">{% trans "Visible on map" %}</span>
          <span class="block truncate text-xs opacity-65">{% trans "Hide zones, addresses, routes, or other feature types." %}</span>
        </span>

        <i
          class="fa-solid fa-chevron-down ml-auto text-xs transition"
          :class="visibilityOpen ? 'rotate-180' : ''"></i>
      </button>

      <div class="flex gap-1">
        <button
          type="button"
          @click="showAllTypes"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-current/15 transition hover:opacity-75"
          aria-label="{% trans 'Show all feature types' %}">
          <i class="fa-solid fa-eye"></i>
        </button>

        <button
          type="button"
          @click="hideAllTypes"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-current/15 transition hover:opacity-75"
          aria-label="{% trans 'Hide all feature types' %}">
          <i class="fa-solid fa-eye-slash"></i>
        </button>
      </div>
    </div>

    <div class="mt-3 grid gap-2" x-show="visibilityOpen" x-cloak>
      <template x-for="type in availableTypes.filter((item) => item !== 'All')" :key="type">
        <button
          type="button"
          @click="toggleType(type)"
          :class="isTypeVisible(type)
            ? (darkMode ? 'border-accent-dark bg-bubble-bg-dark' : 'border-accent-light bg-bubble-bg-light')
            : 'border-current/10 opacity-55'"
          class="flex items-center justify-between gap-3 rounded-lg border px-3 py-2 text-left text-sm transition hover:opacity-85">
          <span class="flex min-w-0 items-center gap-2">
            <span :style="typeStyle(type)" class="h-2.5 w-2.5 shrink-0 rounded-full"></span>
            <span class="truncate font-semibold" x-text="type"></span>
          </span>

          <i class="fa-solid" :class="isTypeVisible(type) ? 'fa-eye' : 'fa-eye-slash'"></i>
        </button>
      </template>
    </div>
  </div>

  <div
    :class="darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light'"
    class="mt-4 rounded-lg border p-3">

    <div class="flex items-center justify-between gap-3">
      <button
        type="button"
        @click="layersOpen = !layersOpen"
        class="flex min-w-0 flex-1 items-center gap-2 text-left">
        <i class="fa-solid fa-layer-group"></i>

        <span class="min-w-0">
          <span class="block text-sm font-bold">{% trans "Layers" %}</span>
          <span
            class="block truncate text-xs opacity-65"
            x-text="selectedLayer ? selectedLayer.name : 'No layer selected'"></span>
        </span>

        <i
          class="fa-solid fa-chevron-down ml-auto text-xs transition"
          :class="layersOpen ? 'rotate-180' : ''"></i>
      </button>

      <button
        type="button"
        @click="layerSettingsOpen = true"
        :disabled="!selectedLayer"
        class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-current/15 transition hover:opacity-75 disabled:cursor-not-allowed disabled:opacity-40"
        aria-label="{% trans 'Configure layer' %}">
        <i class="fa-solid fa-sliders"></i>
      </button>
    </div>

    <div class="mt-3 space-y-2" x-show="layersOpen" x-cloak>
      <p
        class="text-xs opacity-65"
        x-text="selectedLayer ? selectedLayer.name : 'No layer selected'"></p>

      <button
        type="button"
        @click="clearLayer"
        :class="!selectedLayer
          ? (darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light')
          : 'border-current/10'"
        class="w-full rounded-lg border px-3 py-2 text-left text-sm font-semibold transition hover:opacity-85">{% trans "No overlay" %}</button>

      <template x-for="layer in mapLayers" :key="layer.slug">
        <button
          type="button"
          @click="selectLayer(layer.slug)"
          :class="selectedLayerSlug === layer.slug
            ? (darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light')
            : 'border-current/10'"
          class="w-full rounded-lg border px-3 py-2 text-left text-sm transition hover:opacity-85">
          <span class="flex items-center justify-between gap-2">
            <span class="font-semibold" x-text="layer.name"></span>
            <span class="text-xs opacity-70">
              <span x-text="layer.polygons.length"></span>
              zones
            </span>
          </span>

          <span class="mt-1 block text-xs opacity-65" x-text="layer.description"></span>
        </button>
      </template>
    </div>
  </div>

  <div class="mt-4 min-h-0 flex-1 overflow-y-auto pr-1">
    <template x-if="visibleLocations.length === 0">
      <div
        :class="darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light'"
        class="rounded-lg border border-dashed p-4 text-sm opacity-70">{% trans "No locations match this filter." %}</div>
    </template>

    <div class="space-y-2">
      <template x-for="location in visibleLocations" :key="`${location.type}-${location.name}`">
        <div
          :class="[
            selectedName === location.name
              ? (darkMode
                  ? 'border-accent-dark bg-primary-bg-dark'
                  : 'border-accent-light/60 bg-primary-bg-light')
              : (darkMode
                  ? 'border-white/8'
                  : 'border-accent-2/30 bg-primary-bg-light'),
            !location.geometry
              ? 'opacity-45'
              : (darkMode ? 'hover:-translate-y-0.5 hover:shadow-md' : 'hover:border-accent-light/50')
          ]"
          class="group rounded-lg border p-3 transition">

          <button
            type="button"
            @click="selectLocation(location)"
            :disabled="!location.geometry"
            class="w-full text-left disabled:cursor-not-allowed">

            <div class="flex items-start gap-3">
              <span :style="typeStyle(location.type)" class="mt-1 h-2.5 w-2.5 shrink-0 rounded-full"></span>

              <span class="min-w-0 flex-1">
                <span class="flex items-center justify-between gap-2">
                  <span class="text-xs font-semibold uppercase opacity-65" x-text="location.type"></span>
                  <span class="text-[11px] opacity-55" x-text="geometryLabel(location)"></span>
                </span>

                <span class="mt-1 block break-words text-sm font-semibold" x-text="location.name"></span>
                <span class="mt-1 block break-words text-xs opacity-60" x-show="location.detail" x-text="location.detail"></span>
              </span>
            </div>
          </button>

          <div class="mt-3 flex flex-wrap gap-2">
            <a
              x-show="location.detail_url"
              :href="location.detail_url"
              @click.stop
              :class="darkMode
                ? 'bg-accent-dark text-primary-bg-dark'
                : 'border-accent-light/50 text-accent-light'"
              class="inline-flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-xs font-semibold transition hover:opacity-80">
              <i class="fa-solid fa-circle-info"></i>
              <span>{% trans "Details" %}</span>
            </a>
          </div>
        </div>
      </template>
    </div>
  </div>
</aside>
