[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# Everything with geography in it. geography (2026-10-06: a person's point, a
# community's headquarters and zone, place-name and route search; two models
# with a geometry and no stored route; always GeoDjango), locations (the map: addresses, territories,
# zones, routes, layers, map domains, and the links from people, events and
# communities to them — in toto-base until 2026-10-04, when that package lost
# its geography) and weather (observations and forecasts keyed off
# locations.Address, run by workflow nodes). locations is the only app in the
# suite that may need GDAL (HAS_GIS on); a host that does not pin this wheel
# needs none.
name = "toto-geo"
version = "2.0"
description = "toto geo apps: geography, locations (the map) and weather"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
dependencies = [
    "toto-base==2.0",
    "toto-flow==2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
# 'templates/**/*' (not '*.html'): sso_master ships a .txt email template.
"*" = [
    "templates/**/*",
    "static/**/*",
    "graph/*.yaml",
]
