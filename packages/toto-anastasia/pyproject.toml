[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# anastasia is the execution subsystem: booked capacity, mounted Gears, and
# disposable runners. It owns no product data — see portal/anastasia.md.
name = "toto-anastasia"
version = "2.0"
description = "toto compute: reserved capacity, mounted Gears, disposable runners"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
#
# toto-base only: the Django half needs quota/vault conventions. The EXECUTOR
# half (toto.anastasia.executor) must import with no Django at all, so it may
# never grow a dependency that pulls Django in. A test asserts that.
dependencies = [
    "toto-base==2.0",
]

[project.scripts]
# The executor runs as a systemd unit on the HOST, out of its own venv at
# /opt/anastasia/venv, installed with `pip install --no-deps` so Django never
# lands beside it. `ExecStart=` names this script; without it the unit fails
# with status=203/EXEC and nothing says why.
#
# `python -m toto.anastasia.executor` remains equivalent and is what the tests
# use, so a broken entry point cannot hide behind a passing suite.
anastasia-executord = "toto.anastasia.executor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
    "templates/**/*",
    "static/**/*",
]
