{% load i18n %}
<form method="post" enctype="multipart/form-data"
  :class="darkMode
    ? '[&_input]:border-accent-1 [&_input]:bg-primary-bg-dark [&_input]:text-text-main-dark [&_textarea]:border-accent-1 [&_textarea]:bg-primary-bg-dark [&_textarea]:text-text-main-dark'
    : '[&_input]:border-accent-2 [&_input]:bg-primary-bg-light [&_input]:text-text-main-light [&_textarea]:border-accent-2 [&_textarea]:bg-primary-bg-light [&_textarea]:text-text-main-light'"
  class="space-y-4
         [&_label]:mb-1 [&_label]:block [&_label]:text-sm [&_label]:font-semibold
         [&_input[type=text]]:w-full [&_textarea]:w-full
         [&_input]:rounded-lg [&_input]:border [&_input]:px-3 [&_input]:py-2.5 [&_input]:text-sm
         [&_textarea]:rounded-lg [&_textarea]:border [&_textarea]:px-3 [&_textarea]:py-2.5 [&_textarea]:text-sm">
  {% csrf_token %}
  <input type="hidden" name="action" value="redeem">
  <div>
    <label for="fed_target">{% trans "Platform URL" %}</label>
    <input type="text" name="target" id="fed_target" value="{{ target }}" placeholder="https://zenobia.example.com">
    <p class="mt-1 text-xs opacity-60">{% trans "The platform you are federating to. The code is checked against it before anything is sent." %}</p>
  </div>
  <div>
    <label for="fed_code">{% trans "Pairing code" %}</label>
    <textarea name="code" id="fed_code" rows="3" placeholder="{% trans 'paste the code here' %}">{{ code }}</textarea>
  </div>
  <div>
    <label for="fed_image">{% trans "…or upload a picture of the QR code" %}</label>
    <input type="file" name="image" id="fed_image" accept="image/*">
  </div>
  <div>
    <label for="fed_label">{% trans "Label (optional)" %}</label>
    <input type="text" name="label" id="fed_label" placeholder="{% trans 'e.g. Zenobia' %}">
  </div>
  <button type="submit"
    :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
    class="inline-flex items-center gap-2 rounded-lg px-5 py-2.5 text-sm font-semibold shadow-sm transition hover:opacity-90">
    <i class="fa-solid fa-handshake"></i> {% trans "Redeem and federate" %}
  </button>
</form>
