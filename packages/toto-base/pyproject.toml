[build-system]
# setuptools >= 62.3 is required for '**' patterns in package-data globs.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# Every toto host installs this package. It carries the shared host
# API (features/registry/routing/schedules/conf/versioning) and the app
# cluster that cannot be layered apart: core, gervazy, people, locations
# and events form one irreducible foreign-key/import cycle.
name = "toto-base"
version = "1.51"
description = "toto foundation: core platform, identity, storage and the host API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Versions are lockstep across the whole toto suite and are rewritten only by
# scripts/release.py — never edit them by hand.
dependencies = [
    "Django>=4.2,<6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The vault's non-local storage backends. Hosts that use them add the extra to
# their requirements; the drivers themselves degrade to a friendly RuntimeError
# naming the missing package, so a host without the extra still boots.
s3 = ["boto3>=1.34"]
remote-vault = ["requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]
# Each package owns exactly the portions present under its own src/toto/.
# scripts/check_package_graph.py enforces that the partition stays disjoint.
include = ["toto*"]
namespaces = true

[tool.setuptools.package-data]
# 'templates/**/*' (not '*.html'): sso_master ships a .txt email template.
"*" = [
    "templates/**/*",
    "static/**/*",
    "graph/*.yaml",
]
# The plan ladder and its documentation. A data file left out of this list
# works from a checkout and VANISHES in the wheel — the failure the packaging
# suite exists to catch — and here it would take every plan with it.
"toto.subscriptions" = ["*.yaml", "*.md"]

[tool.setuptools.exclude-package-data]
# Vendor assets are downloaded at deploy time (download_vendor.py). This was
# written to keep wheels deterministic when built from a checkout that fetched
# them, AND IT CANNOT DO THAT — `packages.find` runs with `namespaces = true`,
# so setuptools discovers toto.core.static.vendor.fontawesome and its siblings
# as packages in their own right, and an exclusion keyed on `toto.core` never
# sees a file that belongs to a different package. It drops the four files
# directly under vendor/ and leaves the nine in subdirectories, which is why
# test_no_foreign_payload was failing rather than this line preventing it.
#
# It stays because those four are real, and because deleting it would read as
# "nothing guards this". The guard that WORKS is a prune before the build, in
# scripts/build_wheels.py and both pip-wheel call sites in the monorepo's
# clean_env_lib.sh. Do not trust this key alone.
"toto.core" = ["static/vendor/**"]
