{% load i18n %}
<div class="chart-container" style="width: 100%; height: auto;">
    <canvas id="{{ chart_id }}"></canvas>
</div>

<script>
(function() {
    const chart = JSON.parse('{{ data|escapejs }}');
    const ctx = document.getElementById('{{ chart_id }}').getContext('2d');

    // Detect dark mode from Alpine/localStorage
    const isDark = localStorage.getItem('darkMode') === 'true';

    // Your full theme color dictionary
    const themeColors = {{ theme.theme.colors|safe }};

    // Pick colors based on mode
    const textColor = isDark ? themeColors["text-main-dark"] : themeColors["text-main-light"];
    const gridColor = dim(textColor, 0.25);
    const tooltipBg = isDark ? themeColors["bubble-bg-dark"] : "#ffffff";
    const tooltipText = textColor;
    const accentColor = isDark ? themeColors["accent-dark"] : themeColors["accent-light"];
    // Build final options
    const options = Object.assign({}, chart.options || {}, {
        responsive: true,
        maintainAspectRatio: false,

        plugins: {
            legend: {
                labels: {
                    color: textColor
                }
            },
            tooltip: {
                backgroundColor: tooltipBg,
                titleColor: tooltipText,
                bodyColor: tooltipText,
                borderColor: accentColor,
                borderWidth: 1
            }
        },

        // Only apply axes if chart type supports them
        scales: (chart.chart_type !== 'pie' && chart.chart_type !== 'doughnut')
            ? {
                x: Object.assign({}, chart.options?.scales?.x || {}, {
                    ticks: { color: textColor },
                    grid: { color: gridColor }
                }),
                y: Object.assign({}, chart.options?.scales?.y || {}, {
                    ticks: { color: textColor },
                    grid: { color: gridColor }
                })
            }
            : {}
    });
    new Chart(ctx, {
        type: chart.chart_type,
        data: {
            labels: chart.labels,
            datasets: chart.datasets
        },
        options: options
    });
})();
</script>
