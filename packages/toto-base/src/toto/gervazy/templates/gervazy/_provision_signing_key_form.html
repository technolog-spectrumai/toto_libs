{% load i18n %}
<form method="post" action="{% url 'gervazy:provision_signing_key' %}"
      :class="darkMode ? 'border-accent-1 bg-sunken-dark' : 'border-accent-2 bg-sunken-light'"
      class="rounded-xl border p-4 shadow-sm space-y-3">
  {% csrf_token %}
  <p class="text-xs font-semibold opacity-70">{% trans "Strongbox password — used only to decrypt your private key in memory. Never stored." %}</p>

  <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
    <div class="flex-1">
      <label class="mb-1 block text-xs font-semibold opacity-70">{% trans "Strongbox" %}</label>
      <select name="strongbox_id"
              :class="darkMode ? 'bg-primary-bg-dark border-accent-1 text-text-main-dark' : 'bg-primary-bg-light border-accent-2 text-text-main-light'"
              class="w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2">
        {% for sb in strongboxes %}
          {% if sb.data_keys.count > 0 %}
            <option value="{{ sb.pk }}">{{ sb.name }}</option>
          {% endif %}
        {% endfor %}
      </select>
    </div>
    <div class="flex-1">
      <label class="mb-1 block text-xs font-semibold opacity-70">{% trans "Password *" %}</label>
      <input type="password" name="password" required autocomplete="current-password"
             :class="darkMode ? 'bg-primary-bg-dark border-accent-1 text-text-main-dark' : 'bg-primary-bg-light border-accent-2 text-text-main-light'"
             class="w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2"
             placeholder="••••••••">
    </div>
    <button type="submit"
            :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
            class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow-sm hover:opacity-90">
      <i class="fa-solid fa-key"></i>
      {{ label|default:"Provision" }}
    </button>
  </div>
</form>
