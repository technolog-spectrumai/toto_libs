{% extends "admin/base_site.html" %}
{% load static %}
{% load i18n %}

{% block content %}
<h1>{% trans "Reveal Secret Key" %}</h1>

<p>{% trans "You are about to reveal the selected secret(s). Enter the passphrase to continue." %}</p>

<form method="post">
  {% csrf_token %}
  <div>
    <label for="passphrase">{% trans "Passphrase:" %}</label>
    <input type="password" name="passphrase" id="passphrase" required>
  </div>
  <button type="submit" class="button default">{% trans "Reveal" %}</button>
  <a href=".." class="button cancel">{% trans "Cancel" %}</a>
</form>
{% endblock %}
