{% load i18n %}{% comment %}A trashed file's actions (trash.html, a row `r`): Restore
   posts at once; Delete for good opens the page's confirmation modal.{% endcomment %}
<div class="flex flex-wrap gap-2">
  <form method="post" action="{{ r.restore_url }}">
    {% csrf_token %}
    <input type="hidden" name="page" value="{{ page_obj.number|default:1 }}">
    <button type="submit" data-testid="trash-restore-{{ r.file.pk }}"
            class="inline-flex items-center gap-1 rounded border border-current/25 px-2 py-1 text-xs font-semibold">
      <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>{% trans "Restore" %}</button>
  </form>
  <button type="button" data-url="{{ r.purge_url }}" data-name="{{ r.file.title }}"
          @click="open('purge', $el)" data-testid="trash-purge-{{ r.file.pk }}"
          class="inline-flex items-center gap-1 rounded border border-red-500/60 px-2 py-1 text-xs font-semibold text-red-600 dark:text-red-400">
    <i class="fa-solid fa-fire" aria-hidden="true"></i>{% trans "Delete for good" %}</button>
</div>
