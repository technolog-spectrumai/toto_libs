{% load i18n %}
<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold
  {% if status == 'applied' %}bg-emerald-500/15 text-emerald-500
  {% elif status == 'review' %}bg-amber-500/15 text-amber-500
  {% elif status == 'failed' %}bg-rose-500/15 text-rose-500
  {% elif status == 'running' %}bg-sky-500/15 text-sky-500
  {% elif status == 'empty' %}bg-slate-500/15 text-slate-400
  {% else %}bg-slate-500/15 text-slate-400{% endif %}">
  {% if status == 'running' %}<i class="fa-solid fa-spinner fa-spin"></i>{% endif %}
  {{ status }}</span>
