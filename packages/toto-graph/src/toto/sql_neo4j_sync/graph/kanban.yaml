app: kanban

nodes:
  - label: KanbanProject
    model: toto.kanban.models.Project
    uuid_field: uid
    fields:
      name: name
      description: description

  - label: KanbanCampaign
    model: toto.kanban.models.Campaign
    uuid_field: uid
    fields:
      name: name
      description: description
      start_date:
        source: start_date
        transform: str
      end_date:
        source: end_date
        transform: str
      metadata:
        source: metadata
        transform: default_dict

  - label: KanbanMission
    model: toto.kanban.models.Mission
    uuid_field: uid
    fields:
      title: title
      description: description
      visibility: visibility
      urgency: urgency
      impact: impact
      metadata:
        source: metadata
        transform: default_dict
      budget_amount:
        source: budget_amount
        transform: str
      budget_currency: budget_currency

  - label: KanbanSprint
    model: toto.kanban.models.Sprint
    uuid_field: uid
    fields:
      name: name
      start_time: start_time
      end_time: end_time

  - label: KanbanTask
    model: toto.kanban.models.Task
    uuid_field: uid
    fields:
      title: title
      description: description
      status: status
      due_date:
        source: due_date
        transform: str
      position: position
      weight: weight
      metadata:
        source: metadata
        transform: default_dict
      completed_at: completed_at

  # One node per wiki page. DocumentationSection is gone — a page's prose is a
  # single body_html now, written through the cyprian bridge, so there are no
  # section rows left to mirror.
  - label: KanbanDocPage
    model: toto.kanban.models.DocumentationPage
    uuid_field: uid
    fields:
      title: title
      slug: slug
      is_manual: is_manual

links:
  - from_label: KanbanProject
    to_label: Person
    relation: LED_BY
    source: project_lead
    cardinality: one
    nullable: true

  - from_label: KanbanCampaign
    to_label: KanbanProject
    relation: BELONGS_TO_PROJECT
    source: project
    cardinality: one
    nullable: false

  - from_label: KanbanCampaign
    to_label: Person
    relation: OWNED_BY
    source: owner
    cardinality: one
    nullable: true

  - from_label: KanbanMission
    to_label: KanbanCampaign
    relation: BELONGS_TO_CAMPAIGN
    source: campaign
    cardinality: one
    nullable: false

  - from_label: KanbanMission
    to_label: Person
    relation: OWNED_BY
    source: owner
    cardinality: one
    nullable: true

  - from_label: KanbanSprint
    to_label: KanbanProject
    relation: BELONGS_TO_PROJECT
    source: project
    cardinality: one
    nullable: false

  - from_label: KanbanTask
    to_label: KanbanMission
    relation: BELONGS_TO_MISSION
    source: mission
    cardinality: one
    nullable: false

  - from_label: KanbanTask
    to_label: KanbanSprint
    relation: BELONGS_TO_SPRINT
    source: sprint
    cardinality: one
    nullable: true

  - from_label: KanbanTask
    to_label: Person
    relation: ASSIGNED_TO
    source: assignee
    cardinality: one
    nullable: true

  # A page belongs to a project and only OPTIONALLY names a mission, so both of
  # these are nullable now; DOCUMENTS was nullable: false while the link was a
  # one-to-one that could not be absent.
  - from_label: KanbanDocPage
    to_label: KanbanProject
    relation: BELONGS_TO_PROJECT
    source: project
    cardinality: one
    nullable: false

  - from_label: KanbanDocPage
    to_label: KanbanMission
    relation: DOCUMENTS
    source: mission
    cardinality: one
    nullable: true

  - from_label: KanbanDocPage
    to_label: KanbanDocPage
    relation: CHILD_OF
    source: parent
    cardinality: one
    nullable: true
