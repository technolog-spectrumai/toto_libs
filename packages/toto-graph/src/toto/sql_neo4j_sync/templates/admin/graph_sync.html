{% extends "admin/change_list.html" %}
{% load i18n %}

{% block content %}
<form method="post" action="run-sync/">
    {% csrf_token %}
    <h3>{% trans "Select models to sync" %}</h3>

    <button type="button" class="button" id="select-all">{% trans "Select All" %}</button>
    <button type="button" class="button" id="deselect-all">{% trans "Deselect All" %}</button>

    <br><br>

    {% for app, models in grouped_models.items %}
        <h4>{{ app|title }}</h4>

        {% for model in models %}
            <label>
                <input type="checkbox" name="models" value="{{ model }}" class="model-checkbox">
                {{ model }}
            </label><br>
        {% endfor %}
    {% endfor %}

    <br>
    <button type="submit" class="button">{% trans "Run Sync" %}</button>
</form>

<script>
document.getElementById("select-all").onclick = function() {
    document.querySelectorAll(".model-checkbox").forEach(cb => cb.checked = true);
};

document.getElementById("deselect-all").onclick = function() {
    document.querySelectorAll(".model-checkbox").forEach(cb => cb.checked = false);
};
</script>
{% endblock %}
