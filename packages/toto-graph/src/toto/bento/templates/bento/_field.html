{% load i18n %}
<div class="space-y-1">
  <label for="{{ field.id_for_label }}" class="block text-sm font-semibold">
    {{ field.label }}{% if field.field.required %} <span class="opacity-60">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="text-xs opacity-60">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div class="text-sm text-warn-light">{{ field.errors }}</div>{% endif %}
</div>
