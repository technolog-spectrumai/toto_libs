{% load i18n %}
{# Add-edge modal body; lives inside x-data="edgeModal(...)"; args pick_field/pick_label #}
<div>
  <label class="mb-1 block text-sm font-semibold">{% trans "Edge type" %}</label>
  <select name="edge_type" x-model="etype" required
    :class="darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light'"
    class="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-current/20">
    <option value="">—</option>
    <template x-for="et in edgeTypes" :key="et.slug"><option :value="et.slug" x-text="et.name"></option></template>
  </select>
</div>
<div>
  <label class="mb-1 block text-sm font-semibold">{{ pick_label }}</label>
  <select name="{{ pick_field }}" required
    :class="darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light'"
    class="w-full rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-current/20">
    <option value="">—</option>
    <template x-for="n in options()" :key="n.id"><option :value="n.id" x-text="n.display + ' · ' + n.category_name"></option></template>
  </select>
  <p class="mt-1 text-xs opacity-60" x-show="etype && options().length === 0">{% trans "No valid nodes for this edge type." %}</p>
</div>
<div>
  <label class="mb-1 block text-sm font-semibold">{% trans "Data (JSON)" %}</label>
  <textarea name="data" rows="3" placeholder="{ }"
    :class="darkMode ? 'border-accent-1 bg-primary-bg-dark' : 'border-accent-2 bg-primary-bg-light'"
    class="w-full rounded-lg border px-3 py-2 font-mono text-sm outline-none focus:ring-2 focus:ring-current/20"></textarea>
</div>
<div class="flex justify-end gap-2 pt-1">
  <button type="submit"
    :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
    class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow-sm transition hover:opacity-90">
    <i class="fa-solid fa-plus"></i> {% trans "Add" %}
  </button>
</div>
