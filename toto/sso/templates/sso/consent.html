<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize {{ client.name }}</title>
</head>
<body>
  <main style="max-width: 640px; margin: 3rem auto; padding: 2rem; font-family: system-ui, sans-serif;">
    <h1>Authorize {{ client.name }}</h1>
    <p>This application wants to sign you in and access these identity claims:</p>
    <ul>
      {% for item in scope_items %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>
    <form method="post" action="{% url 'sso:consent' %}" style="display: flex; gap: 1rem; margin-top: 2rem;">
      {% csrf_token %}
      <input type="hidden" name="query_string" value="{{ query_string }}">
      <button type="submit" name="decision" value="approve">Allow</button>
      <button type="submit" name="decision" value="deny">Deny</button>
    </form>
  </main>
</body>
</html>
