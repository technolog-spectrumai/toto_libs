{% extends "oya/base.html" %}
{% load static %}

{% block title %}Locations – {{ platform.site_name }}{% endblock %}

{% block start_script %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block content %}
<div
  x-data="{ search: '', sidebarOpen: false }"
  :class="darkMode
    ? 'bg-primary-bg-dark text-text-main-dark'
    : 'bg-primary-bg-light text-text-main-light'"
  class="min-h-screen px-4 py-10 transition-colors duration-300">

  <div class="max-w-6xl mx-auto space-y-10">

    <h2 class="text-2xl font-bold mb-4">All Locations</h2>

    <!-- 📱 MOBILE MENU BUTTON -->
    <button
      @click="sidebarOpen = true"
      class="md:hidden px-4 py-2 rounded bg-blue-600 text-white"
    >
      Menu
    </button>

    <!-- 🌍 SIDEBAR + MAP -->
    <section class="flex flex-row gap-6 h-[80vh] md:h-[85vh] relative">

      <!-- 📌 SIDEBAR -->
      <aside
        class="w-64 h-full overflow-y-auto rounded border p-4 space-y-4
               md:static md:translate-x-0 md:block
               fixed top-0 left-0 z-50 transform -translate-x-full
               transition-transform duration-300 ease-in-out"
        :class="{
          'translate-x-0': sidebarOpen,
          '-translate-x-full': !sidebarOpen,
          'border-accent-1 bg-bubble-bg-dark text-text-main-dark': darkMode,
          'border-accent-2 bg-bubble-bg-light text-text-main-light': !darkMode
        }"
      >

        <!-- ❌ CLOSE BUTTON (MOBILE ONLY) -->
        <button
          @click="sidebarOpen = false"
          class="md:hidden mb-4 px-3 py-2 rounded bg-red-600 text-white"
        >
          Close
        </button>

        <h3 class="text-lg font-semibold">Locations</h3>

        <!-- 🔍 SEARCH BAR -->
        <input
          x-model="search"
          type="text"
          placeholder="Search..."
          class="w-full px-3 py-2 rounded text-sm transition-colors duration-300 border"
          :class="darkMode
            ? 'bg-primary-bg-dark text-text-main-dark border-accent-dark'
            : 'bg-primary-bg-light text-text-main-light border-accent-light'
          "
        />

        <!-- 📋 FILTERED LIST -->
        <div class="space-y-2">
          {% for loc in locations %}
            <template x-if="'{{ loc.name|lower }}'.includes(search.toLowerCase()) || '{{ loc.type|lower }}'.includes(search.toLowerCase())">
              <button
                onclick="zoomToFeature('{{ loc.name }}')"
                class="w-full text-left px-3 py-2 rounded transition
                       hover:bg-blue-100 dark:hover:bg-blue-900"
              >
                <div class="font-medium">{{ loc.type }}</div>
                <div class="text-sm opacity-80">{{ loc.name }}</div>
              </button>
            </template>
          {% endfor %}
        </div>

      </aside>

      <!-- 🌑 BACKDROP (MOBILE ONLY) -->
      <div
        class="fixed inset-0 bg-black bg-opacity-50 z-30 md:hidden"
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        x-transition.opacity
      ></div>

      <!-- 🗺️ MAP -->
      <div class="flex-1 h-full">
        <div id="map" class="w-full h-full rounded border z-0"
             :class="darkMode ? 'border-accent-1' : 'border-accent-2'"></div>
      </div>

    </section>
    <script>
      function pointToFakePolygon(geometry, size = 0.001) {
        const [lng, lat] = geometry.coordinates;

        return {
          "type": "Polygon",
          "coordinates": [[
            [lng - size, lat - size],
            [lng + size, lat - size],
            [lng + size, lat + size],
            [lng - size, lat + size],
            [lng - size, lat - size]
          ]]
        };
      }
    </script>
    <!-- 🧠 MAP SCRIPT -->
    <script>
    let map = null;
    let featuresDict = {};

    document.addEventListener("DOMContentLoaded", function () {
      const isDark = localStorage.getItem("darkMode") === "true";

      map = L.map("map").setView([52.0, 19.0], 6);

      const lightTiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png");
      const darkTiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png");

      (isDark ? darkTiles : lightTiles).addTo(map);

      const features = JSON.parse(`{{ locations_json|escapejs }}`);

      features.forEach(item => {
        const name = item.name;
        const type = item.type;
        const originalGeom = item.geometry;

        if (!originalGeom) return;

        // Create fake polygon for zooming if point
        const zoomGeom = originalGeom.type === "Point"
          ? pointToFakePolygon(originalGeom)
          : originalGeom;

        // Store both geometries
        featuresDict[name] = {
          displayGeom: originalGeom,
          zoomGeom: zoomGeom,
          type: type
        };

        // Render REAL geometry on map
        const layer = L.geoJSON(originalGeom, {
          style: {
            color: isDark ? "#FFCE56" : "#2563EB",
            weight: 2
          },
          pointToLayer: function (feature, latlng) {
            return L.marker(latlng); // REAL marker
          }
        }).addTo(map);

        layer.bindPopup(`<strong>${type}</strong><br>${name}`);
      });
    });

    function zoomToFeature(name) {
      const item = featuresDict[name];
      if (!item) return;

      const layer = L.geoJSON(item.zoomGeom);
      const bounds = layer.getBounds();

      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [20, 20] });
      }
    }
    </script>

  </div>
</div>
{% endblock %}
