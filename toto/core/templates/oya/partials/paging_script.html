{% load i18n %}
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('paginate', ({ perPage = 10 }) => ({

    page: 1,
    perPage,

    get total() {
      return this.$refs.items.children.length
    },

    get pages() {
      return Math.ceil(this.total / this.perPage)
    },

    visibleItems() {
      const start = (this.page - 1) * this.perPage
      const end = start + this.perPage
      return Array.from(this.$refs.items.children).slice(start, end)
    },

    update() {
      // hide all
      Array.from(this.$refs.items.children).forEach(el => el.style.display = 'none')

      // show only visible
      this.visibleItems().forEach(el => el.style.display = '')
    },

    next() {
      if (this.page < this.pages) {
        this.page++
        this.update()
      }
    },

    prev() {
      if (this.page > 1) {
        this.page--
        this.update()
      }
    },

    setPerPage(value) {
      this.perPage = Number(value)
      this.page = 1
      this.update()
    },

    init() {
      this.update()
    }

  }))
})
</script>
