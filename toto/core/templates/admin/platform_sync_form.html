{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div class="content">

    <form method="post" novalidate>
        {% csrf_token %}

        <fieldset class="module aligned">
            {{ form.as_p }}
        </fieldset>

        <div class="submit-row">
            <input type="submit" value="Run Sync" class="default">
            <a href=".." class="button cancel-link">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
