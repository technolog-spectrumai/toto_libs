demo_world:
  planet:
    name: New Dawn
    planet_type: desert
    size_class: medium
    habitability: 0.62
    gravity: 0.92
    radiation: 0.12
    max_provinces: 7
    policy: construction
  provinces:
    - name: Solar Flats
      terrain: desert
      biome: Salt desert
      specialization: energy
      cell_count: 14
      habitability: 0.45
      infrastructure_level: 1.2
      x: 0
      y: 0
      deposits:
        - deposit_type: lithium
          abundance: 1.2
          richness: 1.0
          accessibility: 1.0
      buildings:
        - building_type: solar_plant
          level: 2
          status: active
      inventory:
        energy: 250
        lithium: 80
    - name: Crystal Ridge
      terrain: mountain
      biome: Shield mountains
      specialization: mining
      cell_count: 12
      habitability: 0.38
      infrastructure_level: 0.9
      x: 1
      y: 0
      deposits:
        - deposit_type: crystal
          abundance: 1.1
          richness: 1.1
          accessibility: 0.8
        - deposit_type: rare_minerals
          abundance: 0.6
          richness: 0.9
          accessibility: 0.6
      inventory:
        crystal: 120
        rare_minerals: 20
    - name: Industrial Basin
      terrain: plains
      biome: Dry savanna basin
      specialization: industrial
      cell_count: 16
      habitability: 0.7
      infrastructure_level: 1.4
      x: 0
      y: 1
      deposits:
        - deposit_type: steel
          abundance: 1.0
          richness: 0.9
          accessibility: 1.0
        - deposit_type: hydrocarbons
          abundance: 0.8
          richness: 0.8
          accessibility: 0.9
        - deposit_type: water
          abundance: 1.0
          richness: 1.0
          accessibility: 1.0
      buildings:
        - building_type: chemical_plant
          level: 1
          status: active
        - building_type: prefab_factory
          level: 1
          status: active
      inventory:
        energy: 500
        steel: 500
        water: 500
        hydrocarbons: 250
  transport_links:
    - from: Solar Flats
      to: Industrial Basin
      mode: grid
      capacity_per_day: 500
      condition: 0.96
    - from: Crystal Ridge
      to: Industrial Basin
      mode: rail
      capacity_per_day: 260
      condition: 0.88
    - from: Industrial Basin
      to: Solar Flats
      mode: road
      capacity_per_day: 180
      condition: 0.92
