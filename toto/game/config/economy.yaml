      to: Industrial Basin
      mode: grid
      capacity_per_day: 500
      condition: 0.96
    - from: Crystal Ridge
      to: Industrial Basin
      mode: rail
      capacity_per_day: 260
      condition: 0.88
    - from: Industrial Basin
      to: Solar Flats
      mode: road
      capacity_per_day: 180
      condition: 0.92
