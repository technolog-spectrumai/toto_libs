    map_size: 512
    radius: 200
    grid_size: 12
    perlin_scale: 0.003
    perlin_octaves: 8
    sea_level: 0.38
    climate_seed: 47721
    wind_iterations: 5
    axial_tilt: 21.0
    coriolis_factor: 1.15
    solar_constant: 1.08
  provinces:
    - name: Solar Flats
      width: 4
      height: 3
      avg_elev: 0.44
      avg_temp: 0.86
      avg_rain: 0.12
      wind_speed: 0.66
      cell_count: 14
      x: 0
      y: 0
      deposits:
        - deposit_type: lithium
          abundance: 1.2
          richness: 1.0
          accessibility: 1.0
      buildings:
        - building_type: habitat_grid
          level: 1
          status: active
        - building_type: solar_plant
          level: 2
          status: active
      inventory:
        energy: 250
        lithium: 80
    - name: Crystal Ridge
      width: 3
      height: 4
      avg_elev: 0.78
      avg_temp: 0.36
      avg_rain: 0.34
      wind_speed: 0.74
      cell_count: 12
      x: 1
      y: 0
      deposits:
        - deposit_type: crystal
          abundance: 1.1
          richness: 1.1
          accessibility: 0.8
        - deposit_type: rare_minerals
          abundance: 0.6
          richness: 0.9
          accessibility: 0.6
      inventory:
        crystal: 120
        rare_minerals: 20
    - name: Industrial Basin
      width: 4
      height: 4
      avg_elev: 0.48
      avg_temp: 0.62
      avg_rain: 0.42
      wind_speed: 0.38
      cell_count: 16
      x: 0
      y: 1
      deposits:
        - deposit_type: steel
          abundance: 1.0
          richness: 0.9
          accessibility: 1.0
        - deposit_type: hydrocarbons
          abundance: 0.8
          richness: 0.8
          accessibility: 0.9
        - deposit_type: water
          abundance: 1.0
          richness: 1.0
          accessibility: 1.0
      buildings:
        - building_type: cargo_spine
          level: 2
          status: active
        - building_type: chemical_plant
          level: 1
          status: active
        - building_type: prefab_factory
          level: 1
          status: active
      inventory:
        energy: 500
        steel: 500
        water: 500
        hydrocarbons: 250
