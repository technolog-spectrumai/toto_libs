{% extends "bazaar/base.html" %}
{% block bazaar_title %}Shipment{% endblock %}
{% block bazaar_heading %}Shipment{% endblock %}
{% block bazaar_subtitle %}<p class="mt-2 max-w-2xl text-sm opacity-70">Update carrier, tracking, and fulfillment status.</p>{% endblock %}
{% block bazaar_content %}<form method="post" :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'" class="mx-auto max-w-3xl space-y-4 rounded-2xl border p-5 shadow-sm">{% csrf_token %}{{ form.as_p }}<button :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'" class="rounded-lg px-5 py-2 text-sm font-semibold shadow-sm">Save shipment</button></form>{% endblock %}
