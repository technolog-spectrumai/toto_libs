{% if severity == "critical" %}
  <span :class="darkMode ? 'bg-purple-900/30 text-purple-300' : 'bg-purple-100 text-purple-800'"
        class="inline-flex items-center gap-1 rounded px-2 py-0.5 text-xs font-semibold">
    <i class="fa-solid fa-circle-exclamation"></i> Critical
  </span>
{% elif severity == "high" %}
  <span :class="darkMode ? 'bg-red-900/30 text-red-300' : 'bg-red-100 text-red-800'"
        class="inline-flex items-center gap-1 rounded px-2 py-0.5 text-xs font-semibold">
    <i class="fa-solid fa-chevron-double-up"></i> High
  </span>
{% elif severity == "medium" %}
  <span :class="darkMode ? 'bg-amber-900/30 text-amber-300' : 'bg-amber-100 text-amber-800'"
        class="inline-flex items-center gap-1 rounded px-2 py-0.5 text-xs font-semibold">
    <i class="fa-solid fa-minus"></i> Medium
  </span>
{% else %}
  <span :class="darkMode ? 'bg-green-900/30 text-green-300' : 'bg-green-100 text-green-800'"
        class="inline-flex items-center gap-1 rounded px-2 py-0.5 text-xs font-semibold">
    <i class="fa-solid fa-chevron-down"></i> Low
  </span>
{% endif %}
