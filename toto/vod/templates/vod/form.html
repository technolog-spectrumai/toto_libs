{% extends "vod/base.html" %}
{% load i18n %}
{% block vod_title %}{{ action }}{% endblock %}
{% block vod_content %}

{# ── Breadcrumb ── #}
<div class="mb-5 flex items-center gap-2 text-sm opacity-60">
  {% if back_url %}
    <a href="{{ back_url }}" class="hover:underline">
      <i class="fa-solid fa-arrow-left mr-1 text-xs"></i>{% trans "Back" %}
    </a>
    <i class="fa-solid fa-chevron-right text-xs"></i>
  {% endif %}
  <span>{{ action }}</span>
</div>

<div class="mx-auto max-w-2xl">
  <div :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
       class="rounded-2xl border p-6 shadow-sm">
    <h1 class="mb-6 text-xl font-bold">{{ action }}</h1>
    {% include "vod/_form.html" %}
  </div>
</div>
{% endblock %}
