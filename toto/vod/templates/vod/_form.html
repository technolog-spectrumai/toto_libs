{% load i18n %}
<form method="post" enctype="multipart/form-data" class="space-y-5">
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div :class="darkMode ? 'border-warn-light/50 bg-warn-light/10' : 'border-warn-light/50 bg-warn-light/10'"
         class="rounded-xl border p-3 text-sm text-warn-light">
      {{ form.non_field_errors }}
    </div>
  {% endif %}
  {% for field in form %}
    <div class="space-y-1.5">
      <label class="text-sm font-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}
        <p class="text-xs opacity-55">{{ field.help_text }}</p>
      {% endif %}
      {% for error in field.errors %}
        <p class="text-xs text-warn-light">{{ error }}</p>
      {% endfor %}
    </div>
  {% endfor %}
  <div class="flex gap-3 pt-2">
    <button :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
            class="inline-flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-semibold shadow-sm transition hover:opacity-90"
            type="submit">
      {{ action }}
    </button>
    <a href="{{ back_url|default_if_none:'/' }}"
       :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
       class="inline-flex items-center gap-2 rounded-xl border px-5 py-2.5 text-sm font-medium transition hover:opacity-80">
      {% trans "Cancel" %}
    </a>
  </div>
</form>
