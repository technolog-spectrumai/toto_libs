{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<h1>Apply Transform to {{ image.filename }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="default">{% trans "Apply" %}</button>
</form>

<p><a href="{{ request.META.HTTP_REFERER }}">{% trans "Back" %}</a></p>
{% endblock %}
