{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<h1>Re-encrypt Password</h1>

<p>You are about to re-encrypt {{ count }} password{{ count|pluralize }}.
Enter the passphrase to confirm.</p>

<form method="post">
  {% csrf_token %}
  <div>
    <label for="passphrase">Passphrase:</label>
    <input type="password" name="passphrase" id="passphrase" required>
  </div>

  <button type="submit" class="button default">Re-encrypt</button>
  <a href=".." class="button cancel">Cancel</a>
</form>
{% endblock %}
