{% extends "admin/base_site.html" %}
{% load static %}
{% load i18n %}

{% block content %}
<h1>{% trans "Rotate Secret Key" %}</h1>

<p>You are about to rotate {{ count }} secret key{{ count|pluralize }}.  
Enter the passphrase to confirm.</p>

<form method="post">
  {% csrf_token %}
  <div>
    <label for="passphrase">{% trans "Passphrase:" %}</label>
    <input type="password" name="passphrase" id="passphrase" required>
  </div>

  <button type="submit" class="button default">{% trans "Rotate" %}</button>
  <a href=".." class="button cancel">{% trans "Cancel" %}</a>
</form>
{% endblock %}
