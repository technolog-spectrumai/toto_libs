{% extends "admin/base_site.html" %}

{% block content %}
<h1>Reveal Password</h1>

<p>
  You are about to reveal {{ count }} password{{ count|pluralize }}.
  Each password will be unlocked with its configured environment variable.
</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="button default">Reveal</button>
  <a href=".." class="button cancel">Cancel</a>
</form>
{% endblock %}
