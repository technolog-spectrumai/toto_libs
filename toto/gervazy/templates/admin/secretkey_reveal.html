{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<h1>Reveal Secret Key</h1>

<p>You are about to reveal the selected secret(s). Enter the passphrase to continue.</p>

<form method="post">
  {% csrf_token %}
  <div>
    <label for="passphrase">Passphrase:</label>
    <input type="password" name="passphrase" id="passphrase" required>
  </div>
  <button type="submit" class="button default">Reveal</button>
  <a href=".." class="button cancel">Cancel</a>
</form>
{% endblock %}
