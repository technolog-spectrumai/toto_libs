app: bento

nodes:
  - label: IdeaCategory
    model: toto.bento.models.Category
    uuid_field: uid
    fields:
      name: name
      slug: slug
      description: description

  - label: IdeaBox
    model: toto.bento.models.IdeaBox
    uuid_field: uid
    fields:
      label: label
      # body / source_* / quote now live inside the properties bag.
      properties:
        source: properties
        transform: default_dict
      created_at: created_at
      updated_at: updated_at

links:
  - from_label: IdeaBox
    to_label: IdeaCategory
    relation: HAS_CATEGORY
    source: category
    cardinality: one
    nullable: true

  # IdeaLink is a junction model that carries relationship properties.
  - from_label: IdeaBox
    to_label: IdeaBox
    relation: IDEA_LINK
    via_model: toto.bento.models.IdeaLink
    from_field: from_box
    to_field: to_box
    props:
      label: label
      properties: properties
      created_at: created_at
