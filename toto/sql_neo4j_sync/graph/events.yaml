app: events

nodes:
  - label: EventCategory
    model: toto.events.models.EventCategory
    uuid_field: uid
    fields:
      name: name
      description: description

  - label: Event
    model: toto.events.models.ScheduledEvent
    uuid_field: uid
    fields:
      title: title
      description: description
      start_time: start_time
      end_time: end_time
      public: public
      requires_registration: requires_registration
      capacity: capacity

  - label: EventInvite
    model: toto.events.models.EventInvite
    uuid_field: uid
    fields:
      status: status
      note: note
      sent_at: sent_at

  - label: Availability
    model: toto.events.models.Availability
    uuid_field: uid
    fields:
      availability_type: availability_type
      reason: reason
      start_time: start_time
      end_time: end_time
      blocks_scheduling: blocks_scheduling

links:
  - from_label: Event
    to_label: Person
    relation: ORGANIZED_BY
    source: organizers
    cardinality: many

  - from_label: Event
    to_label: Person
    relation: OWNED_BY
    source: owner
    cardinality: one
    nullable: true

  - from_label: Event
    to_label: EventCategory
    relation: HAS_CATEGORY
    source: category
    cardinality: one
    nullable: true

  - from_label: Event
    to_label: Address
    relation: HELD_AT
    source: address
    cardinality: one
    nullable: true

  - from_label: EventInvite
    to_label: Event
    relation: INVITE_FOR
    source: event
    cardinality: one
    nullable: false

  - from_label: EventInvite
    to_label: Person
    relation: INVITED
    source: person
    cardinality: one
    nullable: false

  - from_label: Availability
    to_label: Person
    relation: AVAILABILITY_OF
    source: person
    cardinality: one
    nullable: false
