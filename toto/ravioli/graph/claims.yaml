app: claims

nodes:
  - label: Entitlement
    model: toto.claims.models.Entitlement
    uuid_field: uuid
    fields:
      resource_label: resource_label
      kind: kind
      status: status
      starts_at: starts_at
      ends_at: ends_at
      source_type: source_type
      source_id: source_id
      created_at: created_at

  - label: ClaimsSchedule
    model: toto.claims.models.Schedule
    uuid_field: uuid
    fields:
      name: name
      kind: kind
      status: status
      frequency: frequency
      starts_at: starts_at
      ends_at: ends_at
      next_run_at: next_run_at
      source_type: source_type
      source_id: source_id

  - label: Condition
    model: toto.claims.models.Condition
    uuid_field: uuid
    fields:
      name: name
      kind: kind
      status: status
      description: description
      source_type: source_type
      source_id: source_id

  - label: Allocation
    model: toto.claims.models.Allocation
    uuid_field: uuid
    fields:
      amount_base_units: amount_base_units
      kind: kind
      status: status
      starts_at: starts_at
      ends_at: ends_at
      source_type: source_type
      source_id: source_id

  - label: ContractEvent
    model: toto.claims.models.ContractEvent
    uuid_field: uuid
    fields:
      kind: kind
      title: title
      description: description
      source_type: source_type
      source_id: source_id
      created_at: created_at

links:
  - from_label: Entitlement
    to_label: Agreement
    relation: UNDER_AGREEMENT
    source: agreement
    cardinality: one
    nullable: true

  - from_label: Entitlement
    to_label: LapisContract
    relation: UNDER_CONTRACT
    source: contract
    cardinality: one
    nullable: true

  - from_label: Entitlement
    to_label: LedgerAccount
    relation: HELD_BY
    source: holder_account
    cardinality: one
    nullable: false

