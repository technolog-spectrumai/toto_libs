app: palimpsest

nodes:
  - label: PalimpsestTag
    model: toto.palimpsest.models.Tag
    uuid_field: uid
    fields:
      name: name
      slug: slug

  - label: PalimpsestPage
    model: toto.palimpsest.models.Page
    uuid_field: uid
    fields:
      title: title
      slug: slug
      description: description
      created_at: created_at

  - label: PalimpsestSection
    model: toto.palimpsest.models.Section
    uuid_field: uid
    fields:
      title: title
      content: content
      order: order

links:
  - from_label: PalimpsestPage
    to_label: PalimpsestTag
    relation: HAS_TAG
    source: tags
    cardinality: many

  - from_label: PalimpsestSection
    to_label: PalimpsestPage
    relation: BELONGS_TO_PAGE
    source: page
    cardinality: one
    nullable: false

  - from_label: PalimpsestSection
    to_label: Person
    relation: AUTHORED_BY
    source: author
    cardinality: one
    nullable: true

  - from_label: PalimpsestSection
    to_label: PalimpsestTag
    relation: HAS_TAG
    source: tags
    cardinality: many
