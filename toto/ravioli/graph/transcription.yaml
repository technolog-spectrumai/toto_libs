app: transcription

nodes:
  - label: TranscriptCollection
    model: toto.transcription.models.TranscriptCollection
    uuid_field: slug
    fields:
      title: title
      slug: slug
      description: description

  - label: TranscriptSource
    model: toto.transcription.models.TranscriptSource
    uuid_field: id
    fields:
      status: status

  - label: TranscriptionJob
    model: toto.transcription.models.TranscriptionJob
    uuid_field: id
    fields:
      status: status

  - label: TranscriptArtifact
    model: toto.transcription.models.TranscriptArtifact
    uuid_field: uid
    fields:
      kind: kind

links:
  - from_label: TranscriptCollection
    to_label: Bucket
    relation: STORED_IN_BUCKET
    source: bucket
    cardinality: one
    nullable: true

  - from_label: TranscriptSource
    to_label: TranscriptCollection
    relation: PART_OF_COLLECTION
    source: collection
    cardinality: one
    nullable: false

  - from_label: TranscriptSource
    to_label: VaultFile
    relation: SOURCE_FILE
    source: source_file
    cardinality: one
    nullable: false

  - from_label: TranscriptionJob
    to_label: TranscriptSource
    relation: TRANSCRIBES
    source: source
    cardinality: one
    nullable: false

  - from_label: TranscriptArtifact
    to_label: TranscriptSource
    relation: ARTIFACT_OF
    source: source
    cardinality: one
    nullable: false

  - from_label: TranscriptArtifact
    to_label: TranscriptionJob
    relation: PRODUCED_BY_JOB
    source: job
    cardinality: one
    nullable: true

  - from_label: TranscriptArtifact
    to_label: VaultFile
    relation: STORED_AS
    source: vault_file
    cardinality: one
    nullable: false
