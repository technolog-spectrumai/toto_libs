app: assembly

nodes:
  - label: AssemblyProposal
    model: toto.assembly.models.AssemblyProposal
    uuid_field: id
    fields:
      proposal_type: proposal_type
      title: title
      body: body
      status: status
      is_repeal: is_repeal
      opens_at: opens_at
      closes_at: closes_at

  - label: AssemblyVote
    model: toto.assembly.models.AssemblyVote
    uuid_field: id
    fields:
      vote: vote

  - label: AssemblyDecision
    model: toto.assembly.models.AssemblyDecision
    uuid_field: id
    fields:
      decision_type: decision_type
      title: title
      content_hash: content_hash

  - label: CommunityRule
    model: toto.assembly.models.CommunityRule
    uuid_field: id
    fields:
      title: title
      text: text
      active: active

  - label: CommunityTransactionFee
    model: toto.assembly.models.CommunityTransactionFee
    uuid_field: id
    fields:
      fee_bps: fee_bps
      set_by: set_by
      active: active

  - label: PollTax
    model: toto.assembly.models.PollTax
    uuid_field: id
    fields:
      head_amount_base_units: head_amount_base_units
      wealth_rate_bps: wealth_rate_bps
      period: period
      active: active

  - label: AssemblyConfig
    model: toto.assembly.models.CommunityAssemblyConfig
    uuid_field: id
    fields:
      quorum_fraction: quorum_fraction

  - label: CommunitySenate
    model: toto.assembly.models.CommunitySenate
    uuid_field: id
    fields:
      is_active: is_active
      veto_window_days: veto_window_days

  - label: PollTaxPayment
    model: toto.assembly.models.PollTaxPayment
    uuid_field: id
    fields:
      period_label: period_label
      head_amount_paid_base_units: head_amount_paid_base_units
      wealth_amount_paid_base_units: wealth_amount_paid_base_units
      total_paid_base_units: total_paid_base_units
      paid_at: paid_at

  - label: SenateVeto
    model: toto.assembly.models.SenateVeto
    uuid_field: id
    fields:
      reason: reason
      vetoed_at: vetoed_at

links:
  - from_label: AssemblyProposal
    to_label: Community
    relation: PROPOSED_IN
    source: community
    cardinality: one
    nullable: false

  - from_label: AssemblyProposal
    to_label: Person
    relation: OPENED_BY
    source: opened_by
    cardinality: one
    nullable: true

  - from_label: AssemblyVote
    to_label: AssemblyProposal
    relation: VOTE_ON
    source: proposal
    cardinality: one
    nullable: false

  - from_label: AssemblyVote
    to_label: Person
    relation: VOTED_BY
    source: voter
    cardinality: one
    nullable: false

  - from_label: AssemblyDecision
    to_label: Community
    relation: ENACTED_IN
    source: community
    cardinality: one
    nullable: false

  - from_label: AssemblyDecision
    to_label: AssemblyProposal
    relation: STEMS_FROM
    source: proposal
    cardinality: one
    nullable: true

  - from_label: CommunityRule
