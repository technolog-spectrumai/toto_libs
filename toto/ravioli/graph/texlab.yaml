app: texlab

nodes:
  - label: LatexWorkspace
    model: toto.texlab.models.LatexWorkspace
    uuid_field: slug
    fields:
      name: name
      slug: slug
      created_at: created_at

  - label: LatexFile
    model: toto.texlab.models.LatexFile
    uuid_field: id
    fields:
      file_type: file_type
      added_at: added_at

  - label: CompileRun
    model: toto.texlab.models.CompileRun
    uuid_field: id
    fields:
      status: status
      started_at: started_at
      finished_at: finished_at

links:
  - from_label: LatexWorkspace
    to_label: Bucket
    relation: STORED_IN_BUCKET
    source: bucket
    cardinality: one
    nullable: false

  - from_label: LatexFile
    to_label: LatexWorkspace
    relation: PART_OF_WORKSPACE
    source: workspace
    cardinality: one
    nullable: false

  - from_label: LatexFile
    to_label: VaultFile
    relation: BACKED_BY_FILE
    source: vault_file
    cardinality: one
    nullable: false

  - from_label: CompileRun
    to_label: LatexWorkspace
    relation: COMPILED_IN
    source: workspace
    cardinality: one
    nullable: false

  - from_label: CompileRun
    to_label: LatexFile
    relation: COMPILED_FILE
    source: latex_file
    cardinality: one
    nullable: true
