app: workflows

nodes:
  - label: LambdaFunction
    model: toto.workflows.models.LambdaFunction
    uuid_field: id
    fields:
      function_name: function_name

  - label: Workflow
    model: toto.workflows.models.Workflow
    uuid_field: slug
    fields:
      name: name
      slug: slug
      description: description
      created_at: created_at

  - label: WorkflowReportTemplate
    model: toto.workflows.models.ReportTemplate
    uuid_field: slug
    fields:
      name: name
      slug: slug
      report_type: report_type
      description: description

  - label: WorkflowNode
    model: toto.workflows.models.WorkflowNode
    uuid_field: id
    fields:
      node_type: node_type
      label: label
      task_name: task_name

  - label: WorkflowEdge
    model: toto.workflows.models.WorkflowEdge
    uuid_field: id
    fields:
      branch_key: branch_key
      is_default: is_default

  - label: WorkflowRun
    model: toto.workflows.models.WorkflowRun
    uuid_field: id
    fields:
      status: status
      started_at: started_at
      completed_at: completed_at
      created_at: created_at

  - label: WorkflowReport
    model: toto.workflows.models.Report
    uuid_field: slug
    fields:
      title: title
      slug: slug
      report_type: report_type
      status: status
      created_at: created_at

links:
  - from_label: WorkflowNode
    to_label: Workflow
    relation: NODE_OF
    source: workflow
    cardinality: one
    nullable: false

  - from_label: WorkflowNode
    to_label: LambdaFunction
    relation: RUNS_FUNCTION
    source: lambda_function
    cardinality: one
    nullable: true

  - from_label: WorkflowNode
    to_label: WorkflowReportTemplate
    relation: USES_TEMPLATE
    source: report_template
    cardinality: one
    nullable: true

  - from_label: WorkflowEdge
    to_label: Workflow
    relation: EDGE_OF
    source: workflow
    cardinality: one
    nullable: false

  - from_label: WorkflowEdge
    to_label: WorkflowNode
    relation: FROM_NODE
    source: source
    cardinality: one
    nullable: false

  - from_label: WorkflowEdge
    to_label: WorkflowNode
    relation: TO_NODE
    source: target
    cardinality: one
    nullable: false

  - from_label: WorkflowRun
    to_label: Workflow
    relation: RUN_OF
    source: workflow
    cardinality: one
    nullable: false

  - from_label: WorkflowReport
    to_label: WorkflowReportTemplate
    relation: GENERATED_FROM
    source: template
    cardinality: one
    nullable: true

  - from_label: WorkflowReport
    to_label: WorkflowRun
    relation: PRODUCED_BY
    source: workflow_run
    cardinality: one
    nullable: true

  - from_label: LambdaFunction
    to_label: ComputeKernel
    relation: BACKED_BY_KERNEL
    source: kernel
    cardinality: one
    nullable: true
