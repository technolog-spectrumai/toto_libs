app: ocr

nodes:
  - label: OcrProject
    model: toto.ocr.models.OcrProject
    uuid_field: slug
    fields:
      name: name
      slug: slug

  - label: OcrImage
    model: toto.ocr.models.OcrImage
    uuid_field: id
    fields:
      filename: filename
      mime_type: mime_type
      file_size: file_size
      language: language
      processed: processed
      processed_at: processed_at
      uploaded_at: uploaded_at

  - label: ImageTransform
    model: toto.ocr.models.ImageTransform
    uuid_field: id
    fields:
      name: name
      description: description
      created_at: created_at

links:
  - from_label: OcrProject
    to_label: Bucket
    relation: STORED_IN_BUCKET
    source: bucket
    cardinality: one
    nullable: false

  - from_label: OcrImage
    to_label: OcrProject
    relation: IMAGE_IN_PROJECT
    source: project
    cardinality: one
    nullable: false

  - from_label: OcrImage
    to_label: VaultFile
    relation: BACKED_BY_FILE
    source: vault_file
    cardinality: one
    nullable: true

  - from_label: ImageTransform
    to_label: LambdaFunction
    relation: USES_FUNCTION
    source: lambda_function
    cardinality: one
    nullable: false
