app: detections

nodes:
  - label: DetectionCategory
    model: toto.detections.models.DetectionCategory
    uuid_field: uid
    fields:
      name: name
      slug: slug
      description: description
      is_active: is_active

  - label: Detection
    model: toto.detections.models.Detection
    uuid_field: uid
    fields:
      title: title
      severity: severity
      detection_type: detection_type
      status: status
      start_time: start_time
      end_time: end_time

  - label: DetectionHandle
    model: toto.detections.models.DetectionHandle
    uuid_field: uid
    fields:
      status: status
      note: note

links:
  - from_label: DetectionCategory
    to_label: DetectionCategory
    relation: HAS_PARENT
    source: parent
    cardinality: one
    nullable: true

  - from_label: Detection
    to_label: DetectionCategory
    relation: IN_CATEGORY
    source: category
    cardinality: one
    nullable: true

  - from_label: Detection
    to_label: Address
    relation: DETECTED_AT_ADDRESS
    source: address
    cardinality: one
    nullable: true

  - from_label: Detection
    to_label: Zone
    relation: DETECTED_IN_ZONE
    source: zone
    cardinality: one
    nullable: true

  - from_label: Detection
    to_label: Route
    relation: DETECTED_ON_ROUTE
    source: route
    cardinality: one
    nullable: true

  - from_label: Detection
    to_label: Person
    relation: REPORTED_BY
    source: reported_by
    cardinality: one
    nullable: true

  - from_label: Detection
    to_label: Person
    relation: INVOLVES_PERSON
    source: involved_persons
    cardinality: many

  - from_label: Detection
    to_label: KanbanTask
    relation: MITIGATED_BY
    source: mitigation_task
    cardinality: one
    nullable: true

  - from_label: DetectionHandle
    to_label: Detection
    relation: HANDLES
    source: detection
    cardinality: one
    nullable: false

  - from_label: DetectionHandle
    to_label: Person
    relation: ASSIGNED_TO
    source: assigned_to
    cardinality: one
    nullable: true
