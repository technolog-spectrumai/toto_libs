app: gervazy

nodes:
  - label: UserStrongbox
    model: toto.gervazy.models.UserStrongbox
    uuid_field: id
    fields:
      name: name
      kdf: kdf
      created_at: created_at

  - label: VaultMasterKey
    model: toto.gervazy.models.VaultMasterKey
    uuid_field: id
    fields:
      algorithm: algorithm
      version: version
      state: state
      created_at: created_at

  - label: WrappedDataKey
    model: toto.gervazy.models.WrappedDataKey
    uuid_field: id
    fields:
      algorithm: algorithm
      version: version
      state: state
      created_at: created_at

  - label: EncryptedSecret
    model: toto.gervazy.models.EncryptedSecret
    uuid_field: id
    fields:
      name: name
      purpose: purpose
      algorithm: algorithm
      version: version
      state: state
      created_at: created_at

  - label: EncryptedFile
    model: toto.gervazy.models.EncryptedFile
    uuid_field: id
    fields:
      mime_type: mime_type
      algorithm: algorithm
      version: version
      state: state
      chunk_count: chunk_count
      plaintext_size: plaintext_size
      uploaded_at: uploaded_at

  - label: EncryptedPrivateKey
    model: toto.gervazy.models.EncryptedPrivateKey
    uuid_field: id
    fields:
      key_id: key_id
      key_type: key_type
      algorithm: algorithm
      state: state
      created_at: created_at

  - label: CryptoAuditLog
    model: toto.gervazy.models.CryptoAuditLog
    uuid_field: id
    fields:
      action: action
      object_type: object_type
      object_id: object_id
      success: success
      created_at: created_at

links:
  - from_label: VaultMasterKey
    to_label: UserStrongbox
    relation: BELONGS_TO_STRONGBOX
    source: strongbox
    cardinality: one
    nullable: false

  - from_label: WrappedDataKey
    to_label: UserStrongbox
    relation: BELONGS_TO_STRONGBOX
    source: strongbox
    cardinality: one
    nullable: false

  - from_label: WrappedDataKey
    to_label: VaultMasterKey
    relation: WRAPPED_BY
    source: vmk
    cardinality: one
    nullable: false

  - from_label: EncryptedSecret
    to_label: UserStrongbox
    relation: BELONGS_TO_STRONGBOX
    source: strongbox
    cardinality: one
    nullable: false

  - from_label: EncryptedSecret
    to_label: WrappedDataKey
    relation: ENCRYPTED_WITH
    source: wrapped_key
    cardinality: one
    nullable: false

  - from_label: EncryptedFile
    to_label: UserStrongbox
    relation: BELONGS_TO_STRONGBOX
    source: strongbox
    cardinality: one
    nullable: false

  - from_label: EncryptedFile
    to_label: WrappedDataKey
    relation: ENCRYPTED_WITH
    source: wrapped_key
    cardinality: one
    nullable: false

  - from_label: EncryptedPrivateKey
    to_label: UserStrongbox
    relation: BELONGS_TO_STRONGBOX
    source: strongbox
    cardinality: one
    nullable: false

  - from_label: EncryptedPrivateKey
    to_label: WrappedDataKey
    relation: ENCRYPTED_WITH
    source: wrapped_key
    cardinality: one
    nullable: false

  - from_label: CryptoAuditLog
    to_label: UserStrongbox
    relation: FOR_STRONGBOX
    source: strongbox
    cardinality: one
    nullable: true
