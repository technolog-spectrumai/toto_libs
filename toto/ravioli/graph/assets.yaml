app: assets

nodes:
  - label: Asset
    model: toto.assets.models.Asset
    uuid_field: id
    fields:
      name: name
      unit_name: unit_name
      decimals: decimals
      total_supply_base_units: total_supply_base_units
      active: active
      is_currency: is_currency
      minting_authority: minting_authority

  - label: LedgerAccount
    model: toto.assets.models.LedgerAccount
    uuid_field: code
    fields:
      code: code
      name: name
      account_type: account_type
      active: active

  - label: LedgerTransaction
    model: toto.assets.models.LedgerTransaction
    uuid_field: reference
    fields:
      reference: reference
      transaction_type: transaction_type
      description: description
      source_type: source_type
      source_id: source_id
      posted: posted

  - label: AssetHolding
    model: toto.assets.models.AssetHolding
    uuid_field: id
    fields:
      balance_base_units: balance_base_units

  - label: Currency
    model: toto.assets.models.Currency
    uuid_field: code
    fields:
      code: code
      name: name
      symbol: symbol
      is_active: is_active

  - label: Obligation
    model: toto.assets.models.Obligation
    uuid_field: reference
    fields:
      reference: reference
      order_reference: order_reference
      amount_base_units: amount_base_units
      due_at: due_at
      status: status

  - label: Tokenization
    model: toto.assets.models.Tokenization
    uuid_field: id
    fields:
      status: status
      default_reason: default_reason

links:
  - from_label: LedgerTransaction
    to_label: Asset
    relation: DENOMINATED_IN
    source: asset
    cardinality: one
    nullable: true

  - from_label: LedgerTransaction
    to_label: LedgerTransaction
    relation: REVERSES
    source: reversed_transaction
    cardinality: one
    nullable: true

  - from_label: AssetHolding
    to_label: Asset
    relation: HOLDS_ASSET
    source: asset
    cardinality: one
    nullable: false

  - from_label: AssetHolding
    to_label: LedgerAccount
    relation: HELD_IN_ACCOUNT
    source: account
    cardinality: one
    nullable: false

  - from_label: Currency
    to_label: Asset
    relation: PEGGED_TO
    source: asset
    cardinality: one
    nullable: true

  - from_label: Obligation
    to_label: LedgerAccount
    relation: OWED_BY
    source: debtor_account
    cardinality: one
    nullable: false

  - from_label: Obligation
    to_label: LedgerAccount
    relation: OWED_TO
    source: creditor_account
    cardinality: one
    nullable: false

  - from_label: Obligation
    to_label: Asset
    relation: DENOMINATED_IN
    source: asset
    cardinality: one
    nullable: false

  - from_label: Obligation
    to_label: LedgerAccount
    relation: COLLATERAL_HELD_IN
    source: collateral_account
    cardinality: one
    nullable: true

  - from_label: Obligation
    to_label: Asset
    relation: COLLATERAL_ASSET
    source: collateral_asset
    cardinality: one
    nullable: true

  - from_label: Tokenization
    to_label: Asset
    relation: TOKENIZED_AS
    source: asset
    cardinality: one
    nullable: false

  - from_label: Tokenization
    to_label: Person
    relation: SUPERVISED_BY
    source: supervisor
    cardinality: one
    nullable: true
