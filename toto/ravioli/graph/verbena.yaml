app: verbena

nodes:
  - label: Tag
    model: toto.verbena.models.Tag
    uuid_field: uid
    fields:
      name: name
      slug: slug

  - label: Page
    model: toto.verbena.models.Page
    uuid_field: uid
    fields:
      title: title
      slug: slug
      description: description
      created_at: created_at

  - label: Section
    model: toto.verbena.models.Section
    uuid_field: uid
    fields:
      title: title
      content: content
      order: order

links:
  - from_label: Page
    to_label: Tag
    relation: HAS_TAG
    source: tags
    cardinality: many

  - from_label: Section
    to_label: Page
    relation: BELONGS_TO_PAGE
    source: page
    cardinality: one
    nullable: false

  - from_label: Section
    to_label: Person
    relation: AUTHORED_BY
    source: author
    cardinality: one
    nullable: true

  - from_label: Section
    to_label: Tag
    relation: HAS_TAG
    source: tags
    cardinality: many
