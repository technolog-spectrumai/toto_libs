app: incidents

nodes:
  - label: Incident
    model: toto.incidents.models.Incident
    uuid_field: id
    fields:
      title: title
      severity: severity
      incident_type: incident_type
      status: status
      start_time: start_time
      end_time: end_time
      public: public

links:
  - from_label: Incident
    to_label: Address
    relation: LOCATED_AT
    source: address
    cardinality: one
    nullable: true

  - from_label: Incident
    to_label: Zone
    relation: WITHIN_ZONE
    source: zone
    cardinality: one
    nullable: true

  - from_label: Incident
    to_label: Person
    relation: REPORTED_BY
    source: reported_by
    cardinality: one
    nullable: true

  - from_label: Incident
    to_label: Detection
    relation: PROMOTED_FROM
    source: source_detection
    cardinality: one
    nullable: true
