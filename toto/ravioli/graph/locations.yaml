app: locations

nodes:
  - label: Address
    model: toto.locations.models.Address
    uuid_field: uid
    fields:
      country_name: country_name
      state_or_province_name: state_or_province_name
      locality_name: locality_name
      street: street
      building: building
      apartment: apartment
      geometry:
        source: geometry
        transform: wkt

  - label: Territory
    model: toto.locations.models.Territory
    uuid_field: uid
    fields:
      name: name
      geometry:
        source: geometry
        transform: wkt

  - label: Route
    model: toto.locations.models.Route
    uuid_field: uid
    fields:
      name: name
      sequence: sequence
      geometry:
        source: geometry
        transform: wkt

  - label: Zone
    model: toto.locations.models.Zone
    uuid_field: uid
    fields:
      name: name
      geometry:
        source: geometry
        transform: wkt

  - label: RouteChain
    model: toto.locations.models.RouteChain
    uuid_field: uid
    fields:
      name: name
      description: description

  - label: MapLayer
    model: toto.locations.models.MapLayer
    uuid_field: uid
    fields:
      name: name
      slug: slug
      description: description
      unit: unit
      min_value: min_value
      max_value: max_value
      style:
        source: style
        transform: json
      inverted_importance: inverted_importance
      half_range: half_range
      is_active: is_active

  - label: MapLayerPolygon
    model: toto.locations.models.MapLayerPolygon
    uuid_field: uid
    fields:
      name: name
      value: value
      properties:
        source: properties
        transform: json
      geometry:
        source: geometry
        transform: wkt
      center:
        source: center
        transform: wkt

links:
  - from_label: Territory
    to_label: Address
    relation: HAS_CAPITAL
    source: capital
    cardinality: one
    nullable: true

  - from_label: Zone
    to_label: Territory
    relation: IN_TERRITORY
    source: territory
    cardinality: one
    nullable: true

  - from_label: Route
    to_label: RouteChain
    relation: PART_OF_CHAIN
    source: route_chain
    cardinality: one
    nullable: true

  - from_label: Route
    to_label: Address
    relation: STARTS_AT
    source: start_address
    cardinality: one
    nullable: true

  - from_label: Route
    to_label: Address
    relation: ENDS_AT
    source: end_address
    cardinality: one
    nullable: true

  - from_label: MapLayer
    to_label: Person
    relation: OWNS_LAYER
    source: owner
    cardinality: one
    nullable: true

  - from_label: MapLayerPolygon
    to_label: MapLayer
    relation: IN_LAYER
    source: layer
    cardinality: one
    nullable: true
