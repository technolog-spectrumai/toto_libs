app: library

nodes:
  - label: LibraryBook
    model: toto.library.models.Book
    uuid_field: uid
    fields:
      title: title
      authors: authors
      year: year
      doi: doi
      abstract: abstract
      slug: slug
      publisher: publisher
      edition: edition
      isbn: isbn

  - label: LibraryArticle
    model: toto.library.models.Article
    uuid_field: uid
    fields:
      title: title
      authors: authors
      year: year
      doi: doi
      abstract: abstract
      slug: slug
      journal: journal
      volume: volume
      issue: issue
      pages: pages

  - label: LibraryAudio
    model: toto.library.models.AudioReference
    uuid_field: uid
    fields:
      title: title
      authors: authors
      year: year
      abstract: abstract
      slug: slug
      platform: platform
      duration: duration

  - label: LibraryVideo
    model: toto.library.models.VideoReference
    uuid_field: uid
    fields:
      title: title
      authors: authors
      year: year
      abstract: abstract
      slug: slug
      platform: platform
      director: director
      duration: duration

  - label: LibraryCollection
    model: toto.library.models.LibraryCollection
    uuid_field: slug
    fields:
      title: title
      slug: slug
      description: description

links:
  - from_label: LibraryBook
    to_label: PalimpsestTag
    relation: HAS_TAG
    source: tags
    cardinality: many

  - from_label: LibraryArticle
    to_label: PalimpsestTag
    relation: HAS_TAG
    source: tags
    cardinality: many

  - from_label: LibraryAudio
    to_label: PalimpsestTag
    relation: HAS_TAG
    source: tags
    cardinality: many

  - from_label: LibraryVideo
    to_label: PalimpsestTag
    relation: HAS_TAG
    source: tags
    cardinality: many

  - from_label: LibraryCollection
    to_label: LibraryBook
    relation: CONTAINS_BOOK
    source: books
    cardinality: many

  - from_label: LibraryCollection
    to_label: LibraryArticle
    relation: CONTAINS_ARTICLE
    source: articles
    cardinality: many

  - from_label: LibraryCollection
    to_label: LibraryAudio
    relation: CONTAINS_AUDIO
    source: audio
    cardinality: many

  - from_label: LibraryCollection
    to_label: LibraryVideo
    relation: CONTAINS_VIDEO
    source: videos
    cardinality: many
