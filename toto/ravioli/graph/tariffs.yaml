app: tariffs

nodes:
  - label: BillingUnit
    model: toto.tariffs.models.BillingUnit
    uuid_field: code
    fields:
      code: code
      label: label
      dimension: dimension
      app_label: app_label
      active: active

  - label: BillingMetric
    model: toto.tariffs.models.BillingMetric
    uuid_field: code
    fields:
      code: code
      label: label
      description: description
      dimension: dimension
      app_label: app_label
      active: active

  - label: Tariff
    model: toto.tariffs.models.Tariff
    uuid_field: uuid
    fields:
      name: name
      code: code
      status: status
      description: description
      source_type: source_type
      source_id: source_id

  - label: TariffItem
    model: toto.tariffs.models.TariffItem
    uuid_field: id
    fields:
      name: name
      price_per_unit_base_units: price_per_unit_base_units
      active: active

  - label: UsageRecord
    model: toto.tariffs.models.UsageRecord
    uuid_field: uuid
    fields:
      metric_code: metric_code
      quantity: quantity
      unit: unit
      status: status
      source_type: source_type
      source_id: source_id
      occurred_at: occurred_at

  - label: UsageCharge
    model: toto.tariffs.models.UsageCharge
    uuid_field: id
    fields:
      quantity: quantity
      amount_base_units: amount_base_units
      created_at: created_at

links:
  - from_label: BillingMetric
    to_label: BillingUnit
    relation: DEFAULT_UNIT
    source: default_unit
    cardinality: one
    nullable: true

  - from_label: TariffItem
    to_label: Tariff
    relation: ITEM_OF
    source: tariff
    cardinality: one
    nullable: false

  - from_label: TariffItem
    to_label: BillingMetric
    relation: CHARGES_METRIC
    source: metric
    cardinality: one
    nullable: false

  - from_label: TariffItem
    to_label: Asset
    relation: CHARGED_IN
    source: charged_asset
    cardinality: one
    nullable: false

  - from_label: TariffItem
    to_label: BillingUnit
    relation: MEASURED_IN
    source: unit
    cardinality: one
    nullable: true

  - from_label: TariffItem
    to_label: LedgerAccount
    relation: RECEIVES_INTO
    source: receiving_account
    cardinality: one
    nullable: false

  - from_label: UsageRecord
    to_label: Tariff
    relation: RATED_UNDER
    source: tariff
    cardinality: one
    nullable: false

  - from_label: UsageRecord
    to_label: LedgerAccount
    relation: PAYER_ACCOUNT
    source: payer_account
    cardinality: one
    nullable: false

  - from_label: UsageRecord
    to_label: LedgerTransaction
    relation: POSTED_AS
    source: ledger_transaction
    cardinality: one
    nullable: true

  - from_label: UsageCharge
    to_label: UsageRecord
    relation: CHARGE_OF
    source: usage_record
    cardinality: one
    nullable: false

  - from_label: UsageCharge
    to_label: TariffItem
    relation: APPLIED_ITEM
    source: tariff_item
    cardinality: one
    nullable: false

  - from_label: UsageCharge
    to_label: Asset
    relation: CHARGED_IN
    source: charged_asset
    cardinality: one
    nullable: false

  - from_label: UsageCharge
    to_label: LedgerAccount
    relation: PAYER_ACCOUNT
    source: payer_account
    cardinality: one
    nullable: false

  - from_label: UsageCharge
    to_label: LedgerAccount
    relation: RECEIVING_ACCOUNT
    source: receiving_account
    cardinality: one
    nullable: false
