app: mobilization

nodes:
  - label: IncidentType
    model: toto.mobilization.models.IncidentType
    uuid_field: slug
    fields:
      name: name
      slug: slug
      description: description

  - label: InterventionType
    model: toto.mobilization.models.InterventionType
    uuid_field: slug
    fields:
      name: name
      slug: slug
      description: description

  - label: AchievementBadge
    model: toto.mobilization.models.AchievementBadge
    uuid_field: slug
    fields:
      name: name
      slug: slug
      description: description
      category: category

  - label: Responder
    model: toto.mobilization.models.Responder
    uuid_field: id
    fields:
      is_active: is_active
      is_trained: is_trained
      is_background_checked: is_background_checked
      current_status: current_status

  - label: MobilizationReport
    model: toto.mobilization.models.MobilizationReport
    uuid_field: id
    fields:
      title: title
      status: status
      severity: severity
      summary: summary

  - label: MobilizationEvent
    model: toto.mobilization.models.MobilizationEvent
    uuid_field: id
    fields:
      title: title
      status: status
      description: description
      is_hybrid: is_hybrid

  - label: Deployment
    model: toto.mobilization.models.Deployment
    uuid_field: id
    fields:
      title: title
      deployment_type: deployment_type
      priority: priority
      status: status
      objective: objective
      is_hybrid: is_hybrid

  - label: DeploymentAssignment
    model: toto.mobilization.models.DeploymentAssignment
    uuid_field: id
    fields:
      role: role
      status: status

  - label: EvacuationRoute
    model: toto.mobilization.models.EvacuationRoute
    uuid_field: id
    fields:
      name: name
      route_type: route_type
      status: status
      notes: notes

  - label: Intervention
    model: toto.mobilization.models.Intervention
    uuid_field: id
    fields:
      title: title
      priority: priority
      status: status
      description: description
      is_required: is_required
      effect_description: effect_description

  - label: EmergencyStatus
    model: toto.mobilization.models.EmergencyStatus
    uuid_field: id
    fields:
      level: level
      status: status
      allows_asset_requisition: allows_asset_requisition
      allows_inventory_access: allows_inventory_access
      allows_route_commandeering: allows_route_commandeering

links:
  - from_label: Responder
    to_label: Person
    relation: PROFILE_OF
    source: person
    cardinality: one
    nullable: false

  - from_label: Responder
    to_label: Community
    relation: SERVES_COMMUNITY
    source: communities
    cardinality: many

  - from_label: MobilizationReport
    to_label: Community
    relation: REPORTED_IN
    source: community
    cardinality: one
    nullable: false

  - from_label: MobilizationReport
    to_label: IncidentType
    relation: OF_INCIDENT_TYPE
    source: incident_type
    cardinality: one
    nullable: true

  - from_label: MobilizationReport
    to_label: Person
    relation: SUBMITTED_BY
    source: submitted_by
