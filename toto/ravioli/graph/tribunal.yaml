    relation: RULING_FOR
    source: case
    cardinality: one
    nullable: false

  - from_label: TribunalRuling
    to_label: Person
    relation: DECIDED_BY
    source: decided_by
    cardinality: one
    nullable: true

  - from_label: TribunalRuling
    to_label: LedgerAccount
    relation: FINE_DEBTOR
    source: fine_debtor_account
    cardinality: one
    nullable: true

  - from_label: TribunalRuling
    to_label: LedgerAccount
