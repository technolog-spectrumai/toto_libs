app: bourse

nodes:
  - label: AssetExchangeRequest
    model: toto.bourse.models.AssetExchangeRequest
    uuid_field: id
    fields:
      exchange_rate: exchange_rate
      commission_percent: commission_percent
      status: status
      offer_amount_base_units: offer_amount_base_units
      request_amount_base_units: request_amount_base_units
      note: note

links:
  - from_label: AssetExchangeRequest
    to_label: LedgerAccount
    relation: OFFER_FROM_ACCOUNT
    source: requester_account
    cardinality: one
    nullable: false

  - from_label: AssetExchangeRequest
    to_label: LedgerAccount
    relation: RECEIVE_TO_ACCOUNT
    source: counterparty_account
    cardinality: one
    nullable: true

  - from_label: AssetExchangeRequest
    to_label: Asset
    relation: OFFERS_ASSET
    source: offer_asset
    cardinality: one
    nullable: false

  - from_label: AssetExchangeRequest
    to_label: Asset
    relation: REQUESTS_ASSET
    source: request_asset
    cardinality: one
    nullable: false
