app: weather

nodes:
  - label: WeatherObservation
    model: toto.weather.models.WeatherObservation
    uuid_field: id
    fields:
      provider: provider
      observed_at: observed_at
      temperature: temperature
      precipitation_mm: precipitation_mm
      precipitation_type: precipitation_type
      cloud_cover: cloud_cover
      wind_speed_kmh: wind_speed_kmh
      wind_direction_deg: wind_direction_deg
      visibility_km: visibility_km

  - label: ForecastSession
    model: toto.weather.models.ForecastSession
    uuid_field: id
    fields:
      provider: provider
      valid_from: valid_from
      valid_to: valid_to
      resolution_hours: resolution_hours

  - label: ForecastPoint
    model: toto.weather.models.ForecastPoint
    uuid_field: id
    fields:
      valid_at: valid_at
      temperature: temperature
      precipitation_mm: precipitation_mm
      precipitation_type: precipitation_type
      cloud_cover: cloud_cover
      wind_speed_kmh: wind_speed_kmh
      wind_direction_deg: wind_direction_deg
      visibility_km: visibility_km

links:
  - from_label: WeatherObservation
    to_label: Address
    relation: OBSERVED_AT
    source: address
    cardinality: one
    nullable: false

  - from_label: ForecastPoint
    to_label: ForecastSession
    relation: PART_OF_SESSION
    source: session
    cardinality: one
    nullable: false

  - from_label: ForecastPoint
    to_label: Address
    relation: FORECAST_FOR
    source: address
    cardinality: one
    nullable: false
