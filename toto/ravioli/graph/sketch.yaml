app: sketch

nodes:
  - label: SketchBoard
    model: toto.sketch.models.Board
    uuid_field: id
    fields:
      name: name
      created_at: created_at

  - label: BoardObject
    model: toto.sketch.models.BoardObject
    uuid_field: object_id
    fields:
      object_type: object_type
      created_at: created_at
      updated_at: updated_at
      is_deleted: is_deleted

links:
  - from_label: SketchBoard
    to_label: Bucket
    relation: STORED_IN_BUCKET
    source: bucket
    cardinality: one
    nullable: true

  - from_label: BoardObject
    to_label: SketchBoard
    relation: BELONGS_TO_BOARD
    source: board
    cardinality: one
    nullable: false
