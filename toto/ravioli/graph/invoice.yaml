app: invoice

nodes:
  - label: BillingCycle
    model: toto.invoice.models.BillingCycle
    uuid_field: id
    fields:
      name: name
      frequency: frequency
      active: active

  - label: Invoice
    model: toto.invoice.models.Invoice
    uuid_field: id
    fields:
      title: title
      amount: amount
      currency_label: currency_label
      status: status
      due_date: due_date
      paid_at: paid_at
      created_at: created_at

  - label: InvoiceReportTemplate
    model: toto.invoice.models.InvoiceReportTemplate
    uuid_field: code
    fields:
      name: name
      code: code
      format: format
      is_active: is_active

  - label: InvoiceReport
    model: toto.invoice.models.InvoiceReport
    uuid_field: id
    fields:
      generated_at: generated_at

  - label: PaymentSettlement
    model: toto.invoice.models.PaymentSettlement
    uuid_field: id
    fields:
      amount: amount
      currency_label: currency_label
      method: method
      reference: reference
      settled_at: settled_at

links:
  - from_label: Invoice
    to_label: BillingCycle
    relation: BILLED_UNDER_CYCLE
    source: billing_cycle
    cardinality: one
    nullable: true

  - from_label: Invoice
    to_label: Bucket
    relation: FOR_BUCKET
    source: bucket
    cardinality: one
    nullable: true

  - from_label: InvoiceReport
    to_label: Invoice
    relation: REPORT_OF
    source: invoice
    cardinality: one
    nullable: false

  - from_label: InvoiceReport
    to_label: InvoiceReportTemplate
    relation: USES_TEMPLATE
    source: template
    cardinality: one
    nullable: false

  - from_label: InvoiceReport
    to_label: VaultFile
    relation: STORED_AS
    source: vault_file
    cardinality: one
    nullable: true

  - from_label: PaymentSettlement
    to_label: Invoice
    relation: SETTLES
    source: invoice
    cardinality: one
    nullable: false
