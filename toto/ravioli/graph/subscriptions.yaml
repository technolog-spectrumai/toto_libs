app: subscriptions

nodes:
  - label: SubscriptionPlan
    model: toto.subscriptions.models.SubscriptionPlan
    uuid_field: uid
    fields:
      name: name
      slug: slug
      code: code
      kind: kind
      status: status
      description: description
      is_public: is_public

  - label: SubscriptionPrice
    model: toto.subscriptions.models.SubscriptionPrice
    uuid_field: uid
    fields:
      code: code
      amount_base_units: amount_base_units
      interval: interval
      interval_count: interval_count
      is_active: is_active

  - label: SubscriptionCustomer
    model: toto.subscriptions.models.SubscriptionCustomer
    uuid_field: uid
    fields:
      status: status
      label: label

  - label: Subscription
    model: toto.subscriptions.models.Subscription
    uuid_field: uid
    fields:
      status: status
      starts_at: starts_at
      current_period_start: current_period_start
      current_period_end: current_period_end
      cancel_at_period_end: cancel_at_period_end

  - label: SubscriptionInvoice
    model: toto.subscriptions.models.SubscriptionInvoice
    uuid_field: uid
    fields:
      status: status
      period_start: period_start
      period_end: period_end
      due_at: due_at
      total_base_units: total_base_units
      paid_base_units: paid_base_units

links:
  - from_label: SubscriptionPlan
    to_label: Community
    relation: OFFERED_BY
    source: community
    cardinality: one
    nullable: false

  - from_label: SubscriptionPlan
    to_label: Person
    relation: OWNED_BY
    source: owner
    cardinality: one
    nullable: true

  - from_label: SubscriptionPrice
    to_label: SubscriptionPlan
    relation: PRICE_FOR
    source: plan
    cardinality: one
    nullable: false

  - from_label: SubscriptionPrice
    to_label: Asset
    relation: DENOMINATED_IN
    source: asset
    cardinality: one
    nullable: false

  - from_label: SubscriptionPrice
    to_label: LedgerAccount
    relation: RECEIVES_INTO
    source: receiving_account
    cardinality: one
    nullable: false

  - from_label: SubscriptionCustomer
    to_label: Community
    relation: CUSTOMER_IN
    source: community
    cardinality: one
    nullable: false

  - from_label: SubscriptionCustomer
    to_label: Person
    relation: CUSTOMER_PERSON
    source: person
    cardinality: one
    nullable: false

  - from_label: SubscriptionCustomer
    to_label: LedgerAccount
    relation: BILLING_ACCOUNT
    source: billing_account
    cardinality: one
    nullable: false

  - from_label: Subscription
    to_label: SubscriptionCustomer
    relation: SUBSCRIBED_BY
    source: customer
    cardinality: one
    nullable: false

  - from_label: Subscription
    to_label: SubscriptionPlan
    relation: SUBSCRIBES_TO
    source: plan
    cardinality: one
    nullable: false

  - from_label: Subscription
    to_label: SubscriptionPrice
    relation: AT_PRICE
    source: price
    cardinality: one
    nullable: false

  - from_label: SubscriptionInvoice
    to_label: Subscription
    relation: INVOICE_FOR
    source: subscription
    cardinality: one
    nullable: false

  - from_label: SubscriptionInvoice
    to_label: SubscriptionCustomer
    relation: BILLED_TO
    source: customer
    cardinality: one
    nullable: false

  - from_label: SubscriptionInvoice
    to_label: LedgerTransaction
    relation: LEDGER_TRANSACTION
    source: ledger_transaction
    cardinality: one
    nullable: true
