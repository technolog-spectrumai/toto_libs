app: mandragora

nodes:
  - label: ComputeKernel
    model: toto.mandragora.models.ComputeKernel
    uuid_field: id
    fields:
      name: name
      timeout_ms: timeout_ms
      auto_close: auto_close
      created_at: created_at

  - label: KernelDependency
    model: toto.mandragora.models.KernelDependency
    uuid_field: id
    fields:
      package_name: package_name
      version_spec: version_spec
      install_status: install_status

  - label: Notebook
    model: toto.mandragora.models.Notebook
    uuid_field: slug
    fields:
      title: title
      slug: slug
      created_at: created_at

links:
  - from_label: KernelDependency
    to_label: ComputeKernel
    relation: DEPENDENCY_OF
    source: kernel
    cardinality: one
    nullable: false

  - from_label: Notebook
    to_label: ComputeKernel
    relation: RUNS_ON_KERNEL
    source: kernel
    cardinality: one
    nullable: true
