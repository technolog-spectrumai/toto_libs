app: instruments

nodes:
  - label: FinancialInstrument
    model: toto.instruments.models.FinancialInstrument
    uuid_field: reference
    fields:
      reference: reference
      instrument_type: instrument_type
      status: status
      starts_at: starts_at
      ends_at: ends_at

  - label: EscrowContract
    model: toto.instruments.models.EscrowContract
    uuid_field: id
    fields:
      amount_base_units: amount_base_units
      status: status
      order_reference: order_reference

  - label: ForwardContract
    model: toto.instruments.models.ForwardContract
    uuid_field: id
    fields:
      quantity_base_units: quantity_base_units
      payment_amount_base_units: payment_amount_base_units
      settlement_type: settlement_type
      settlement_at: settlement_at

  - label: FutureMarket
    model: toto.instruments.models.FutureMarket
    uuid_field: code
    fields:
      code: code
      name: name
      contract_size_base_units: contract_size_base_units
      settlement_type: settlement_type
      initial_margin_bps: initial_margin_bps
      maintenance_margin_bps: maintenance_margin_bps
      active: active

  - label: FutureContract
    model: toto.instruments.models.FutureContract
    uuid_field: id
    fields:
      contract_count: contract_count
      entry_price_base_units: entry_price_base_units
      settlement_at: settlement_at

  - label: RevenueShareContract
    model: toto.instruments.models.RevenueShareContract
    uuid_field: id
    fields:
      active_from: active_from
      active_until: active_until

  - label: VestingContract
    model: toto.instruments.models.VestingContract
    uuid_field: id
    fields:
      total_amount_base_units: total_amount_base_units
      released_amount_base_units: released_amount_base_units
      start_at: start_at
      cliff_at: cliff_at
      end_at: end_at
      release_frequency: release_frequency

  - label: StakingPosition
    model: toto.instruments.models.StakingPosition
    uuid_field: id
    fields:
      staked_amount_base_units: staked_amount_base_units
      reward_rate_bps: reward_rate_bps
      locked_until: locked_until

  - label: OptionContract
    model: toto.instruments.models.OptionContract
    uuid_field: id
    fields:
      option_type: option_type
      style: style
      quantity_base_units: quantity_base_units
      strike_price_base_units: strike_price_base_units
      premium_base_units: premium_base_units
      settlement_type: settlement_type
      expiry_at: expiry_at

links:
  - from_label: FinancialInstrument
    to_label: LedgerAccount
    relation: CONTRACT_ACCOUNT
    source: contract_account
    cardinality: one
    nullable: true

  - from_label: EscrowContract
    to_label: FinancialInstrument
    relation: INSTRUMENT
    source: instrument
    cardinality: one
    nullable: false

