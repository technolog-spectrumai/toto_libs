{% extends "oya/base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Boards | {{ platform.site_name }}{% endblock %}

{% block content %}
<script>
  window._sketchBoards = {{ boards_json|safe }};
  window._sketchBuckets = {{ buckets_json|safe }};
  window._sketchCreateUrl = "{% url 'sketch:board_create' %}";
  window._sketchBoardListUrl = "{% url 'sketch:board_list' %}";
  window._sketchCsrf = "{{ csrf_token }}";
</script>

<div
  x-data="sketchBoardList()"
  :class="darkMode ? 'bg-primary-bg-dark text-text-main-dark' : 'bg-primary-bg-light text-text-main-light'"
  class="min-h-screen px-4 py-8 transition-colors duration-300 sm:px-6 lg:px-8">

  <div class="mx-auto max-w-4xl space-y-6">

    <!-- Header -->
    <header class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
      <div class="space-y-2">
        <a href="{% url 'core:dashboard' %}" class="inline-flex items-center gap-2 text-sm underline hover:opacity-80">
          <i class="fa-solid fa-arrow-left"></i>
          {% trans "Dashboard" %}
        </a>
        <div>
          <p
            :class="darkMode ? 'text-accent-dark' : 'text-accent-light'"
            class="text-xs font-semibold uppercase tracking-wide">
            {% trans "Visual workspace" %}
          </p>
          <h1 class="mt-1 flex items-center gap-3 text-3xl font-bold">
            <i class="fa-solid fa-pen-ruler"></i>
            {% trans "Boards" %}
          </h1>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 items-center">
        <div
          :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
          class="flex items-center gap-2 rounded-lg border px-4 py-2 text-sm shadow-sm">
          <i class="fa-solid fa-table-cells-large opacity-60"></i>
          <span class="font-bold" x-text="boards.length"></span>
          <span class="opacity-65">{% trans "boards" %}</span>
        </div>

        <button
          @click="openCreate()"
          :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
          class="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow-sm hover:opacity-90 transition">
          <i class="fa-solid fa-plus"></i>
          {% trans "New Board" %}
        </button>
      </div>
    </header>

    <!-- Board List -->
    <template x-if="boards.length > 0">
      <ul class="space-y-3">
        <template x-for="board in boards" :key="board.id">
          <li
            :class="darkMode
              ? 'border-accent-1 bg-bubble-bg-dark hover:bg-primary-bg-dark'
              : 'border-accent-2 bg-bubble-bg-light hover:bg-primary-bg-light'"
            class="rounded-xl border p-4 shadow-sm transition-colors duration-200">

            <div class="flex items-start justify-between gap-4">
              <a :href="window._sketchBoardListUrl + board.id + '/'" class="group flex-1 min-w-0 flex items-center gap-4">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2">
                    <i
                      :class="darkMode ? 'text-accent-dark' : 'text-accent-light'"
                      class="fa-solid fa-vector-square text-sm"></i>
                    <span class="truncate font-semibold group-hover:underline underline-offset-2" x-text="board.name"></span>
                  </div>
                  <p class="mt-1 text-xs opacity-55">
                    <i class="fa-regular fa-calendar mr-1"></i>
                    {% trans "Created" %} <span x-text="board.created_at"></span>
                  </p>
                </div>
                <i class="fa-solid fa-chevron-right shrink-0 text-xs opacity-40 group-hover:opacity-80 transition-opacity"></i>
              </a>

              <button
                @click.prevent="deleteBoard(board.id, board.name)"
                :class="darkMode ? 'hover:text-red-400' : 'hover:text-red-600'"
                class="shrink-0 p-1 opacity-40 hover:opacity-100 transition-opacity"
                title="{% trans 'Delete board' %}">
                <i class="fa-solid fa-trash text-xs"></i>
              </button>
            </div>
          </li>
        </template>
      </ul>
    </template>

    <template x-if="boards.length === 0">
      <div
        :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
        class="rounded-xl border border-dashed p-12 text-center shadow-sm">
        <i class="fa-solid fa-pen-ruler text-3xl opacity-25"></i>
        <p class="mt-4 text-sm font-semibold opacity-60">{% trans "No boards yet." %}</p>
      </div>
    </template>

  </div>

  <!-- Create Board Modal -->
  <div
    x-show="showCreate"
    x-transition.opacity
    @keydown.escape.window="showCreate = false"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
    style="display:none">

    <div
      @click.outside="showCreate = false"
      :class="darkMode ? 'bg-bubble-bg-dark text-text-main-dark' : 'bg-bubble-bg-light text-text-main-light'"
      class="w-full max-w-md rounded-2xl shadow-2xl p-6 mx-4">

      <h2 class="text-lg font-bold mb-4">{% trans "New Board" %}</h2>

      <input
        x-model="newName"
        type="text"
        placeholder="{% trans 'Board name' %}"
        :class="darkMode ? 'bg-sunken-dark border-accent-1 text-text-main-dark placeholder-text-main-dark/40' : 'bg-sunken-light border-accent-2 text-text-main-light placeholder-text-main-light/40'"
        class="w-full rounded-lg border px-3 py-2 text-sm focus:outline-none mb-3"
        x-ref="nameInput">

      <select
        x-model="selectedBucket"
        :class="darkMode ? 'bg-sunken-dark border-accent-1 text-text-main-dark' : 'bg-sunken-light border-accent-2 text-text-main-light'"
        class="w-full rounded-lg border px-3 py-2 text-sm focus:outline-none mb-3">
        <option value="">{% trans "Select bucket…" %}</option>
        <template x-for="bucket in buckets" :key="bucket.id">
          <option :value="bucket.id" x-text="bucket.name"></option>
        </template>
      </select>

      <p x-show="createError" x-text="createError" class="text-red-500 text-xs mb-3"></p>

      <div class="flex justify-end gap-2">
        <button
          @click="showCreate = false"
          :class="darkMode ? 'bg-sunken-dark text-text-main-dark' : 'bg-sunken-light text-text-main-light'"
          class="px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-80 transition">
          {% trans "Cancel" %}
        </button>
        <button
          @click="createBoard()"
          :disabled="creating || !newName.trim() || !selectedBucket"
          :class="darkMode ? 'bg-accent-dark text-primary-bg-dark' : 'bg-accent-light text-primary-bg-light'"
          class="px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90 disabled:opacity-40 transition flex items-center gap-2">
          <i class="fa-solid" :class="creating ? 'fa-spinner fa-spin' : 'fa-plus'"></i>
          {% trans "Create" %}
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  function sketchBoardList() {
    return {
      boards: window._sketchBoards,
      buckets: window._sketchBuckets,
      showCreate: false,
      newName: '',
      selectedBucket: '',
      creating: false,
      createError: '',

      openCreate() {
        this.newName = '';
        this.selectedBucket = this.buckets.length === 1 ? this.buckets[0].id : '';
        this.createError = '';
        this.showCreate = true;
        this.$nextTick(() => this.$refs.nameInput && this.$refs.nameInput.focus());
      },

      async createBoard() {
        const name = this.newName.trim();
        if (!name || !this.selectedBucket) return;
        this.creating = true;
        this.createError = '';
        try {
          const res = await fetch(window._sketchCreateUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, bucket_id: this.selectedBucket}),
          });
          const data = await res.json();
          if (data.status === 'ok') {
            window.location.href = window._sketchBoardListUrl + data.board_id + '/';
          } else {
            this.createError = data.error || 'Error creating board';
          }
        } catch (e) {
          this.createError = e.message;
        }
        this.creating = false;
      },

      async deleteBoard(boardId, boardName) {
        if (!confirm('Delete board "' + boardName + '"?')) return;
        const res = await fetch(window._sketchBoardListUrl + boardId + '/delete/', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-CSRFToken': window._sketchCsrf},
          body: JSON.stringify({}),
        });
        const data = await res.json();
        if (data.status === 'ok') {
          this.boards = this.boards.filter(b => b.id !== boardId);
        }
      },
    };
  }
</script>
{% endblock %}
