{% load static %}
<script type="module">
import * as Y from "https://esm.run/yjs";
import mermaid from "{% static 'vendor/mermaid/mermaid.esm.min.mjs' %}";
mermaid.initialize({ startOnLoad: false });

  window.Y = Y;

  class Painter {
    constructor(ydoc, paperScope) {
        this.ydoc = ydoc;
        this.paper = paperScope;

        this.yShapes = ydoc.getMap("shapes");
        this.paperItems = new Map();
        this.undoManager = new Y.UndoManager(this.yShapes);
        this.observeYjs();
        this.converter = new window.SvgConverter(paperScope);
        this.boardId = "{{ board.id }}";
        this.mermaidConverter = new window.MermaidConverter();
        this.vegaLiteConverter = new window.VegaLiteConverter();
        this.formulaConverter = new window.FormulaConverter();
        this.helper = new window.DrawingHelper(this.paper);
        this.store = Alpine.store("sketch");
        this.groupHelper = new window.GroupHelper(this.paper, this.yShapes);
        this.orderHelper = new window.OrderHelper(this.ydoc, this.paper, this.yShapes);
        this.autosaveEnabled = false;
        this.autosaveInterval = null;
        this.autosaveDirty = false;

        this.ydoc.on("update", (update, origin) => {
            if (origin === "initial-load") return;
            this.autosaveDirty = true;
        });
    }

    undo() {
      this.undoManager.undo();
    }

    redo() {
        this.undoManager.redo();
    }

    createGroupFromChildren(childIds) {
        if (!childIds || childIds.length === 0) return null;

        const id = crypto.randomUUID();
        const result = this.groupHelper.createGroupFromChildren(id, childIds);
        if (!result) return null;

        const { group } = result;
        this.paperItems.set(id, group);
        this.store.selectedItems = [group];
        return group;
    }


    importSVG(svgString, options = {}) {
        let shapes = [];
        try {
            shapes = this.converter.import(svgString, options);
        } catch (err) {
            console.warn("SVG import rejected:", err);
            alert(err.message || "The SVG could not be imported.");
            return false;
        }

        return this.importShapes(shapes);
    }

    replaceWithSVG(svgString, options = {}) {
        let shapes = [];
        try {
            shapes = this.converter.import(svgString, options);
        } catch (err) {
            console.warn("SVG replacement rejected:", err);
            alert(err.message || "The SVG could not be imported.");
            return false;
        }

        this.clearCanvas();
        return this.importShapes(shapes);
    }

    importShapes(shapes) {
        const childIds = [];

        shapes.forEach(shape => {
            this.createShape(shape);
            childIds.push(shape.id);
        });

        if (childIds.length > 1) {
            this.createGroupFromChildren(childIds);
        }

        return true;
    }


    async importMermaid(code, placement = null) {
        try {
            const plainSvg = await this.mermaidConverter.render(code);
            const shapes = this.converter.import(plainSvg, {
                targetRect: this.resolveImportRect(placement)
            });

            const childIds = [];

            shapes.forEach(shape => {
                this.createShape(shape);
                childIds.push(shape.id);
            });

            if (childIds.length > 1) {
                this.createGroupFromChildren(childIds);
            }

            return true;

        } catch (err) {
            console.error("Mermaid import failed:", err);
            alert("Mermaid parsing error. Check your diagram syntax.");
            return false;
        }
    }

    async importChart(jsonConfig, placement = null) {
        try {
            const chartSvg = await this.vegaLiteConverter.render(jsonConfig);
            this.importSVG(chartSvg, {
                targetRect: this.resolveImportRect(placement)
            });
            return true;
        } catch (err) {
            console.error("Vega-Lite import failed:", err);
            alert("Vega-Lite JSON parsing or rendering error. Check your chart config.");
            return false;
        }
    }

    async importFormula(formula, placement = null) {
        try {
            const formulaSvg = await this.formulaConverter.render(formula);
            this.importSVG(formulaSvg, {
                targetRect: this.resolveImportRect(placement)
            });
            return true;
        } catch (err) {
            console.error("Formula import failed:", err);
            alert("Formula rendering error. Check your TeX input.");
            return false;
        }
    }

    resolveImportRect(placement) {
        if (!placement) return null;

        const clampPercent = value => Math.min(100, Math.max(0, Number(value)));
        const viewSize = this.paper.view.size;
        const width = clampPercent(placement.width) / 100 * viewSize.width;
        const height = clampPercent(placement.height) / 100 * viewSize.height;

        if (width <= 0 || height <= 0) return null;

        if (placement.x !== undefined || placement.y !== undefined) {
            const x = clampPercent(placement.x) / 100 * viewSize.width;
            const y = clampPercent(placement.y) / 100 * viewSize.height;

            return new this.paper.Rectangle(x, y, width, height);
        }

        const centerX = clampPercent(placement.centerX) / 100 * viewSize.width;
        const centerY = clampPercent(placement.centerY) / 100 * viewSize.height;

        return new this.paper.Rectangle(
            centerX - width / 2,
            centerY - height / 2,
            width,
            height
        );
    }

    exportToSVG(filename) {
        if (!filename.endsWith(".svg")) {
            filename += ".svg";
        }

        const svgString = this.converter.exportSVG({ asString: true });

        fetch(`/sketch/${this.boardId}/export-svg/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": window.csrfToken,
            },
            body: JSON.stringify({
                svg: svgString,
                filename: filename
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.file_url) {
                window.exportDownloadUrl = data.file_url;
                document.dispatchEvent(new CustomEvent("svg-exported", { detail: data }));
            }
        });
    }


    clearCanvas() {
        // Clear Yjs map (this triggers removal in all clients)
        this.yShapes.forEach((_, id) => {
            this.yShapes.delete(id);
        });

        // Optional: clear Paper.js project directly (safe because Yjs is already cleared)
        this.paper.project.clear();
    }

    observeYjs() {
        this.yShapes.observe(event => {
            event.changes.keys.forEach((change, id) => {
                if (change.action === "add" || change.action === "update") {
                    const shape = this.yShapes.get(id);
                    this.renderShape(shape);
                }
                if (change.action === "delete") {
                    this.removeShape(id);
                }
            });
        });
    }

    renderAll() {
        this.yShapes.forEach(shape => this.renderShape(shape));
        this.orderHelper.applyLayerOrder();
        this.paper.view.update();
    }

    exportObjects() {
        const objects = [];

        this.yShapes.forEach(shape => {
            if (!shape || !shape.id || !shape.type) return;
            objects.push({
                object_id: shape.id,
                object_type: shape.type,
                data: shape
            });
        });

        return objects;
    }

    save(options = {}) {
        const { clearDirty = true } = options;

        return fetch(`/sketch/${this.boardId}/save/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": window.csrfToken,
            },
            body: JSON.stringify({ objects: this.exportObjects() })
        })
        .then(res => res.json())
        .then(data => {
            if (clearDirty) {
                this.autosaveDirty = false;
            }
            document.dispatchEvent(new CustomEvent("sketch-saved", { detail: data }));
            return data;
        });
    }

    toggleAutosave() {
        if (this.autosaveEnabled) {
            this.disableAutosave();
        } else {
            this.enableAutosave();
        }
    }

    enableAutosave() {
        if (this.autosaveEnabled) return;

        this.autosaveEnabled = true;
        this.autosaveDirty = true;
        this.dispatchAutosaveStatus();
        this.runAutosave();

        this.autosaveInterval = setInterval(() => {
            this.runAutosave();
        }, 10000);
    }

    disableAutosave() {
        if (!this.autosaveEnabled && !this.autosaveInterval) return;

        this.autosaveEnabled = false;

        if (this.autosaveInterval) {
            clearInterval(this.autosaveInterval);
            this.autosaveInterval = null;
        }

        this.dispatchAutosaveStatus();
    }

    runAutosave() {
        if (!this.autosaveEnabled || !this.autosaveDirty) return;
        this.autosaveDirty = false;

        // Autosave is initiated here; websocket sync stays separate and does not persist the board.
        this.save({ clearDirty: false }).catch(() => {
            this.autosaveDirty = true;
        });
    }

    dispatchAutosaveStatus() {
        document.dispatchEvent(new CustomEvent("sketch-autosave-status", {
            detail: {
                enabled: this.autosaveEnabled
            }
        }));
    }

    sync() {
        if (window.boardSocket) {
            window.boardSocket.sync();
        }
    }

    toggleSync() {
        if (window.boardSocket) {
            window.boardSocket.toggle();
        }
    }

    createShape(shape) {
        // shape = { id, type, segments, strokeColor, ... }
        this.yShapes.set(shape.id, {
            ...shape,
            zIndex: shape.zIndex ?? this.orderHelper.nextZIndex()
        });
    }

    updateShape(id, props) {
        const shape = this.yShapes.get(id);
        if (!shape) return;

        const updated = { ...shape, ...props };
        this.yShapes.set(id, updated);
    }

    transformShape(id, transform) {
        const shape = this.yShapes.get(id);
        if (!shape) return;

        const updated = { ...shape, transform };
        this.yShapes.set(id, updated);
    }

    deleteShape(id) {
        this.yShapes.delete(id);
    }

    renderText(shape, item) {
        item = this.helper.drawText(shape, item);
        this.paperItems.set(shape.id, item);
        return item;
    }

    renderSegments(shape, item) {
        item = this.helper.drawPath(shape, item);
        this.paperItems.set(shape.id, item);
        return item;
    }

    renderCompoundPath(shape, item) {
        item = this.helper.drawCompoundPath(shape, item);
        this.paperItems.set(shape.id, item);
        return item;
    }

    saveTransformedGeometry(shape, item) {
        if (shape.type === "compoundPath") {
            const children = item.children.map(child => ({
                closed: child.closed ?? true,
                segments: child.segments.map(seg => ({
                    point: [seg.point.x, seg.point.y],
                    handleIn: [seg.handleIn.x, seg.handleIn.y],
                    handleOut: [seg.handleOut.x, seg.handleOut.y]
                }))
            }));

            this.yShapes.set(shape.id, {
                ...shape,
                children
            });
            return;
        }

        if (shape.type !== "path") return;

        const segments = item.segments.map(seg => ({
            point: [seg.point.x, seg.point.y],
            handleIn: [seg.handleIn.x, seg.handleIn.y],
            handleOut: [seg.handleOut.x, seg.handleOut.y]
        }));

        this.yShapes.set(shape.id, {
            ...shape,
            segments
        });
    }

    renderGroup(shape) {
        const group = this.helper.drawGroup(shape, this.paperItems);
        this.paperItems.set(shape.id, group);
        return group;
    }


    renderShape(shape) {
        // Already rendered?
        let item = this.paperItems.get(shape.id);

        // --- GROUP ---
        if (shape.type === "group") {
            const group = this.renderGroup(shape);
            this.orderHelper.applyLayerOrder();
            return group;
        }

        // --- TEXT ---
        if (shape.type === "text") {
            item = this.renderText(shape, item);
            this.orderHelper.applyLayerOrder();
            return item;
        }

        // --- PATH ---
        if (shape.type === "path") {
            item = this.renderSegments(shape, item);

            if (shape.transform) {
                this.applyTransform(item, shape.transform);
            }

            this.orderHelper.applyLayerOrder();
            return item;
        }

        // --- COMPOUND PATH ---
        if (shape.type === "compoundPath") {
            item = this.renderCompoundPath(shape, item);

            if (shape.transform) {
                this.applyTransform(item, shape.transform);
            }

            this.orderHelper.applyLayerOrder();
            return item;
        }
    }

    delete(id) {
      this.yShapes.delete(id);
    }

    transformShape(id, transform) {
        const shape = this.yShapes.get(id);
        if (!shape) return;

        const updated = { ...shape, transform };
        this.yShapes.set(id, updated);
    }

    static TRANSFORM_MAP = {
        move: MoveTool.apply,
        rotate: RotateTool.apply,
        scale: ScaleTool.apply
    };

    applyTransform(item, transform) {
        if (!transform) return;

        const fn = Painter.TRANSFORM_MAP[transform.type];
        if (!fn) return;

        fn(item, transform, this.paper);
    }

    removeShape(id) {
        const item = this.paperItems.get(id);

        if (item && typeof item.remove === "function") {
            item.remove();
        }

        this.paperItems.delete(id);
    }

    group(items) {
        const result = this.groupHelper.group(items);
        if (!result) return;

        const { id, group } = result;

        // Painter stores the Paper group
        this.paperItems.set(id, group);

        return group;
    }

    rerenderChildren(childIds) {
        childIds.forEach(cid => {
            const shape = this.yShapes.get(cid);
            if (!shape) return;

            const item = this.renderShape(shape);
            if (item) this.paperItems.set(cid, item);
        });
    }

    ungroup(groupItem) {
        const result = this.groupHelper.ungroup(groupItem);
        if (!result) return;

        const { id, childIds } = result;

        // Remove Paper group
        this.paperItems.delete(id);

        // Re-render children
        this.rerenderChildren(childIds);

        return childIds;
    }

    bringForward(item) {
        this.orderHelper.bringForward(item);
    }

    sendBackward(item) {
        this.orderHelper.sendBackward(item);
    }

    applyBooleanToSelected(operation) {
        const items = (this.store.selectedItems || [])
            .map(item => Painter.resolveItem(item))
            .filter(item => item && item._id && typeof item.clone === "function");

        if (items.length < 2) {
            alert("Select two paths before using a boolean operation.");
            return;
        }

        this.applyBooleanOperation(items[0], items[1], operation);
    }

    applyBooleanOperation(firstItem, secondItem, operation) {
        const methodByOperation = {
            and: "intersect",
            or: "unite",
            not: "subtract"
        };
        const method = methodByOperation[operation];

        if (!method || typeof firstItem[method] !== "function") {
            alert("Boolean operation is not available for these shapes.");
            return;
        }

        const firstClone = firstItem.clone({ insert: false });
        const secondClone = secondItem.clone({ insert: false });
        let result = null;

        try {
            result = firstClone[method](secondClone, { insert: false });
        } catch (err) {
            console.error("Boolean operation failed:", err);
        }

        firstClone.remove();
        secondClone.remove();

        if (!result || !result.bounds || result.bounds.width === 0 || result.bounds.height === 0) {
            alert("Boolean operation produced no visible result.");
            if (result) result.remove();
            return;
        }

        result.fillColor = firstItem.fillColor || this.store.fillColor || "#000";
        result.strokeColor = firstItem.strokeColor || null;
        result.strokeWidth = firstItem.strokeWidth || 1;
        result.opacity = firstItem.opacity ?? 1;

        const shapes = [];
        this.converter.walk(result, shapes);
        result.remove();

        if (shapes.length === 0) {
            alert("Boolean operation produced no editable shape.");
            return;
        }

        [firstItem, secondItem].forEach(item => {
            this.yShapes.delete(item._id);
            item.remove();
            this.paperItems.delete(item._id);
        });

        shapes.forEach(shape => this.createShape(shape));
        this.store.selectedItems = [];
    }

    applyBrushToItems(items) {
        if (!items || items.length === 0) return;

        items.forEach(item => {
            const id = item._id;
            const shape = this.yShapes.get(id);
            if (!shape) return;

            const updated = {
                ...shape,
                strokeColor: this.store.brushColor,
                strokeWidth: this.store.brushSize,
                brushOpacity: this.store.brushOpacity,
                fillOpacity: this.store.fillOpacity,
                fillColor: this.store.fillMode === "color"
                    ? this.store.fillColor
                    : shape.fillColor
            };

            this.yShapes.set(id, updated);
        });
    }

    applyBrushToSelected() {
        this.applyBrushToItems(this.store.selectedItems);
    }

    static resolveItem(item) {
        while (item && !item._id) {
            item = item.parent;
        }
        return item || null;
    }

    // Unified hitTest that always returns a resolved Paper.js item
    findItem(point) {
        const hit = this.paper.project.hitTest(point, {
            fill: true,
            stroke: true,
            segments: true,
            tolerance: 6
        });

        if (!hit || !hit.item) return null;

        return Painter.resolveItem(hit.item);
    }


}

window.YPainter = Painter;

</script>
