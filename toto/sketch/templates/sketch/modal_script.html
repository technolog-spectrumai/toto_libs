{% load static %}
{% load i18n %}
<script>
class ImportModalHelper {
    constructor() {
        this.showImportModal = false;
        this.importType = "svg";
        this.importInput = "";
        this.importRectX = 35;
        this.importRectY = 42;
        this.importRectW = 30;
        this.importRectH = 16;
        this.showExportModal = false;
        this.exportFileName = "drawing.svg";
        this.boardBucketName = "{{ bucketName|escapejs }}";
        this.exportDownloadUrl = null;
        this.exportingSvg = false;

        this.importConfigs = {
            svg: {
                title: "Import SVG",
                buttonLabel: "Import SVG",
                icon: "fa-solid fa-file-import",
                heightClass: "h-48",
                placeholder: "<svg>...</svg>"
            },
            mermaid: {
                title: "Import Mermaid Graph",
                buttonLabel: "Import Graph",
                icon: "fa-solid fa-diagram-project",
                heightClass: "h-48",
                placeholder: `graph TD
A[Start] --> B{Decision}
B -->|Yes| C[Do thing]
B -->|No| D[Stop]`
            },
            chart: {
                title: "Import Vega-Lite Chart",
                buttonLabel: "Import Chart",
                icon: "fa-solid fa-chart-simple",
                heightClass: "h-64",
                placeholder: `{
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
  "width": 320,
  "height": 200,
  "data": {
    "values": [
      { "category": "A", "value": 28 },
      { "category": "B", "value": 55 },
      { "category": "C", "value": 43 }
    ]
  },
  "mark": "bar",
  "encoding": {
    "x": { "field": "category", "type": "nominal" },
    "y": { "field": "value", "type": "quantitative" }
  }
}`
            },
            formula: {
                title: "Import Formula",
                buttonLabel: "Import Formula",
                icon: "fa-solid fa-square-root-variable",
                heightClass: "h-40",
                placeholder: "\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}"
            }
        };
    }

    initModals() {
        document.addEventListener("svg-exported", e => {
            this.exportingSvg = false;
            this.exportDownloadUrl = e.detail.file_url;
            this.showExportModal = true;
        });
    }

    get importConfig() {
        return this.importConfigs[this.importType];
    }

    get importPlacement() {
        return {
            x: this.importRectX,
            y: this.importRectY,
            width: this.importRectW,
            height: this.importRectH
        };
    }

    openImportModal(type) {
        this.importType = type;
        this.importInput = "";
        this.showImportModal = true;
    }

    openExportModal() {
        this.exportDownloadUrl = null;
        this.exportingSvg = false;
        this.showExportModal = true;
    }

    get hasBucket() {
        return !!this.boardBucketName;
    }

    submitExport() {
        this.exportDownloadUrl = null;
        this.exportingSvg = true;

        if (!this.hasBucket) {
            this._exportToBrowser();
            return;
        }
        painter.exportToSVG(this.exportFileName);
    }

    _exportToBrowser() {
        let filename = this.exportFileName;
        if (!filename.endsWith(".svg")) filename += ".svg";

        const svgString = painter.converter.exportSVG({ asString: true });
        const blob = new Blob([svgString], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);

        this.exportingSvg = false;
        this.showExportModal = false;
    }

    async submitImport() {
        if (!this.importInput.trim()) return;

        const placement = this.importPlacement;
        let imported = false;

        if (this.importType === "svg") {
            painter.importSVG(this.importInput, {
                targetRect: painter.resolveImportRect(placement)
            });
            imported = true;
        } else if (this.importType === "mermaid") {
            imported = await painter.importMermaid(this.importInput, placement);
        } else if (this.importType === "chart") {
            imported = await painter.importChart(this.importInput, placement);
        } else if (this.importType === "formula") {
            imported = await painter.importFormula(this.importInput, placement);
        }

        if (!imported) return;
        this.importInput = "";
        this.showImportModal = false;
    }
}

window.ImportModalHelper = ImportModalHelper;

class TextModalHelper {
    constructor() {
        this.showTextModal = false;
        this.textInput = "";
        this.textFontSize = 16;
        this.textFontFamily = "Arial";
        this.textFontOptions = [
            { label: "Arial", value: "Arial" },
            { label: "Times New Roman", value: "Times New Roman" },
            { label: "Orbitron", value: "Orbitron" }
        ];
        this.textX = 50;
        this.textY = 50;
        this.textBold = false;
        this.textItalic = false;
        this.textColor = "#000000";
        this.textOpacity = 1;
    }

    initTextModal() {
        window.textModalHelper = this;
    }

    openTextModal(point, defaults = {}) {
        const viewSize = paper.view.size;

        this.textInput = "";
        this.textX = this.pointToPercent(point.x, viewSize.width);
        this.textY = this.pointToPercent(point.y, viewSize.height);
        this.textFontSize = Number(defaults.fontSize) || 16;
        this.textFontFamily = defaults.fontFamily || "Arial";
        this.textBold = Boolean(defaults.bold);
        this.textItalic = Boolean(defaults.italic);
        this.textColor = defaults.fillColor || "#000000";
        this.textOpacity = defaults.opacity ?? 1;
        this.showTextModal = true;
    }

    closeTextModal() {
        this.showTextModal = false;
    }

    submitText() {
        if (!this.textInput.trim()) return;

        const viewSize = paper.view.size;

        painter.createShape({
            id: crypto.randomUUID(),
            type: "text",
            point: {
                x: this.percentToPoint(this.textX, viewSize.width),
                y: this.percentToPoint(this.textY, viewSize.height)
            },
            content: this.textInput,
            fillColor: this.textColor,
            fontSize: this.textFontSize,
            fontFamily: this.textFontFamily,
            fontWeight: this.textBold ? "bold" : "normal",
            fontStyle: this.textItalic ? "italic" : "normal",
            opacity: this.textOpacity
        });

        this.textInput = "";
        this.showTextModal = false;
    }

    pointToPercent(value, max) {
        if (!max) return 0;
        return Math.round(this.clampPercent(value / max * 100));
    }

    percentToPoint(value, max) {
        return this.clampPercent(value) / 100 * max;
    }

    clampPercent(value) {
        return Math.min(100, Math.max(0, Number(value) || 0));
    }
}

window.TextModalHelper = TextModalHelper;

class IconModalHelper {
    constructor() {
        this.showIconModal = false;
        this.iconName = "star";
        this.iconX = 50;
        this.iconY = 50;
        this.iconSizeX = 12;
        this.iconSizeY = 12;
        this.iconColor = "#000000";
        this.iconOpacity = 1;
    }

    initIconModal() {
        window.iconModalHelper = this;
    }

    get normalizedIconName() {
        const tokens = this.iconName
            .trim()
            .split(/\s+/)
            .filter(Boolean);
        const iconToken = tokens.find(token => {
            return token.startsWith("fa-")
                && !["fa-solid", "fa-regular", "fa-brands"].includes(token);
        });
        const rawName = iconToken || tokens[0] || "";

        return rawName
            .replace(/^fa-/, "")
            .replace(/\s+/g, "-")
            .toLowerCase();
    }

    get iconClass() {
        return `fa-solid fa-${this.normalizedIconName || "star"}`;
    }

    openIconModal(point, defaults = {}) {
        const viewSize = paper.view.size;

        this.iconX = this.pointToPercent(point.x, viewSize.width);
        this.iconY = this.pointToPercent(point.y, viewSize.height);
        this.iconColor = defaults.fillColor || "#000000";
        this.iconOpacity = defaults.opacity ?? 1;
        this.showIconModal = true;
    }

    closeIconModal() {
        this.showIconModal = false;
    }

    async submitIcon() {
        if (this.clampPercent(this.iconSizeX) <= 0 || this.clampPercent(this.iconSizeY) <= 0) {
            alert("Icon size must be greater than 0.");
            return;
        }

        const svg = await this.buildIconSvg();
        if (!svg) {
            alert("Font Awesome icon not found. Check the icon name.");
            return;
        }

        painter.importSVG(svg, {
            targetRect: painter.resolveImportRect({
                x: this.iconX,
                y: this.iconY,
                width: this.iconSizeX,
                height: this.iconSizeY
            })
        });

        this.showIconModal = false;
    }

    async buildIconSvg() {
        try {
            const spriteDoc = await this.getIconSpriteDoc();
            if (!spriteDoc) return null;

            return this.prepareIconSvg(spriteDoc);
        } catch (err) {
            console.error("Font Awesome icon SVG import failed:", err);
            return null;
        }
    }

    get iconSpriteUrl() {
        return "{% static 'vendor/fontawesome/6.7.2/sprites/solid.svg' %}";
    }

    async getIconSpriteDoc() {
        if (IconModalHelper.spriteDoc) return IconModalHelper.spriteDoc;

        const response = await fetch(this.iconSpriteUrl);
        if (!response.ok) return null;

        const spriteText = await response.text();
        const doc = new DOMParser().parseFromString(spriteText, "image/svg+xml");
        if (doc.querySelector("parsererror")) return null;

        IconModalHelper.spriteDoc = doc;
        return doc;
    }

    prepareIconSvg(spriteDoc) {
        const symbol = spriteDoc.getElementById(this.normalizedIconName || "star");
        if (!symbol) return null;

        const opacityValue = Number(this.iconOpacity);
        const opacity = Number.isFinite(opacityValue)
            ? Math.min(1, Math.max(0, opacityValue))
            : 1;

        return `
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="${this.escapeXml(symbol.getAttribute("viewBox") || "0 0 512 512")}"
     fill="${this.escapeXml(this.iconColor)}"
     opacity="${opacity}">
  ${this.prepareSymbolContent(symbol)}
</svg>`;
    }

    prepareSymbolContent(symbol) {
        return Array.from(symbol.children).map(child => {
            const clone = child.cloneNode(true);

            if (!clone.getAttribute("fill-rule")) {
                clone.setAttribute("fill-rule", "evenodd");
            }
            if (!clone.getAttribute("clip-rule")) {
                clone.setAttribute("clip-rule", clone.getAttribute("fill-rule"));
            }
            clone.setAttribute("fill", this.iconColor);

            return new XMLSerializer().serializeToString(clone);
        }).join("");
    }

    pointToPercent(value, max) {
        if (!max) return 0;
        return Math.round(this.clampPercent(value / max * 100));
    }

    clampPercent(value) {
        return Math.min(100, Math.max(0, Number(value) || 0));
    }

    escapeXml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }
}

IconModalHelper.spriteDoc = null;
window.IconModalHelper = IconModalHelper;

class TransformModalHelper {
    constructor() {
        this.showTransformModal = false;
        this.transformItem = null;
        this.transformX = 0;
        this.transformY = 0;
        this.transformW = 10;
        this.transformH = 10;
    }

    initTransformModal() {
        window.transformModalHelper = this;
    }

    openTransformModal(item) {
        if (!item || !item.bounds) return;

        const viewSize = paper.view.size;
        const bounds = item.bounds;

        this.transformItem = item;
        this.transformX = this.pointToPercent(bounds.center.x, viewSize.width);
        this.transformY = this.pointToPercent(bounds.center.y, viewSize.height);
        this.transformW = this.pointToPercent(bounds.width, viewSize.width);
        this.transformH = this.pointToPercent(bounds.height, viewSize.height);
        this.showTransformModal = true;
    }

    closeTransformModal() {
        this.showTransformModal = false;
    }

    submitTransform() {
        if (!this.transformItem || !this.transformItem._id) return;

        const shape = painter.yShapes.get(this.transformItem._id);
        if (!shape) return;

        const rect = this.resolveRect();
        if (!rect) {
            alert("Width and height must be greater than 0.");
            return;
        }

        if (shape.type === "path" || shape.type === "compoundPath") {
            this.applyPathTransform(shape, rect);
        } else if (shape.type === "text") {
            this.applyTextTransform(shape, rect);
        } else {
            alert("Universal transform currently supports paths and text.");
            return;
        }

        this.transformItem.selected = false;
        this.transformItem = null;
        this.showTransformModal = false;
    }

    applyPathTransform(shape, rect) {
        const item = this.transformItem;
        const bounds = item.bounds;
        if (!bounds || bounds.width === 0 || bounds.height === 0) return;

        item.scale(rect.width / bounds.width, rect.height / bounds.height, bounds.center);
        item.position = rect.center;

        painter.saveTransformedGeometry(shape, item);
    }

    applyTextTransform(shape, rect) {
        painter.yShapes.set(shape.id, {
            ...shape,
            point: { x: rect.center.x, y: rect.center.y },
            fontSize: rect.height
        });
    }

    resolveRect() {
        const viewSize = paper.view.size;
        const width = this.percentToPoint(this.transformW, viewSize.width);
        const height = this.percentToPoint(this.transformH, viewSize.height);

        if (width <= 0 || height <= 0) return null;

        return new paper.Rectangle(
            this.percentToPoint(this.transformX, viewSize.width) - width / 2,
            this.percentToPoint(this.transformY, viewSize.height) - height / 2,
            width,
            height
        );
    }

    pointToPercent(value, max) {
        if (!max) return 0;
        return Math.round(this.clampPercent(value / max * 100));
    }

    percentToPoint(value, max) {
        return this.clampPercent(value) / 100 * max;
    }

    clampPercent(value) {
        return Math.min(100, Math.max(0, Number(value) || 0));
    }
}

window.TransformModalHelper = TransformModalHelper;
</script>
