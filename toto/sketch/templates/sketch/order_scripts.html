{% load i18n %}
<script>
class OrderHelper {
    constructor(ydoc, paper, yShapes) {
        this.ydoc = ydoc;
        this.paper = paper;
        this.yShapes = yShapes;
    }

    bringForward(item) {
        item = OrderHelper.resolveItem(item);
        if (!item || !item.parent) return;

        const siblings = this.orderedSiblings(item.parent);
        const index = siblings.indexOf(item);
        if (index === -1 || index === siblings.length - 1) return;

        this.swapLayerOrder(item, siblings[index + 1]);
    }

    sendBackward(item) {
        item = OrderHelper.resolveItem(item);
        if (!item || !item.parent) return;

        const siblings = this.orderedSiblings(item.parent);
        const index = siblings.indexOf(item);
        if (index <= 0) return;

        this.swapLayerOrder(item, siblings[index - 1]);
    }

    orderedSiblings(parent) {
        return parent.children.filter(child => child._id && this.yShapes.has(child._id));
    }

    nextZIndex() {
        let max = -1;

        this.yShapes.forEach(shape => {
            if (typeof shape.zIndex === "number") {
                max = Math.max(max, shape.zIndex);
            }
        });

        return max + 1;
    }

    ensureLayerOrder(parent) {
        let changed = false;

        parent.children.forEach((child, index) => {
            if (!child._id) return;

            const shape = this.yShapes.get(child._id);
            if (!shape || typeof shape.zIndex === "number") return;

            this.yShapes.set(child._id, {
                ...shape,
                zIndex: index
            });
            changed = true;
        });

        return changed;
    }

    swapLayerOrder(a, b) {
        this.ensureLayerOrder(a.parent);

        const aShape = this.yShapes.get(a._id);
        const bShape = this.yShapes.get(b._id);
        if (!aShape || !bShape) return;

        this.ydoc.transact(() => {
            this.yShapes.set(a._id, {
                ...aShape,
                zIndex: bShape.zIndex
            });
            this.yShapes.set(b._id, {
                ...bShape,
                zIndex: aShape.zIndex
            });
        });

        this.applyLayerOrder();
    }

    applyLayerOrder() {
        const layer = this.paper.project.activeLayer;
        const ordered = layer.children
            .filter(item => item._id && this.yShapes.has(item._id))
            .sort((a, b) => {
                const aShape = this.yShapes.get(a._id);
                const bShape = this.yShapes.get(b._id);
                const aIndex = typeof aShape?.zIndex === "number" ? aShape.zIndex : layer.children.indexOf(a);
                const bIndex = typeof bShape?.zIndex === "number" ? bShape.zIndex : layer.children.indexOf(b);
                return aIndex - bIndex;
            });

        ordered.forEach(item => layer.addChild(item));
    }

    static resolveItem(item) {
        while (item && !item._id) {
            item = item.parent;
        }
        return item || null;
    }
}

window.OrderHelper = OrderHelper;
</script>
