<div class="space-y-3"
     x-data="Object.assign(new ImportModalHelper(), {
        syncEnabled: true,
        syncConnected: false,
        autosaveEnabled: false,
        refreshSyncStatus() {
          if (!window.boardSocket) return;
          this.syncEnabled = window.boardSocket.enabled;
          this.syncConnected = window.boardSocket.isOpen;
        },
        refreshAutosaveStatus() {
          if (!window.painter) return;
          this.autosaveEnabled = window.painter.autosaveEnabled;
        }
    })"
    x-init="
      initModals();
      document.addEventListener('sketch-sync-status', e => {
        syncEnabled = e.detail.enabled;
        syncConnected = e.detail.connected;
      });
      document.addEventListener('sketch-autosave-status', e => {
        autosaveEnabled = e.detail.enabled;
      });
      setTimeout(() => refreshSyncStatus(), 100);
      setTimeout(() => refreshAutosaveStatus(), 100);
    "
>
  <!-- Sync -->
  <button
    @click="painter.toggleSync(); refreshSyncStatus()"
    :class="[
      syncEnabled
        ? (darkMode
            ? 'bg-success-dark text-primary-bg-dark border-success-dark font-bold hover:opacity-90'
            : 'bg-success-light text-primary-bg-light border-success-light font-bold hover:opacity-90')
        : (darkMode
            ? 'bg-sunken-dark text-text-main-dark border-accent-1 shadow-inner opacity-70'
            : 'bg-sunken-light text-text-main-light border-accent-2 shadow-inner opacity-70'),
      'border'
    ]"
    class="w-full flex items-center gap-2 px-3 py-2 rounded text-sm transition"
  >
    <i :class="syncEnabled ? 'fa-solid fa-arrows-rotate' : 'fa-solid fa-link-slash'"></i>
    <span x-text="syncEnabled ? (syncConnected ? 'Auto Sync On' : 'Sync Connecting') : 'Sync Off'"></span>
  </button>

  <!-- Autosave -->
  <button
    @click="painter.toggleAutosave(); refreshAutosaveStatus()"
    :class="[
      autosaveEnabled
        ? (darkMode
            ? 'bg-success-dark text-primary-bg-dark border-success-dark font-bold hover:opacity-90'
            : 'bg-success-light text-primary-bg-light border-success-light font-bold hover:opacity-90')
        : (darkMode
            ? 'bg-sunken-dark text-text-main-dark border-accent-1 shadow-inner opacity-70'
            : 'bg-sunken-light text-text-main-light border-accent-2 shadow-inner opacity-70'),
      'border'
    ]"
    class="w-full flex items-center gap-2 px-3 py-2 rounded text-sm transition"
  >
    <i :class="autosaveEnabled ? 'fa-solid fa-cloud-arrow-up' : 'fa-regular fa-circle-down'"></i>
    <span x-text="autosaveEnabled ? 'Auto Save On' : 'Auto Save Off'"></span>
  </button>

  <!-- Save -->
  <button
    @click="painter.save()"
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border'
    ]"
    class="w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold"
  >
    <i class="fa-solid fa-floppy-disk"></i>
    <span>Save</span>
  </button>

  <button
    @click="painter.clearCanvas()"
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold'
    ]"
  >
    <i class="fa-solid fa-trash"></i>
    <span>Clear</span>
  </button>

  <!-- Undo -->
  <button
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border'
    ]"
    class="w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold"
     @click="painter.undo()"
  >
    <i class="fa-solid fa-arrow-rotate-left"></i>
    <span>Undo</span>
  </button>

  <!-- Redo -->
  <button
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border'
    ]"
    class="w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold"
    @click="painter.redo()"
  >
    <i class="fa-solid fa-arrow-rotate-right"></i>
    <span>Redo</span>
  </button>

  <button
    @click="openExportModal()"
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold'
    ]"
  >
    <i class="fa-solid fa-file-export"></i>
    <span>Export SVG</span>
  </button>

  <!-- Import SVG -->
  <button
    @click="openImportModal('svg')"
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold'
    ]"
  >
    <i class="fa-solid fa-file-import"></i>
    <span>Import SVG</span>
  </button>
  <button
    @click="openImportModal('mermaid')"
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold'
    ]"
  >
    <i class="fa-solid fa-diagram-project"></i>
    <span>Import Graph</span>
  </button>
  <button
    @click="openImportModal('chart')"
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold'
    ]"
  >
    <i class="fa-solid fa-chart-simple"></i>
    <span>Import Chart</span>
  </button>
  <button
    @click="openImportModal('formula')"
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border w-full flex items-center gap-2 px-3 py-2 rounded shadow-sm text-sm font-semibold'
    ]"
  >
    <i class="fa-solid fa-square-root-variable"></i>
    <span>Import Formula</span>
  </button>


<!-- Import Modal -->
<div
  x-show="showImportModal"
  x-transition.opacity
  class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div
    x-show="showImportModal"
    x-transition.scale
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border rounded-lg shadow-xl w-full max-w-lg p-5 space-y-4'
    ]"
  >
    <h2 class="text-lg font-semibold flex items-center gap-2">
      <i :class="importConfig.icon"></i>
      <span x-text="importConfig.title"></span>
    </h2>

    <textarea
      x-model="importInput"
      :placeholder="importConfig.placeholder"
      :class="[
        darkMode
          ? 'bg-bubble-bg-dark border-accent-1 text-white'
          : 'bg-white border-gray-300 text-gray-900',
        importConfig.heightClass,
        'w-full p-3 rounded border text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500'
      ]"
    ></textarea>

    <div class="grid grid-cols-2 gap-3">
      <label class="space-y-1 text-xs font-semibold">
        <span>X %</span>
        <input
          x-model.number="importRectX"
          type="number"
          min="0"
          max="100"
          step="1"
          :class="[
            darkMode
              ? 'bg-bubble-bg-dark border-accent-1 text-white'
              : 'bg-white border-gray-300 text-gray-900',
            'w-full p-2 rounded border text-sm focus:outline-none focus:ring-2 focus:ring-blue-500'
          ]"
        />
      </label>

      <label class="space-y-1 text-xs font-semibold">
        <span>Y %</span>
        <input
          x-model.number="importRectY"
          type="number"
          min="0"
          max="100"
          step="1"
          :class="[
            darkMode
              ? 'bg-bubble-bg-dark border-accent-1 text-white'
              : 'bg-white border-gray-300 text-gray-900',
            'w-full p-2 rounded border text-sm focus:outline-none focus:ring-2 focus:ring-blue-500'
          ]"
        />
      </label>

      <label class="space-y-1 text-xs font-semibold">
        <span>W %</span>
        <input
          x-model.number="importRectW"
          type="number"
          min="0"
          max="100"
          step="1"
          :class="[
            darkMode
              ? 'bg-bubble-bg-dark border-accent-1 text-white'
              : 'bg-white border-gray-300 text-gray-900',
            'w-full p-2 rounded border text-sm focus:outline-none focus:ring-2 focus:ring-blue-500'
          ]"
        />
      </label>

      <label class="space-y-1 text-xs font-semibold">
        <span>H %</span>
        <input
          x-model.number="importRectH"
          type="number"
          min="0"
          max="100"
          step="1"
          :class="[
            darkMode
              ? 'bg-bubble-bg-dark border-accent-1 text-white'
              : 'bg-white border-gray-300 text-gray-900',
            'w-full p-2 rounded border text-sm focus:outline-none focus:ring-2 focus:ring-blue-500'
          ]"
        />
      </label>
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <button
        @click="showImportModal = false"
        :class="[
          darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
          'border px-4 py-2 rounded shadow-sm text-sm font-semibold'
        ]"
      >
        Cancel
      </button>

      <button
        @click="submitImport()"
        class="bg-blue-600 text-white px-4 py-2 rounded shadow-sm text-sm font-semibold hover:bg-blue-700"
      >
        <span x-text="importConfig.buttonLabel"></span>
      </button>
    </div>
  </div>
</div>


<!-- Export SVG Modal -->
<div
  x-show="showExportModal"
  x-transition.opacity
  class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div
    x-show="showExportModal"
    x-transition.scale
    :class="[
      darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
      'border rounded-lg shadow-xl w-full max-w-lg p-5 space-y-4'
    ]"
  >
    <h2 class="text-lg font-semibold flex items-center gap-2">
      <i class="fa-solid fa-file-export"></i>
      Export Board to SVG
    </h2>

    <template x-if="hasBucket">
      <p class="text-sm opacity-80">
        This board is assigned to bucket:
        <strong x-text="boardBucketName"></strong>
      </p>
    </template>
    <template x-if="!hasBucket">
      <p class="text-sm opacity-60 italic">
        <i class="fa-solid fa-triangle-exclamation mr-1 text-yellow-500"></i>
        No bucket connected — the file will be downloaded directly to your browser.
      </p>
    </template>

    <label class="text-sm font-semibold">File Name</label>
    <input
      x-model="exportFileName"
      type="text"
      :class="[
        darkMode
          ? 'bg-bubble-bg-dark border-accent-1 text-white'
          : 'bg-bubble-bg-light border-accent-2 text-gray-900',
        'w-full p-2 rounded border text-sm focus:outline-none focus:ring-2'
      ]"
      placeholder="my-drawing.svg"
    />
    <template x-if="exportingSvg">
      <div class="p-3 rounded bg-blue-100 text-blue-800 text-sm">
        Exporting SVG...
      </div>
    </template>

    <!-- Download link after export -->
    <template x-if="exportDownloadUrl">
      <div class="p-3 rounded bg-green-100 text-green-800 text-sm">
        <p class="font-semibold">Export complete!</p>
        <a
          :href="exportDownloadUrl"
          target="_blank"
          class="underline text-blue-600 hover:text-blue-800"
        >
          Download SVG
        </a>
      </div>
    </template>

    <div class="flex justify-end gap-3 pt-2">
      <button
        @click="showExportModal = false"
        :class="[
          darkMode ? 'bg-bubble-bg-dark border-accent-1' : 'bg-bubble-bg-light border-accent-2',
          'border px-4 py-2 rounded shadow-sm text-sm font-semibold'
        ]"
      >
        Cancel
      </button>

      <button
        @click="submitExport()"
        class="bg-blue-600 text-white px-4 py-2 rounded shadow-sm text-sm font-semibold hover:bg-blue-700"
      >
        <span x-text="hasBucket ? 'Export to Bucket' : 'Download SVG'"></span>
      </button>
    </div>
  </div>
</div>

</div>
