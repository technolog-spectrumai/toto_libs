{% load static %}
<script src="{% static 'vendor/vega/vega.min.js' %}"></script>
<script src="{% static 'vendor/vega-lite/vega-lite.min.js' %}"></script>
<script>
class VegaLiteConverter {
    constructor() {}

    async render(input) {
        const spec = typeof input === "string" ? JSON.parse(input) : input;
        const compiled = vegaLite.compile(spec).spec;
        const runtime = vega.parse(compiled);
        const view = new vega.View(runtime, { renderer: "none" }).initialize();

        await view.runAsync();
        return view.toSVG();
    }
}

window.VegaLiteConverter = VegaLiteConverter;
</script>
