{% load i18n %}
<script>
  class SvgConverter {
    constructor(paperScope) {
        this.paper = paperScope;
    }

    import(svgString, options = {}) {
        if (!svgString.trim()) return [];

        const parsed = new DOMParser().parseFromString(svgString, "image/svg+xml");
        const parserError = parsed.querySelector("parsererror");
        const svgRoot = parsed.documentElement;
        if (parserError || !svgRoot || svgRoot.localName.toLowerCase() !== "svg") {
            throw new Error("Steven output is not valid SVG.");
        }

        const imported = this.paper.project.importSVG(svgString, {
            expandShapes: true,
            insert: false
        });

        if (!imported) {
            throw new Error("The SVG could not be imported into the sketch canvas.");
        }

        if (options.targetRect) {
            this.fitItemToRect(imported, options.targetRect);
        }

        const items = imported instanceof this.paper.Item
            ? [imported]
            : imported.children || [];

        const shapes = [];
        items.forEach(item => this.walk(item, shapes));
        imported.remove();
        if (!shapes.length) {
            throw new Error("The SVG did not contain editable sketch objects.");
        }
        return shapes;
    }

    fitItemToRect(item, rect) {
        if (!item || !rect) return;

        const bounds = item.bounds;
        if (!bounds || bounds.width === 0 || bounds.height === 0) return;

        item.scale(rect.width / bounds.width, rect.height / bounds.height, bounds.center);
        item.position = rect.center;
    }

    walk(item, shapes) {
        if (item instanceof this.paper.CompoundPath) {
            const shape = this.convertCompoundPath(item);
            if (shape) shapes.push(shape);
            return;
        }

        if (item instanceof this.paper.Path) {
            const shape = this.convertPath(item);
            if (shape) shapes.push(shape);
        }

        if (item instanceof this.paper.PointText) {
            const shape = this.convertText(item);
            if (shape) shapes.push(shape);
        }

        if (item.children) {
            item.children.forEach(child => this.walk(child, shapes));
        }
    }

    convertCompoundPath(item) {
        if (!item.children || item.children.length === 0) return null;

        const id = crypto.randomUUID();
        const children = [];

        item.children.forEach(child => {
            if (!(child instanceof this.paper.Path) || !child.segments || child.segments.length === 0) return;

            children.push({
                closed: child.closed ?? true,
                segments: child.segments.map(seg => ({
                    point: [seg.point.x, seg.point.y],
                    handleIn: [seg.handleIn.x, seg.handleIn.y],
                    handleOut: [seg.handleOut.x, seg.handleOut.y]
                }))
            });
        });

        if (children.length === 0) return null;

        return {
            id,
            type: "compoundPath",
            children,
            strokeColor: item.strokeColor ? item.strokeColor.toCSS(true) : null,
            strokeWidth: item.strokeWidth || 1,
            fillColor: item.fillColor ? item.fillColor.toCSS(true) : "#000",
            fillRule: item.fillRule || "evenodd",
            opacity: item.opacity ?? 1,
            transform: null
        };
    }

    convertPath(item) {
        if (!item.segments || item.segments.length === 0) return null;

        const id = crypto.randomUUID();

        const segments = item.segments.map(seg => ({
            point: [seg.point.x, seg.point.y],
            handleIn: [seg.handleIn.x, seg.handleIn.y],
            handleOut: [seg.handleOut.x, seg.handleOut.y]
        }));

        return {
            id,
            type: "path",
            segments,
            strokeColor: item.strokeColor ? item.strokeColor.toCSS(true) : "#000",
            strokeWidth: item.strokeWidth || 1,
            fillColor: item.fillColor ? item.fillColor.toCSS(true) : null,
            fillRule: item.fillRule || "nonzero",
            opacity: item.opacity ?? 1,
            closed: item.closed ?? false,
            transform: null
        };
    }

    convertText(item) {
        if (!item.content) return null;

        const id = crypto.randomUUID();

        return {
            id,
            type: "text",
            point: { x: item.point.x, y: item.point.y },
            content: item.content,
            fillColor: item.fillColor ? item.fillColor.toCSS(true) : "#000",
            fontSize: item.fontSize || 16,
            fontFamily: item.fontFamily || "Arial",
            fontWeight: item.fontWeight || "normal",
            fontStyle: item.fontStyle || "normal",
            opacity: item.opacity ?? 1
        };
    }

    exportSVG(options = {}) {
        const {
            asString = true,   // return string by default
            scale = 1,         // optional scaling
            bounds = null      // optional clipping region
        } = options;

        // Export SVG DOM node
        const svgNode = this.paper.project.exportSVG({
            asString: false,
            bounds: bounds || this.paper.project.activeLayer.bounds,
            matrix: new this.paper.Matrix().scale(scale)
        });

        // Convert DOM → string
        const svgString = new XMLSerializer().serializeToString(svgNode);

        return asString ? svgString : svgNode;
    }
}

window.SvgConverter = SvgConverter;

</script>
