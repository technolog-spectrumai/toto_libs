{% load i18n %}
{% if actions %}
<div x-data="{ active: null }"
     :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
     class="rounded-lg border p-4 shadow-sm space-y-3">

  <h3 class="text-xs font-semibold uppercase tracking-wide opacity-60">{% trans "Actions" %}</h3>

  <div class="flex flex-wrap gap-2">
    {% for act in actions %}
    <button type="button"
      @click="active = (active === '{{ act.action }}') ? null : '{{ act.action }}'"
      :class="darkMode
        ? (active === '{{ act.action }}'
            ? '{% if act.color == 'red' %}ring-1 ring-caution-dark/40 bg-caution-dark/20 text-caution-dark{% elif act.color == 'yellow' %}ring-1 ring-warn-dark/40 bg-warn-dark/20 text-warn-dark{% elif act.color == 'green' %}ring-1 ring-success-dark/40 bg-success-dark/20 text-success-dark{% elif act.color == 'blue' %}ring-1 ring-accent-dark/40 bg-accent-dark/20 text-accent-dark{% else %}ring-1 ring-accent-1 bg-bubble-bg-dark opacity-80{% endif %}'
            : '{% if act.color == 'red' %}bg-caution-dark/10 text-caution-dark hover:bg-caution-dark/20{% elif act.color == 'yellow' %}bg-warn-dark/10 text-warn-dark hover:bg-warn-dark/20{% elif act.color == 'green' %}bg-success-dark/10 text-success-dark hover:bg-success-dark/20{% elif act.color == 'blue' %}bg-accent-dark/10 text-accent-dark hover:bg-accent-dark/20{% else %}bg-bubble-bg-dark border border-accent-1 text-text-main-dark hover:opacity-80{% endif %}')
        : (active === '{{ act.action }}'
            ? '{% if act.color == 'red' %}ring-1 ring-caution-light/40 bg-caution-light/20 text-caution-light{% elif act.color == 'yellow' %}ring-1 ring-warn-light/40 bg-warn-light/20 text-warn-light{% elif act.color == 'green' %}ring-1 ring-success-light/40 bg-success-light/20 text-success-light{% elif act.color == 'blue' %}ring-1 ring-accent-light/40 bg-accent-light/20 text-accent-light{% else %}ring-1 ring-accent-2 bg-bubble-bg-light opacity-80{% endif %}'
            : '{% if act.color == 'red' %}bg-caution-light/10 text-caution-light hover:bg-caution-light/20{% elif act.color == 'yellow' %}bg-warn-light/10 text-warn-light hover:bg-warn-light/20{% elif act.color == 'green' %}bg-success-light/10 text-success-light hover:bg-success-light/20{% elif act.color == 'blue' %}bg-accent-light/10 text-accent-light hover:bg-accent-light/20{% else %}bg-bubble-bg-light border border-accent-2 text-text-main-light hover:opacity-80{% endif %}')"
      class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition">
      <i class="{{ act.icon }}"></i>
      {{ act.label }}
    </button>
    {% endfor %}
  </div>

  {% for act in actions %}
  <div x-show="active === '{{ act.action }}'" x-cloak x-transition
       :class="darkMode ? 'border-accent-1 bg-sunken-dark' : 'border-accent-2 bg-sunken-light'"
       class="rounded-lg border p-4 space-y-3">

    {% if act.confirm %}
    <p class="text-sm font-semibold">{{ act.confirm }}</p>
    {% endif %}

    <form method="post" action="{{ transition_url }}" class="space-y-3">
      {% csrf_token %}
      <input type="hidden" name="action" value="{{ act.action }}">

      {% if act.needs_reason %}
      <div class="space-y-1">
        <label class="block text-xs font-semibold opacity-60">{% trans "Reason" %} <span class="font-normal opacity-50">({% trans "optional" %})</span></label>
        <textarea name="reason" rows="2"
          :class="darkMode ? 'bg-bubble-bg-dark border-accent-1 text-text-main-dark' : 'bg-bubble-bg-light border-accent-2 text-text-main-light'"
          class="w-full rounded border px-3 py-2 text-sm focus:outline-none focus:ring-1 resize-none"
          placeholder="{% trans 'Enter a reason…' %}"></textarea>
      </div>
      {% endif %}

      <div class="flex gap-2">
        <button type="submit"
          :class="darkMode
            ? '{% if act.color == 'red' %}bg-caution-dark text-primary-bg-dark hover:opacity-90{% elif act.color == 'yellow' %}bg-warn-dark text-primary-bg-dark hover:opacity-90{% elif act.color == 'green' %}bg-success-dark text-primary-bg-dark hover:opacity-90{% elif act.color == 'blue' %}bg-accent-dark text-primary-bg-dark hover:opacity-90{% else %}bg-bubble-bg-dark border border-accent-1 text-text-main-dark hover:opacity-80{% endif %}'
            : '{% if act.color == 'red' %}bg-caution-light text-primary-bg-light hover:opacity-90{% elif act.color == 'yellow' %}bg-warn-light text-primary-bg-light hover:opacity-90{% elif act.color == 'green' %}bg-success-light text-primary-bg-light hover:opacity-90{% elif act.color == 'blue' %}bg-accent-light text-primary-bg-light hover:opacity-90{% else %}bg-bubble-bg-light border border-accent-2 text-text-main-light hover:opacity-80{% endif %}'"
          class="inline-flex items-center gap-1.5 rounded-lg px-4 py-1.5 text-xs font-semibold transition">
          <i class="{{ act.icon }}"></i>
          {% trans "Confirm" %}: {{ act.label }}
        </button>
        <button type="button" @click="active = null"
          class="inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-semibold opacity-60 hover:opacity-100 transition">
          {% trans "Cancel" %}
        </button>
      </div>
    </form>
  </div>
  {% endfor %}

</div>
{% endif %}
