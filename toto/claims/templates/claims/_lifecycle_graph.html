{% load static %}
{% load i18n %}
{# Context vars expected: graph_model (str), graph_id (str/uuid/int) #}

{{ theme.theme.colors|json_script:"oya-theme-colors" }}

<div :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
     class="rounded-lg border shadow-sm overflow-hidden">

  <div class="flex items-center justify-between px-4 py-3 border-b"
       :class="darkMode ? 'border-accent-1' : 'border-accent-2'">
    <h3 class="flex items-center gap-2 font-semibold text-sm uppercase tracking-wide opacity-60">
      <i class="fa-solid fa-diagram-project"></i>
      {% trans "Lifecycle Graph" %}
    </h3>
    <div class="flex items-center gap-2">
      <button type="button" id="cy-fit-btn"
        :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
        class="rounded border px-2 py-1 text-xs font-semibold transition hover:opacity-80">
        <i class="fa-solid fa-expand"></i> {% trans "Fit" %}
      </button>
      <button type="button" id="cy-reload-btn"
        :class="darkMode ? 'border-accent-1 bg-bubble-bg-dark' : 'border-accent-2 bg-bubble-bg-light'"
        class="rounded border px-2 py-1 text-xs font-semibold transition hover:opacity-80">
        <i class="fa-solid fa-arrows-rotate"></i> {% trans "Reload" %}
      </button>
    </div>
  </div>

  <div id="cy-lifecycle"
    :class="darkMode ? 'bg-sunken-dark' : 'bg-sunken-light'"
    class="h-[460px] w-full transition-opacity duration-200">
  </div>

  <div id="cy-node-info"
    class="hidden px-4 py-3 border-t text-sm"
    :class="darkMode ? 'border-accent-1' : 'border-accent-2'">
    <div class="flex items-start justify-between gap-2">
      <div class="space-y-1">
        <div class="font-semibold" id="cy-node-label"></div>
        <div class="flex flex-wrap gap-3 text-xs opacity-60">
          <span id="cy-node-type"></span>
          <span id="cy-node-status"></span>
        </div>
      </div>
      <a id="cy-node-link" href="#" target="_blank"
        class="shrink-0 text-xs font-semibold underline hover:opacity-80 hidden"
        :class="darkMode ? 'text-accent-dark' : 'text-accent-light'">
        {% trans "Open" %} <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
      </a>
    </div>
  </div>

</div>

<script>
(function () {
  const GRAPH_MODEL = "{{ graph_model }}";
  const GRAPH_ID    = "{{ graph_id }}";
  const FETCH_URL   = "{% url 'claims:lifecycle_graph_json' %}?model=" + GRAPH_MODEL + "&id=" + GRAPH_ID;

  const colorData = document.getElementById("oya-theme-colors");
  const COLORS = colorData ? JSON.parse(colorData.textContent) : {};

  function isDark() {
    try { return Alpine.evaluate(document.documentElement, "darkMode"); } catch (_) {}
    return document.documentElement.classList.contains("dark");
  }

  function themeColor(token) {
    const suffix = isDark() ? "dark" : "light";
    return COLORS[token + "-" + suffix] || COLORS[token] || "#888";
  }

  const KIND_SHAPE = {
    entitlement:        "ellipse",
    obligation:         "diamond",
    schedule:           "barrel",
    condition:          "round-tag",
    allocation:         "hexagon",
    event:              "tag",
    contract_event:     "tag",
    ledger_transaction: "cut-rectangle",
    ledger_account:     "round-rectangle",
    asset:              "pentagon",
    agreement:          "round-rectangle",
    contract:           "rectangle",
    financial_instrument: "round-rectangle",
    account:            "round-rectangle",
  };

  function kindColor(kind) {
    const map = {
      entitlement:        "accent",
      obligation:         "warn",
      schedule:           "accent",
      condition:          "caution",
      allocation:         "success",
      event:              "accent",
      contract_event:     "accent",
      ledger_transaction: "success",
      ledger_account:     null,
      account:            null,
      asset:              "success",
      agreement:          "accent",
      contract:           "accent",
      financial_instrument: "accent",
    };
    const token = map[kind];
    if (!token) return themeColor("text-main");
    return themeColor(token);
  }

  let cy = null;

  function buildStyles(dark) {
    const bg     = themeColor("primary-bg");
    const bubble = themeColor("bubble-bg");
    const text   = themeColor("text-main");
    const accent = themeColor("accent");
    return [
      {
        selector: "node",
        style: {
          "background-color": bubble,
          "border-color": "data(nodeColor)",
          "border-width": 2,
          "label": "data(label)",
          "color": text,
          "font-size": 10,
          "font-weight": "bold",
          "text-valign": "center",
          "text-halign": "center",
          "text-wrap": "wrap",
          "text-max-width": 100,
          "width": 110,
          "height": 44,
          "shape": "data(shape)",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": accent,
          "background-color": accent,
          "color": bg,
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": themeColor("accent"),
          "target-arrow-color": themeColor("accent"),
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "label": "data(label)",
          "font-size": 9,
          "color": text,
          "text-background-color": bubble,
          "text-background-opacity": 0.85,
          "text-background-padding": "2px",
          "text-rotation": "autorotate",
          "text-margin-y": -6,
          "opacity": 0.8,
        },
      },
      {
        selector: "edge:selected",
        style: { "width": 2.5, "line-color": accent, "target-arrow-color": accent, "opacity": 1 },
      },
    ];
  }

  function renderGraph(data) {
    const container = document.getElementById("cy-lifecycle");
    if (!container) return;

    const dark   = isDark();
    const bubble = themeColor("bubble-bg");

    const elements = [];
    (data.nodes || []).forEach(n => {
      const kind = n.data.kind || "other";
      elements.push({
        data: {
          id: n.data.id,
          label: n.data.label,
          kind,
          url: n.data.url || "",
          status: n.data.status || "",
          nodeColor: kindColor(kind),
          shape: KIND_SHAPE[kind] || "ellipse",
        },
      });
    });
    (data.edges || []).forEach(e => {
      elements.push({ data: { ...e.data } });
    });

    if (cy) { cy.destroy(); cy = null; }

    container.style.backgroundColor = themeColor("primary-bg");

    cy = cytoscape({
      container,
      elements,
      style: buildStyles(dark),
      layout: {
        name: "breadthfirst",
        directed: true,
        spacingFactor: 1.5,
        padding: 24,
        animate: true,
        animationDuration: 350,
      },
      wheelSensitivity: 0.2,
      minZoom: 0.1,
      maxZoom: 4,
    });

    const infoPanel = document.getElementById("cy-node-info");
    const labelEl   = document.getElementById("cy-node-label");
    const typeEl    = document.getElementById("cy-node-type");
    const statusEl  = document.getElementById("cy-node-status");
    const linkEl    = document.getElementById("cy-node-link");

    cy.on("tap", "node", evt => {
      const d = evt.target.data();
      if (infoPanel) {
        labelEl.textContent  = d.label  || "";
        typeEl.textContent   = d.kind   || "";
        statusEl.textContent = d.status ? "· " + d.status : "";
        if (d.url && linkEl) { linkEl.href = d.url; linkEl.classList.remove("hidden"); }
        else if (linkEl)      { linkEl.classList.add("hidden"); }
        infoPanel.classList.remove("hidden");
      }
    });
    cy.on("tap", evt => {
      if (evt.target === cy && infoPanel) infoPanel.classList.add("hidden");
    });

    new ResizeObserver(() => { if (cy) { cy.resize(); cy.fit(); } }).observe(container);
  }

  async function loadGraph() {
    const container = document.getElementById("cy-lifecycle");
    if (!container) return;
    container.style.opacity = "0.4";
    try {
      const res  = await fetch(FETCH_URL);
      const data = await res.json();
      renderGraph(data);
    } catch (err) {
      container.innerHTML = '<p class="p-4 text-sm opacity-50">{% trans "Graph unavailable." %}</p>';
    } finally {
      container.style.opacity = "1";
    }
  }

  function loadCytoscape(cb) {
    if (window.cytoscape) { cb(); return; }
    const s = document.createElement("script");
    s.src = "{% static 'vendor/cytoscape/cytoscape.min.js' %}";
    s.onload = cb;
    document.head.appendChild(s);
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadCytoscape(loadGraph);

    const fitBtn    = document.getElementById("cy-fit-btn");
    const reloadBtn = document.getElementById("cy-reload-btn");
    if (fitBtn)    fitBtn.addEventListener("click",    () => cy && cy.fit());
    if (reloadBtn) reloadBtn.addEventListener("click", () => loadGraph());

    const toggle = document.querySelector(".site-theme-toggle-button");
    if (toggle) toggle.addEventListener("click", () => setTimeout(() => cy && loadGraph(), 60));
  });
})();
</script>
