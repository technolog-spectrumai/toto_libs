<div
  x-data="spinGallery()"
  x-init="init()"
  class="relative w-full overflow-hidden"
  :class="darkMode
    ? 'bg-bubble-bg-dark border-accent-dark'
    : 'bg-bubble-bg-light border-accent-light'"
>

  <!-- Scrollable track -->
  <div
    x-ref="track"
    class="flex space-x-4 overflow-x-auto snap-x snap-mandatory scrollbar-hide py-4 px-1"
  >
    {% for img in images %}
      <div class="snap-center shrink-0 w-64 h-64 relative rounded-lg overflow-hidden shadow">
        <img
          src="{{ img.url }}"
          alt="{{ img.caption|default:'Image' }}"
          class="w-full h-full object-cover"
        >
        {% if img.caption %}
          <div class="absolute bottom-0 left-0 right-0 bg-black/40 text-white text-xs p-1 text-center">
            {{ img.caption }}
          </div>
        {% endif %}
      </div>
    {% endfor %}
  </div>

</div>

<script>
function spinGallery() {
  return {
    interval: null,

    init() {
      // Auto-spin every 3 seconds
      this.interval = setInterval(() => {
        const track = this.$refs.track
        track.scrollBy({ left: 280, behavior: 'smooth' })

        // Loop back to start
        if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
          track.scrollTo({ left: 0, behavior: 'smooth' })
        }
      }, 3000)
    }
  }
}
</script>
