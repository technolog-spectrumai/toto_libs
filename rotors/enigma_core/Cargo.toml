[package]
name = "enigma-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tls_codec = "0.4"
zeroize = { version = "1", features = ["derive"] }

openmls = { version = "=0.7.4", features = ["js"] }
openmls_rust_crypto = { version = "=0.4.4", features = ["test-utils"] }
openmls_basic_credential = "=0.4.1"
openmls_traits = "=0.4.1"