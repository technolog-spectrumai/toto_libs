[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toto"
dynamic = ["version"]
description = "Community operating system - reusable Django app library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Runtime dependencies are intentionally minimal: hosts install the feature
# stacks (celery, channels, DRF, neo4j, ...) that their enabled BUILD_* flags
# require, exactly as before the repository split.
dependencies = [
    "Django>=4.2",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://gitlab.com/janhagit-group/toto_libs"

[tool.setuptools.dynamic]
version = { attr = "toto.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["toto*"]

[tool.setuptools.package-data]
"*" = [
    "templates/**/*.html",
    "static/**/*",
    "graph/*.yaml",
    "config/*.yaml",
]
