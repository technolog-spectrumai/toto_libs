[project]
name = "toto"
version = "0.1.0"
description = "Shared Django apps"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2"
]

[tool.setuptools]
packages = [
    "toto",
    "toto.core",
    "toto.events",
    "toto.gervazy",
    "toto.kanban",
    "toto.kanban.graph",
    "toto.kanban.management",
    "toto.kanban.management.commands",
    "toto.kanban.migrations",
    "toto.locations",
    "toto.locations.graph",
    "toto.socialhub",
    "toto.socialhub.graph",
    "toto.vault",
    "toto.verbena",
    "toto.verbena.graph"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
