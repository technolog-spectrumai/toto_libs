[project]
name = "toto"
version = "0.1.0"
description = "Shared Django apps"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "PyYAML>=6.0",
]

[tool.setuptools]
packages = [
    "toto",
    "toto.conf",
    "toto.core",
    "toto.core.migrations",
    "toto.ui",
    "toto.api",
    "toto.api.migrations",
    "toto.backup",
    "toto.backup.migrations",
    "toto.backup.management",
    "toto.backup.management.commands",
    "toto.backup.services",
    "toto.ingress",
    "toto.people",
    "toto.people.migrations",
    "toto.events",
    "toto.gervazy",
    "toto.gervazy.management",
    "toto.gervazy.management.commands",
    "toto.gervazy.migrations",
    "toto.kanban",
    "toto.kanban.management",
    "toto.kanban.management.commands",
    "toto.kanban.migrations",
    "toto.locations",
    "toto.locations.migrations",
    "toto.locations.plugins",
    "toto.socialhub",
    "toto.socialhub.migrations",
    "toto.socialhub.management",
    "toto.socialhub.management.commands",
    "toto.socialhub.plugins",
    "toto.socialhub.views",
    "toto.vault",
    "toto.verbena",
    "toto.sso_core",
    "toto.sso_master",
    "toto.sso_master.migrations",
    "toto.sso_master.management",
    "toto.sso_master.management.commands",
    "toto.sso_client",
    "toto.sso_client.migrations",
    "toto.sso_client.management",
    "toto.sso_client.management.commands",
    "toto.palimpsest",
    "toto.palimpsest.migrations",
    "toto.palimpsest.management",
    "toto.palimpsest.management.commands",

    "toto.polls",
    "toto.polls.migrations",
    "toto.polls.management",
    "toto.polls.management.commands",
    "toto.bento",
    "toto.bento.migrations",
    "toto.bento.management",
    "toto.bento.management.commands",
    "toto.assets",
    "toto.assets.migrations",
    "toto.assets.services",
