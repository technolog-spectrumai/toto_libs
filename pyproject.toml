[project]
name = "toto"
version = "0.1.0"
description = "Community operating system"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toto*"]

[tool.setuptools.package-data]
"*" = [
    "templates/**/*.html",
    "static/**/*",
    "graph/*.yaml",
    "config/*.yaml",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
