[project]
name = "toto"
version = "0.1.0"
description = "Shared Django apps"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "PyYAML>=6.0",
]

[tool.setuptools]
packages = [
    "toto",
    "toto.conf",
    "toto.core",
    "toto.core.migrations",
    "toto.ui",
    "toto.api",
    "toto.api.migrations",
    "toto.backup",
    "toto.backup.migrations",
    "toto.backup.services",
    "toto.ingress",
    "toto.people",
    "toto.people.migrations",
    "toto.events",
    "toto.gervazy",
    "toto.gervazy.management",
    "toto.gervazy.management.commands",
    "toto.gervazy.migrations",
    "toto.kanban",
    "toto.kanban.management",
    "toto.kanban.management.commands",
    "toto.kanban.migrations",
    "toto.locations",
    "toto.locations.migrations",
    "toto.locations.plugins",
    "toto.socialhub",
    "toto.socialhub.migrations",
    "toto.socialhub.plugins",
    "toto.socialhub.views",
    "toto.vault",
    "toto.verbena",

    "toto.polls",
    "toto.polls.migrations",
    "toto.polls.management",
    "toto.polls.management.commands",
    "toto.bento",
    "toto.bento.migrations",
    "toto.bento.management",
    "toto.bento.management.commands",
    # --- formerly studio apps ---
    "toto.enigma",
    "toto.enigma.agent",
    "toto.enigma.management",
    "toto.enigma.management.commands",
    "toto.enigma.migrations",
    "toto.enigma.services",
    "toto.ravioli",
    "toto.ravioli.management",
    "toto.ravioli.management.commands",
    "toto.ravioli.migrations",
    "toto.texlab",
    "toto.texlab.management",
    "toto.texlab.management.commands",
    "toto.texlab.migrations",
    "toto.mandragora",
    "toto.mandragora.management",
    "toto.mandragora.management.commands",
    "toto.mandragora.migrations",
    "toto.sketch",
    "toto.sketch.management",
    "toto.sketch.management.commands",
    "toto.sketch.migrations",
    "toto.ocr",
    "toto.ocr.management",
    "toto.ocr.management.commands",
    "toto.ocr.migrations",
    "toto.steven",
    "toto.steven.management",
    "toto.steven.management.commands",
    "toto.steven.migrations",
    "toto.steven.plugins",
    "toto.steven.services",
    "toto.travels",
    "toto.travels.management",
    "toto.travels.management.commands",
    "toto.travels.migrations",
    "toto.travels.plugins",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
