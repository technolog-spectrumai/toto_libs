    "toto.enigma",
    "toto.enigma.agent",
    "toto.enigma.management",
    "toto.enigma.management.commands",
    "toto.enigma.migrations",
    "toto.enigma.services",
    "toto.ravioli",
    "toto.ravioli.management",
    "toto.ravioli.management.commands",
    "toto.ravioli.migrations",
    "toto.texlab",
    "toto.texlab.management",
    "toto.texlab.management.commands",
    "toto.texlab.migrations",
    "toto.mandragora",
    "toto.mandragora.management",
    "toto.mandragora.management.commands",
    "toto.mandragora.migrations",
    "toto.sketch",
    "toto.sketch.management",
    "toto.sketch.management.commands",
    "toto.sketch.migrations",
    "toto.ocr",
