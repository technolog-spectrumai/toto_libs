[project]
name = "toto"
version = "0.1.0"
description = "Shared Django apps"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2"
]

[tool.setuptools]
packages = [
    "toto",
    "toto.core",
    "toto.events",
    "toto.gervazy",
    "toto.kanban",
    "toto.kanban.graph",
    "toto.kanban.management",
    "toto.kanban.management.commands",
    "toto.kanban.migrations",
    "toto.locations",
    "toto.locations.graph",
    "toto.locations.migrations",
    "toto.locations.plugins",
    "toto.socialhub",
    "toto.socialhub.graph",
    "toto.socialhub.migrations",
    "toto.socialhub.plugins",
    "toto.socialhub.views",
    "toto.vault",
    "toto.verbena",
    "toto.verbena.graph",
    "toto.noosphere",
    "toto.noosphere.migrations",
    "toto.noosphere.services",
    "toto.polls",
    "toto.polls.migrations",
    "toto.polls.management",
    "toto.polls.management.commands",
    "toto.bento",
    "toto.bento.graph",
    "toto.bento.migrations",
    "toto.bento.management",
    "toto.bento.management.commands",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
